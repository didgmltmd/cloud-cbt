는 EU 밖에 저장되면 안 된다는 규정이 있다. Amazon S3 설계와 관련해 옳은 설명을 고르시오.", "options": ["EU 내 리전(예: 프랑크푸르트)에 버킷을 생성해 데이터를 저장한다", "S3 데이터는 사용자가 복제 등을 구성하지 않는 한 버킷을 생성한 리전 밖으로 이동하지 않는다", "버킷을 만들 때 리전을 지정하지 않으며, AWS가 사용자와 가장 가까운 리전을 자동으로 고른다", "Transfer Acceleration을 켜면 데이터가 엣지 로케이션에 영구 저장된다", "S3는 글로벌 서비스이므로 데이터가 자동으로 모든 리전에 복제된다"], "answer": [0, 1], "explain": "S3 버킷은 특정 리전에 생성되며, 사용자가 명시적으로 복제·복사하지 않는 한 데이터는 그 리전에 머뭅니다. 데이터 주권 요구가 있으면 해당 지역의 리전을 선택합니다.", "why": ["정답. 규정을 충족하는 리전을 선택합니다.", "정답. 리전 간 이동은 사용자가 구성해야 일어납니다.", "버킷은 생성 시 사용자가 리전을 선택하며 AWS가 임의로 고르지 않습니다.", "엣지 로케이션은 전송 경로로만 쓰이며 데이터를 영구 저장하지 않습니다.", "S3 데이터는 리전에 저장되며 자동으로 다른 리전에 복제되지 않습니다."], "tags": ["S3", "리전 선택", "데이터 주권"]}, {"id": "m4-044", "module": 4, "level": "saa", "pick": 1, "q": "한 동영상 학습 사이트는 S3 버킷에 강의 영상을 저장하고 있다. 전 세계 수강생이 같은 영상을 반복해서 내려받는데, 먼 지역 사용자의 재생 지연이 크고 S3 데이터 송신 비용도 높다. 가장 적절한 개선 방법은?", "options": ["멀티파트 업로드를 사용한다", "S3 Transfer Acceleration을 활성화한다", "영상을 S3 Glacier Instant Retrieval로 전환한다", "S3 버킷을 오리진으로 하는 Amazon CloudFront 배포를 만들어 영상을 캐시·배포한다"], "answer": [3], "explain": "CloudFront는 엣지 로케이션에 콘텐츠를 캐시해 반복 다운로드의 지연 시간을 줄이고, 오리진(S3)까지 오는 요청을 줄여 줍니다. 교재의 미디어 호스팅 사용 사례와 같은 구조입니다.", "why": ["멀티파트는 업로드 기능으로 다운로드 지연과 무관합니다.", "Transfer Acceleration은 버킷으로의 장거리 전송을 가속하며 캐시 기능이 없습니다.", "자주 조회되는 영상에 아카이브 등급은 검색 요금이 늘어 부적합합니다.", "정답. 반복 다운로드 + 전 세계 사용자 = CloudFront 캐시."], "tags": ["S3", "CloudFront", "미디어 호스팅"]}, {"id": "m4-045", "module": 4, "level": "saa", "pick": 1, "q": "한 회사는 평균 크기가 약 40KB인 작은 객체 수백만 개를 비용 절감을 위해 S3 Standard-IA로 옮겼다. 그런데 스토리지 비용이 예상보다 오히려 늘었다. 가장 가능성 높은 원인은?", "options": ["Standard-IA는 데이터를 단일 AZ에만 저장하기 때문이다", "Standard-IA는 최소 180일 보관 요금이 적용되기 때문이다", "Standard-IA는 객체당 최소 과금 크기가 128KB이므로 작은 객체도 128KB로 계산된다", "Standard-IA는 객체 수에 따라 자동 계층화 모니터링 요금이 부과되기 때문이다"], "answer": [2], "explain": "Standard-IA, One Zone-IA, Glacier Instant Retrieval은 객체당 최소 과금 크기가 128KB입니다. 작은 객체가 많으면 실제보다 훨씬 큰 용량으로 과금되어 Standard보다 비싸질 수 있습니다.", "why": ["단일 AZ 저장은 One Zone-IA의 특징입니다.", "Standard-IA의 최소 기간은 30일이며 180일은 Deep Archive입니다.", "정답. 40KB 객체도 128KB로 과금됩니다.", "모니터링·자동화 요금은 Intelligent-Tiering의 특징입니다."], "tags": ["S3", "비용", "스토리지 등급"]}, {"id": "m4-046", "module": 4, "level": "saa", "pick": 1, "q": "한 회사가 수명 주기 규칙으로 데이터를 S3 Glacier Deep Archive에 보관했다가, 규정 변경으로 저장 60일 만에 해당 객체를 삭제했다. 이 객체의 요금은 어떻게 처리되는가?", "options": ["Deep Archive는 삭제할 수 없으므로 180일이 지나야 자동 삭제된다", "조기 삭제 시 저장했던 60일분의 요금이 환불된다", "60일분의 스토리지 요금만 부과된다", "최소 스토리지 기간 180일 중 남은 120일분에 해당하는 요금이 추가로 부과된다"], "answer": [3], "explain": "Deep Archive는 최소 스토리지 기간이 180일이므로, 그 전에 삭제하거나 전환하면 남은 기간에 해당하는 요금이 비례해서 부과됩니다. 최소 기간은 삭제를 막는 장치가 아니라 요금 규칙입니다.", "why": ["삭제는 언제든 가능하며, 요금만 최소 기간 기준으로 계산됩니다.", "환불되지 않으며 오히려 남은 기간 요금이 부과됩니다.", "최소 기간 요금이 적용되므로 60일분만 내지 않습니다.", "정답. 남은 120일분이 비례 과금됩니다."], "tags": ["S3", "Glacier Deep Archive", "최소 기간", "비용"]}, {"id": "m4-047", "module": 4, "level": "saa", "pick": 2, "q": "S3 Standard에 저장되던 객체를 수명 주기 규칙으로 S3 Glacier Flexible Retrieval에 아카이브했다. 이 객체에 대한 설명으로 옳은 것을 고르시오.", "options": ["객체에 접근하려면 먼저 복원(restore) 요청을 해서 임시 사본을 만들어야 한다", "수명 주기 규칙으로는 이 등급에 전환할 수 없고 직접 업로드만 가능하다", "최소 90일의 스토리지 기간 요금이 적용된다", "일반 GET 요청으로 밀리초 단위에 즉시 읽을 수 있다", "데이터가 단일 가용 영역에만 저장된다"], "answer": [0, 2], "explain": "Glacier Flexible Retrieval은 복원 요청(신속·표준·대량 옵션)을 거쳐야 접근할 수 있으며, 최소 90일 스토리지 기간 요금이 적용됩니다. 데이터는 여러 AZ에 저장되고 수명 주기 전환 대상이 될 수 있습니다.", "why": ["정답. 복원 후 임시 사본으로 접근합니다.", "수명 주기 규칙의 대표적인 전환 대상입니다.", "정답. Glacier Flexible Retrieval의 최소 기간은 90일입니다.", "밀리초 접근은 Glacier Instant Retrieval의 특징입니다.", "3개 이상의 AZ에 저장됩니다."], "tags": ["S3", "Glacier Flexible Retrieval", "아카이브"]}, {"id": "m4-048", "module": 4, "level": "saa", "pick": 1, "q": "Solutions Architect가 S3에 저장된 고객 데이터를 설계하면서 AWS Well-Architected Framework의 '저장된 데이터 보호' 모범 사례를 적용하려 한다. 이 모범 사례와 가장 직접적으로 관련된 조치는?", "options": ["S3 Transfer Acceleration을 활성화한다", "S3 Intelligent-Tiering으로 비용을 최적화한다", "저장 데이터에 서버 측 암호화를 적용하고 키 접근을 통제한다", "멀티파트 업로드로 처리량을 높인다"], "answer": [2], "explain": "보안 원칙의 데이터 보호(저장된 데이터 보호) 모범 사례는 저장 시 암호화와 접근 제어를 적용하는 것입니다. S3에서는 SSE-S3·SSE-KMS 같은 서버 측 암호화와 정책 기반 접근 제어가 이에 해당합니다.", "why": ["성능(전송) 관련 조치입니다.", "비용 최적화 원칙에 해당합니다.", "정답. 저장 시 암호화 = 저장된 데이터 보호.", "성능 관련 조치입니다."], "tags": ["S3", "Well-Architected", "암호화"]}, {"id": "m5-001", "module": 5, "level": "basic", "pick": 2, "q": "교재의 AWS 컴퓨팅 서비스 범주에서 '서버리스'에 해당하는 서비스를 고르시오.", "options": ["Amazon Lightsail", "Amazon EKS", "AWS Elastic Beanstalk", "AWS Lambda", "AWS Fargate"], "answer": [3, 4], "explain": "교재는 컴퓨팅 옵션을 VM(EC2), 컨테이너(ECS·EKS), VPS(Lightsail), PaaS(Elastic Beanstalk), 서버리스(Lambda·Fargate)로 분류합니다. 서버리스는 서버를 프로비저닝·관리하지 않고 워크로드를 실행합니다.", "why": ["Lightsail은 가상 프라이빗 서버(VPS) 범주입니다.", "EKS는 관리형 Kubernetes로 컨테이너 범주입니다.", "Elastic Beanstalk은 서비스형 플랫폼(PaaS) 범주입니다.", "정답. 이벤트에 따라 코드를 실행하는 서버리스 컴퓨팅입니다.", "정답. 컨테이너를 위한 서버리스 컴퓨팅 엔진입니다."], "tags": ["EC2", "컴퓨팅 옵션", "지식확인"]}, {"id": "m5-002", "module": 5, "level": "basic", "pick": 1, "q": "몇 개의 가상 서버만 필요하고, 간단한 관리 화면과 저렴하고 예측 가능한 월별 요금으로 웹 사이트나 블로그를 빠르게 시작하려는 사용자에게 가장 적합한 서비스는?", "options": ["Amazon Lightsail", "Amazon EC2 전용 호스트", "Amazon EKS", "AWS Batch"], "answer": [0], "explain": "Amazon Lightsail은 VM, 스토리지, 네트워킹, DNS 등 필요한 것을 묶어 예측 가능한 월 요금으로 제공하는 VPS 서비스입니다. 단순한 웹 사이트·블로그·소규모 앱에 적합합니다.", "why": ["정답. 간단한 VPS와 월정액 요금이 특징입니다.", "전용 호스트는 라이선스·규정 준수용 물리 서버로 비용이 높습니다.", "EKS는 Kubernetes 컨테이너 운영용으로 단순 블로그에는 과합니다.", "AWS Batch는 배치 작업 실행 관리형 서비스입니다."], "tags": ["EC2", "Lightsail", "컴퓨팅 옵션", "지식확인"]}, {"id": "m5-003", "module": 5, "level": "basic", "pick": 3, "q": "Amazon Machine Image(AMI)에 포함되는 정보를 고르시오.", "options": ["블록 디바이스 매핑(연결할 스토리지 볼륨 지정)", "루트 볼륨용 템플릿(게스트 OS와 설치된 소프트웨어)", "시작 권한(AMI를 사용할 수 있는 계정 제어)", "보안 그룹 인바운드 규칙", "IAM 사용자의 액세스 키"], "answer": [0, 1, 2], "explain": "AMI는 인스턴스 시작에 필요한 정보로 루트 볼륨 템플릿, 시작 권한, 블록 디바이스 매핑을 포함합니다. 보안 그룹·키 페어 등은 인스턴스를 시작할 때 따로 지정합니다.", "why": ["정답. 시작 시 연결할 볼륨을 지정합니다.", "정답. OS와 애플리케이션·라이브러리가 포함됩니다.", "정답. 어떤 AWS 계정이 AMI를 쓸 수 있는지 제어합니다.", "보안 그룹은 인스턴스 시작 시 지정하는 네트워크 설정입니다.", "액세스 키는 AMI 구성 요소가 아니며, 이미지에 넣어서도 안 됩니다."], "tags": ["EC2", "AMI", "지식확인"]}, {"id": "m5-004", "module": 5, "level": "basic", "pick": 3, "q": "교재에서 설명한 AMI 사용의 이점을 고르시오.", "options": ["AMI를 만들면 모든 리전에서 자동으로 사용 가능", "복구성 – 실패한 인스턴스를 같은 AMI로 교체 가능", "재사용성 – 같은 AMI에서 시작한 인스턴스는 동일하게 구성됨", "반복성 – 같은 구성으로 인스턴스를 효율적이고 정확하게 반복 시작", "인스턴스 요금 자동 할인"], "answer": [1, 2, 3], "explain": "AMI의 이점은 반복성, 재사용성, 복구성입니다. 구성을 바꿨다면 새 AMI를 만들어 두어야 실패 시 최신 구성으로 복구할 수 있습니다.", "why": ["AMI는 리전 리소스이므로 다른 리전에서 쓰려면 복사해야 합니다.", "정답. 복구성입니다.", "정답. 재사용성입니다.", "정답. 반복성입니다.", "AMI는 요금 할인과 관계없습니다. 할인은 RI·Savings Plans 등 구매 옵션의 역할입니다."], "tags": ["EC2", "AMI", "지식확인"]}, {"id": "m5-005", "module": 5, "level": "basic", "pick": 1, "q": "AMI를 선택할 때 최상의 성능을 얻기 위해 교재가 권장하는 가상화 유형은?", "options": ["에뮬레이션", "반가상화(PV)", "하드웨어 가상 머신(HVM)", "컨테이너 가상화"], "answer": [2], "explain": "AMI의 가상화 유형에는 반가상화(PV)와 하드웨어 가상 머신(HVM)이 있으며, HVM은 특수 하드웨어 확장을 활용할 수 있어 성능이 더 좋습니다. 교재는 최상의 성능을 위해 HVM AMI를 권장합니다.", "why": ["에뮬레이션은 AMI 가상화 유형 선택지가 아닙니다.", "PV는 구형 방식으로 하드웨어 확장 활용이 제한됩니다.", "정답. HVM을 사용합니다.", "컨테이너는 AMI의 가상화 유형이 아닙니다."], "tags": ["EC2", "AMI", "지식확인"]}, {"id": "m5-006", "module": 5, "level": "basic", "pick": 1, "q": "AMI 소스 중 다른 사용자가 공유한 것으로, AWS의 검증을 거치지 않아 사용에 따른 위험을 사용자가 부담해야 하는 것은?", "options": ["Quick Start AMI", "커뮤니티 AMI", "내 AMI(My AMIs)", "AWS Marketplace AMI"], "answer": [1], "explain": "커뮤니티 AMI는 전 세계 사용자가 만들어 공유한 이미지로 AWS가 검증하지 않습니다. 특히 프로덕션이나 회사 환경에서는 사용을 피하라고 교재는 안내합니다.", "why": ["Quick Start는 AWS가 구축해 제공하는 AMI입니다.", "정답. 검증되지 않은 공유 AMI입니다.", "내 AMI는 사용자가 직접 만든 AMI입니다.", "Marketplace는 소프트웨어 공급업체가 제공하는 사전 구성 AMI 카탈로그입니다."], "tags": ["EC2", "AMI", "지식확인"]}, {"id": "m5-007", "module": 5, "level": "basic", "pick": 2, "q": "인스턴스 스토어 지원 AMI로 시작한 인스턴스에 대한 설명으로 옳은 것을 고르시오.", "options": ["EBS 지원 인스턴스보다 부팅이 더 빠르다", "인스턴스를 중지할 수 없으므로 인스턴스 유형을 변경할 수 없다", "루트 디바이스 최대 크기가 16TiB이다", "인스턴스를 중지할 수 없고 재부팅 또는 종료만 가능하다", "인스턴스를 종료해도 루트 볼륨의 데이터가 유지된다"], "answer": [1, 3], "explain": "인스턴스 스토어 지원 인스턴스는 중지 상태가 없어 유형 변경이 불가능하며, 이미지 파트를 S3에서 가져오므로 부팅이 느리고 루트 최대 크기는 10GiB입니다. EBS 지원 인스턴스는 더 빨리 부팅되고 루트가 최대 16TiB입니다.", "why": ["부팅이 더 빠른 것은 EBS 지원 인스턴스입니다.", "정답. 유형 변경에는 중지가 필요합니다.", "16TiB는 EBS 지원 루트 디바이스의 최대 크기입니다. 인스턴스 스토어는 10GiB입니다.", "정답. 실행 중 또는 종료 상태만 가집니다.", "인스턴스 스토어 데이터는 종료 시 사라집니다."], "tags": ["EC2", "AMI", "인스턴스 스토어", "지식확인"]}, {"id": "m5-008", "module": 5, "level": "basic", "pick": 1, "q": "실행 중인 EBS 지원 EC2 인스턴스를 재부팅(reboot)했을 때의 설명으로 옳은 것은?", "options": ["같은 물리 호스트에 유지되고 퍼블릭 DNS 이름과 퍼블릭 IP 주소가 그대로 유지된다", "인스턴스가 종료되고 같은 AMI로 새 인스턴스가 만들어진다", "인스턴스 스토어 볼륨의 데이터가 모두 삭제된다", "새 물리 호스트로 이동하고 새 퍼블릭 IPv4 주소를 받는다"], "answer": [0], "explain": "재부팅은 OS를 다시 시작하는 것으로, 인스턴스는 같은 호스트에 머물며 퍼블릭 DNS·IP와 인스턴스 스토어 데이터가 유지됩니다. 호스트 이동과 IP 변경은 중지 후 시작할 때 일어납니다.", "why": ["정답. 재부팅은 같은 호스트에서 이루어집니다.", "재부팅은 인스턴스를 교체하지 않습니다.", "인스턴스 스토어 데이터는 재부팅 시 유지됩니다.", "중지 후 시작할 때의 동작입니다."], "tags": ["EC2", "인스턴스 수명 주기", "지식확인"]}, {"id": "m5-009", "module": 5, "level": "basic", "pick": 2, "q": "탄력적 IP가 연결되지 않은 EBS 지원 인스턴스를 중지했다가 다시 시작했다. 일반적으로 일어나는 일을 고르시오.", "options": ["프라이빗 IP 주소가 새로 바뀐다", "인스턴스 스토어 볼륨의 데이터도 그대로 유지된다", "새 퍼블릭 IPv4 주소가 할당된다", "EBS 루트 볼륨의 데이터는 유지된다", "인스턴스 ID가 새로 바뀐다"], "answer": [2, 3], "explain": "중지 후 시작하면 보통 새 호스트로 옮겨지므로 자동 할당된 퍼블릭 IPv4가 바뀌고 인스턴스 스토어 데이터는 사라집니다. EBS 볼륨 데이터, 인스턴스 ID, 프라이빗 IP는 유지됩니다.", "why": ["VPC의 프라이빗 IP는 중지·시작 시 유지됩니다.", "인스턴스 스토어는 중지 시 데이터가 손실됩니다.", "정답. 고정 퍼블릭 IP가 필요하면 탄력적 IP를 사용합니다.", "정답. EBS는 영구 스토리지입니다.", "같은 인스턴스를 다시 시작하는 것이므로 ID는 유지됩니다."], "tags": ["EC2", "인스턴스 수명 주기", "지식확인"]}, {"id": "m5-010", "module": 5, "level": "basic", "pick": 1, "q": "EBS 지원 인스턴스를 '절전 모드(hibernate)'로 중지할 때의 특징으로 옳은 것은?", "options": ["인스턴스를 종료하고 AMI를 자동으로 만든다", "메모리(RAM)의 내용을 EBS 루트 볼륨에 저장해 다시 시작할 때 이전 상태로 이어서 실행한다", "메모리 내용을 인스턴스 스토어에 저장한다", "인스턴스가 실행 중인 것과 같은 컴퓨팅 요금이 계속 부과된다"], "answer": [1], "explain": "절전 모드는 RAM 내용을 EBS 루트 볼륨에 저장하고, 다시 시작하면 저장한 메모리 상태를 복원해 프로세스를 이어서 실행합니다. 프라이빗 IP와 탄력적 IP도 유지됩니다.", "why": ["절전 모드는 종료나 AMI 생성과 다릅니다.", "정답. 인 메모리 상태를 EBS에 보존합니다.", "인스턴스 스토어는 중지·절전 시 데이터가 사라지므로 저장 위치가 될 수 없습니다.", "절전 상태(중지됨)에서는 인스턴스 사용 요금이 부과되지 않습니다."], "tags": ["EC2", "인스턴스 수명 주기", "절전 모드", "지식확인"]}, {"id": "m5-011", "module": 5, "level": "basic", "pick": 1, "q": "인스턴스 유형 이름 'c7gn.xlarge'에서 'g'가 나타내는 것은?", "options": ["인스턴스 세대", "GPU가 장착된 가속 컴퓨팅", "인스턴스 크기", "AWS Graviton 프로세서 사용"], "answer": [3], "explain": "c7gn.xlarge에서 c는 패밀리(컴퓨팅 최적화), 7은 세대, g는 프로세서 패밀리(AWS Graviton), n은 추가 기능(네트워크·EBS 최적화), xlarge는 크기입니다.", "why": ["세대는 숫자 7입니다.", "GPU 가속 인스턴스는 P, G 같은 별도 패밀리입니다.", "크기는 마침표 뒤의 xlarge입니다.", "정답. g는 Graviton 프로세서를 뜻합니다."], "tags": ["EC2", "인스턴스 유형", "지식확인"]}, {"id": "m5-012", "module": 5, "level": "basic", "pick": 2, "q": "워크로드와 권장 EC2 인스턴스 패밀리의 연결이 올바른 것을 고르시오.", "options": ["트랜잭션 데이터베이스 – T 패밀리", "인 메모리 캐시 – R 패밀리", "기계 학습 – M 패밀리", "배치 처리 – C 패밀리", "소규모 개발 환경 – I 패밀리"], "answer": [1, 3], "explain": "교재 활동의 정답은 트랜잭션 DB–I, 소규모 개발 환경–T, 게임 서버–M, 인 메모리 캐시–R, 이미지·비디오 생성–Inf2, 기계 학습–P, 배치 처리–C입니다.", "why": ["트랜잭션 DB는 스토리지 최적화 I 패밀리가 권장됩니다.", "정답. 메모리 최적화 R 패밀리입니다.", "기계 학습은 가속 컴퓨팅 P 패밀리가 권장됩니다.", "정답. 컴퓨팅 최적화 C 패밀리입니다.", "소규모 개발 환경은 범용 버스터블 T 패밀리가 권장됩니다."], "tags": ["EC2", "인스턴스 유형", "지식확인"]}, {"id": "m5-013", "module": 5, "level": "basic", "pick": 1, "q": "이미 실행 중인 EC2 인스턴스의 구성과 사용률 지표를 기계 학습으로 분석해 '과소 프로비저닝', '초과 프로비저닝', '최적화' 등으로 분류하고 적정 인스턴스 유형을 권장하는 서비스는?", "options": ["AWS Compute Optimizer", "Amazon EC2 콘솔의 Instance Types 페이지", "EC2 Image Builder", "AWS Trusted Advisor"], "answer": [0], "explain": "AWS Compute Optimizer는 EC2 인스턴스와 Auto Scaling 그룹의 사용률을 분석해 비용 절감·성능 개선을 위한 권장 사항을 제공합니다. 새 인스턴스를 고를 때는 콘솔의 Instance Types 페이지로 필터링합니다.", "why": ["정답. 기존 인스턴스의 적정 크기 권장 서비스입니다.", "Instance Types 페이지는 새 인스턴스 선택 시 유형을 검색·필터링하는 도구입니다.", "Image Builder는 AMI 생성·관리 자동화 서비스입니다.", "Trusted Advisor는 여러 모범 사례 점검을 제공하지만, 문제에서 설명한 분류·권장은 Compute Optimizer의 기능입니다."], "tags": ["EC2", "Compute Optimizer", "지식확인"]}, {"id": "m5-014", "module": 5, "level": "basic", "pick": 2, "q": "EC2 인스턴스의 루트(부팅) 볼륨으로 사용할 수 있는 것을 고르시오.", "options": ["처리량 최적화 HDD(st1) EBS 볼륨", "콜드 HDD(sc1) EBS 볼륨", "범용 SSD(gp2) EBS 볼륨", "Amazon EFS 파일 시스템", "인스턴스 스토어 볼륨"], "answer": [2, 4], "explain": "루트 볼륨에는 인스턴스 스토어 또는 SSD 지원 EBS 볼륨만 사용할 수 있습니다. HDD 볼륨(st1, sc1)은 부팅 볼륨으로 쓸 수 없고, EFS는 공유 데이터용 파일 시스템입니다.", "why": ["HDD 지원 볼륨은 부팅 볼륨으로 사용할 수 없습니다.", "HDD 지원 볼륨은 부팅 볼륨으로 사용할 수 없습니다.", "정답. SSD 지원 EBS는 부팅 볼륨으로 사용 가능합니다.", "EFS는 여러 Linux 인스턴스가 공유하는 데이터 볼륨용입니다.", "정답. 인스턴스 스토어 지원 AMI의 루트 볼륨입니다."], "tags": ["EC2", "EBS", "스토리지", "지식확인"]}, {"id": "m5-015", "module": 5, "level": "basic", "pick": 3, "q": "Amazon EBS 볼륨의 특징으로 옳은 것을 고르시오.", "options": ["인스턴스가 실행되는 물리 호스트에 직접 붙은 임시 스토리지이다", "스냅샷을 만들어 Amazon S3에 영구 저장되는 백업을 만들 수 있다", "여러 리전의 인스턴스에 동시에 탑재할 수 있다", "같은 가용 영역에 있는 인스턴스에 연결할 수 있다", "볼륨을 암호화할 수 있다"], "answer": [1, 3, 4], "explain": "EBS는 네트워크로 연결되는 영구 블록 스토리지로, 같은 AZ의 인스턴스에 연결하며 암호화와 스냅샷 백업을 지원합니다. 데이터는 인스턴스 수명과 독립적으로 유지됩니다.", "why": ["인스턴스 스토어에 대한 설명입니다.", "정답. 특정 시점 스냅샷을 S3에 백업합니다.", "EBS는 리전을 넘어 탑재할 수 없습니다.", "정답. EBS는 AZ 단위 리소스입니다.", "정답. 저장 데이터를 암호화할 수 있습니다."], "tags": ["EC2", "EBS", "지식확인"]}, {"id": "m5-016", "module": 5, "level": "basic", "pick": 1, "q": "자주 액세스하지 않는 대용량 데이터를 위한 처리량 중심 스토리지로, GB당 비용이 모든 EBS 볼륨 유형 중 가장 저렴한 것은?", "options": ["범용 SSD(gp2)", "프로비저닝된 IOPS SSD(io1)", "처리량 최적화 HDD(st1)", "콜드 HDD(sc1)"], "answer": [3], "explain": "콜드 HDD(sc1)는 가장 저렴한 HDD 볼륨으로, 접근 빈도가 낮은 대량의 콜드 데이터에 적합합니다. 자주 접근하는 처리량 집약 워크로드에는 st1을 사용합니다.", "why": ["gp2는 가격과 성능의 균형을 맞춘 범용 SSD입니다.", "io1은 가장 높은 성능의 SSD로 비용도 높습니다.", "st1은 자주 접근하는 처리량 집약 워크로드용입니다.", "정답. 가장 저렴한 EBS 볼륨 유형입니다."], "tags": ["EC2", "EBS", "볼륨 유형", "지식확인"]}, {"id": "m5-017", "module": 5, "level": "basic", "pick": 3, "q": "EC2 인스턴스 스토어의 적절한 사용 사례를 고르시오.", "options": ["버퍼", "장기 보관이 필요한 데이터베이스 파일", "캐시", "여러 인스턴스가 함께 쓰는 공유 파일", "스크래치(임시 작업) 데이터"], "answer": [0, 2, 4], "explain": "인스턴스 스토어는 호스트에 물리적으로 연결된 임시 블록 스토리지로, 중지·종료 시 데이터가 사라집니다. 버퍼, 캐시, 스크래치 데이터처럼 자주 바뀌고 다시 만들 수 있는 데이터에 적합합니다.", "why": ["정답. 임시 데이터 용도입니다.", "영구 보관이 필요한 데이터는 EBS를 사용합니다.", "정답. 임시 데이터 용도입니다.", "공유 파일은 EFS 또는 FSx for Windows File Server를 사용합니다.", "정답. 임시 데이터 용도입니다."], "tags": ["EC2", "인스턴스 스토어", "지식확인"]}, {"id": "m5-018", "module": 5, "level": "basic", "pick": 1, "q": "Amazon EFS가 EC2 인스턴스에 파일 시스템을 제공할 때 사용하는 프로토콜은?", "options": ["NFS(Network File System) v4", "iSCSI", "SMB", "FTP"], "answer": [0], "explain": "Amazon EFS는 NFS 버전 4.x 프로토콜을 사용하는 Linux용 완전관리형 탄력적 파일 시스템입니다. 여러 EC2 인스턴스가 동시에 탑재해 공용 데이터 소스로 사용할 수 있습니다.", "why": ["정답. EFS는 NFSv4를 사용합니다.", "iSCSI는 블록 스토리지 프로토콜입니다.", "SMB는 FSx for Windows File Server가 사용하는 프로토콜입니다.", "FTP는 파일 전송 프로토콜로 Transfer Family가 지원합니다."], "tags": ["EC2", "EFS", "지식확인"]}, {"id": "m5-019", "module": 5, "level": "basic", "pick": 2, "q": "Amazon FSx for Windows File Server의 특징으로 옳은 것을 고르시오.", "options": ["SMB 프로토콜과 NTFS를 기본 지원한다", "인스턴스를 중지하면 데이터가 사라지는 임시 스토리지이다", "Linux 인스턴스 전용으로 NFS만 지원한다", "Microsoft Active Directory와 통합되고 Windows ACL을 지원한다", "한 번에 하나의 인스턴스에만 연결되는 블록 스토리지이다"], "answer": [0, 3], "explain": "FSx for Windows File Server는 Windows Server 기반의 완전관리형 공유 파일 시스템으로 SMB, NTFS, DFS, Active Directory 통합, Windows ACL을 지원합니다. 여러 Windows 인스턴스가 공유하는 데이터에 사용합니다.", "why": ["정답. 네이티브 Windows 호환성입니다.", "인스턴스 스토어에 대한 설명입니다.", "Linux·NFS 공유 파일 시스템은 Amazon EFS입니다.", "정답. AD 통합과 파일·폴더 수준 권한을 지원합니다.", "EBS에 대한 설명입니다."], "tags": ["EC2", "FSx for Windows", "지식확인"]}, {"id": "m5-020", "module": 5, "level": "basic", "pick": 2, "q": "EC2 사용자 데이터(user data)에 대한 설명으로 옳은 것을 고르시오.", "options": ["인스턴스 메타데이터와 같은 의미이다", "기본적으로 인스턴스를 처음 시작할 때 한 번 실행된다", "루트(관리자) 권한으로 실행된다", "실행 결과를 확인할 수 있는 로그가 남지 않는다", "인스턴스를 재부팅할 때마다 자동으로 다시 실행된다"], "answer": [1, 2], "explain": "사용자 데이터는 시작 시 셸 스크립트나 cloud-init 지시문으로 패키지 설치·설정을 자동화하며, 기본적으로 최초 시작 시 루트 권한으로 실행됩니다. Linux에서는 /var/log/cloud-init-output.log에 로그가 남습니다.", "why": ["메타데이터는 실행 중인 인스턴스에 대한 정보(인스턴스 ID, IP 등)입니다.", "정답. 기본 동작은 최초 1회 실행입니다.", "정답. 루트 또는 관리자 권한으로 실행됩니다.", "Linux는 /var/log/cloud-init-output.log에 로그가 생성됩니다.", "재실행하려면 별도 절차(config_scripts_user 파일 제거 등)가 필요합니다."], "tags": ["EC2", "사용자 데이터", "지식확인"]}, {"id": "m5-021", "module": 5, "level": "basic", "pick": 1, "q": "실행 중인 EC2 인스턴스 내부에서 자신의 인스턴스 ID, 퍼블릭 IP, 가용 영역 같은 메타데이터를 조회할 때 사용하는 주소는?", "options": ["http://10.0.0.1/latest/meta-data/", "http://169.254.169.254/latest/meta-data/", "http://127.0.0.1/latest/meta-data/", "https://ec2.amazonaws.com/meta-data/"], "answer": [1], "explain": "인스턴스 메타데이터는 링크-로컬 주소 169.254.169.254를 통해 인스턴스 내부에서만 조회할 수 있습니다. 사용자 데이터는 /latest/user-data 경로로 확인할 수 있습니다.", "why": ["VPC 내부의 일반 프라이빗 주소는 메타데이터 서비스가 아닙니다.", "정답. 인스턴스 메타데이터 서비스 주소입니다.", "127.0.0.1은 자기 자신(루프백) 주소로 메타데이터 서비스가 아닙니다.", "메타데이터는 퍼블릭 API 엔드포인트가 아닌 링크-로컬 주소로 제공됩니다."], "tags": ["EC2", "메타데이터", "지식확인"]}, {"id": "m5-022", "module": 5, "level": "basic", "pick": 1, "q": "AMI 배포 모델 중 애플리케이션과 모든 종속성이 미리 포함된 변경 불가능한 이미지로, 부팅 시간은 가장 짧지만 이미지 구축 시간은 늘어나는 모델은?", "options": ["골든 AMI", "기본 AMI", "커뮤니티 AMI", "실버 AMI"], "answer": [0], "explain": "골든 AMI는 구성을 모두 이미지에 포함(베이킹)한 변경 불가능 모델로, 동일하게 동작하는 인스턴스를 빠르게 시작할 수 있습니다. 대신 변경할 때마다 이미지를 다시 만들어야 해 구축 시간이 늘고 수명이 짧습니다.", "why": ["정답. 부팅 빠름·구축 느림·변경 불가능.", "기본 AMI는 OS만 포함해 구축은 빠르지만 부팅 시 설치 작업으로 부팅이 느립니다.", "커뮤니티 AMI는 AMI의 출처(소스)이지 배포 모델이 아닙니다.", "실버 AMI는 구성 절반 정도를 포함한 변경 가능 모델로 중간 절충점입니다."], "tags": ["EC2", "AMI 배포 모델", "지식확인"]}, {"id": "m5-023", "module": 5, "level": "basic", "pick": 2, "q": "EC2 배치 그룹의 제약 사항으로 교재에서 설명한 것을 고르시오.", "options": ["인스턴스는 한 번에 하나의 배치 그룹에서만 시작할 수 있다", "테넌시가 '호스트'인 인스턴스는 배치 그룹에서 시작할 수 없다", "배치 그룹에는 같은 AMI로 만든 인스턴스만 넣을 수 있다", "배치 그룹을 사용하면 인스턴스 요금이 할인된다", "클러스터 배치 그룹은 여러 리전에 걸쳐 만들 수 있다"], "answer": [0, 1], "explain": "교재가 제시한 배치 그룹 제약은 두 가지입니다. 인스턴스는 한 번에 하나의 배치 그룹에만 속할 수 있고, 테넌시가 호스트(전용 호스트)인 인스턴스는 배치 그룹에서 시작할 수 없습니다.", "why": ["정답. 교재의 제약 사항입니다.", "정답. 교재의 제약 사항입니다.", "배치 그룹은 AMI를 제한하지 않습니다.", "배치 그룹은 물리적 배치 전략이며 요금 할인과 관계없습니다.", "클러스터 배치 그룹은 단일 AZ 안에 인스턴스를 가깝게 배치합니다."], "tags": ["EC2", "배치 그룹", "지식확인"]}, {"id": "m5-024", "module": 5, "level": "basic", "pick": 1, "q": "EC2 스팟 인스턴스에 대한 설명으로 옳은 것은?", "options": ["물리 서버의 소켓·코어 수를 확인할 수 있다", "한번 시작하면 절대 중단되지 않는다", "1년 또는 3년 약정이 필요하다", "AWS가 용량을 회수해야 할 때 2분 전 알림 후 중단될 수 있다"], "answer": [3], "explain": "스팟 인스턴스는 남는 EC2 용량을 온디맨드보다 크게 할인된 가격으로 사용하지만, AWS가 용량이 필요하면 2분 전 알림 후 중단할 수 있습니다. 그래서 내결함성이 있고 유연한 스테이트리스 워크로드에 적합합니다.", "why": ["전용 호스트의 특징입니다.", "스팟은 중단될 수 있습니다.", "약정은 예약 인스턴스와 Savings Plans의 특징입니다.", "정답. 2분 전 중단 알림이 있습니다."], "tags": ["EC2", "스팟 인스턴스", "요금", "지식확인"]}, {"id": "m5-025", "module": 5, "level": "basic", "pick": 1, "q": "1년 또는 3년 동안 시간당 일정 금액의 사용량을 약정하면, 인스턴스 패밀리·크기·리전·OS에 관계없이 EC2뿐 아니라 AWS Lambda와 AWS Fargate 사용량에도 할인이 자동 적용되는 요금 모델은?", "options": ["Compute Savings Plans", "EC2 Instance Savings Plans", "스팟 인스턴스", "온디맨드 용량 예약"], "answer": [0], "explain": "Compute Savings Plans는 가장 유연한 절감형 플랜으로 최대 66% 할인되며 EC2, Lambda, Fargate에 적용됩니다. EC2 Instance Savings Plans는 특정 리전의 특정 인스턴스 패밀리에 묶이는 대신 할인 폭이 최대 72%로 더 큽니다.", "why": ["정답. 가장 유연한 절감형 플랜입니다.", "특정 리전·인스턴스 패밀리에만 적용되며 Lambda·Fargate에는 적용되지 않습니다.", "스팟은 약정 없는 할인 용량으로 중단될 수 있습니다.", "용량 예약은 할인 약정이 아니라 용량 확보 수단입니다."], "tags": ["EC2", "Savings Plans", "요금", "지식확인"]}, {"id": "m5-026", "module": 5, "level": "basic", "pick": 1, "q": "전용 인스턴스(Dedicated Instances)와 비교한 전용 호스트(Dedicated Hosts)만의 특징은?", "options": ["물리 서버의 소켓·코어 수와 호스트 ID를 확인할 수 있고 인스턴스 배치를 제어할 수 있다", "다른 AWS 계정의 인스턴스와 하드웨어를 공유하지 않는다", "인스턴스 단위로 요금이 청구된다", "AWS가 인스턴스를 자동으로 배치한다"], "answer": [0], "explain": "두 옵션 모두 다른 계정과 하드웨어를 격리하지만, 전용 호스트는 소켓·코어·호스트 ID에 대한 가시성과 배치 제어를 제공해 서버 한정 소프트웨어 라이선스(BYOL) 사용에 적합합니다. 전용 호스트는 호스트 단위, 전용 인스턴스는 인스턴스 단위로 과금됩니다.", "why": ["정답. 전용 호스트의 가시성·제어 기능입니다.", "두 옵션의 공통점입니다.", "인스턴스 단위 결제는 전용 인스턴스의 특징입니다.", "자동 배치는 전용 인스턴스의 특징입니다."], "tags": ["EC2", "전용 호스트", "요금", "지식확인"]}, {"id": "m5-027", "module": 5, "level": "basic", "pick": 2, "q": "교재의 EC2 비용 최적화 지침에서 워크로드와 구매 옵션의 연결이 올바른 것을 고르시오.", "options": ["중단되면 안 되는 단일 핵심 DB 서버 – 스팟 인스턴스", "알려진 안정적 상태의 워크로드 – 예약 인스턴스 또는 Savings Plans", "내결함성을 갖춘 유연한 스테이트리스 워크로드 – 스팟 인스턴스", "새롭거나 변동이 심한 스테이트풀 워크로드 – 스팟 인스턴스", "알려진 안정적 상태의 워크로드 – 온디맨드 인스턴스만 사용"], "answer": [1, 2], "explain": "교재는 구매 옵션을 결합하라고 권장합니다. 안정적 기본 사용량은 RI·Savings Plans, 새롭거나 변동이 심한 스테이트풀 워크로드는 온디맨드, 내결함성 있는 스테이트리스 워크로드의 확장분은 스팟을 사용합니다.", "why": ["중단되면 안 되는 서버를 스팟에 두면 안 됩니다.", "정답. 약정 할인을 적용합니다.", "정답. 중단을 견딜 수 있어 스팟이 적합합니다.", "변동이 심한 스테이트풀 워크로드는 온디맨드를 사용합니다.", "장기 안정 워크로드에 온디맨드만 쓰면 비용이 높습니다."], "tags": ["EC2", "요금", "비용 최적화", "지식확인"]}, {"id": "m5-028", "module": 5, "level": "basic", "pick": 1, "q": "개발 팀이 밤마다 EBS 지원 개발 인스턴스를 '중지'해 두는데도 계속 요금이 청구되고 있다. 중지된 상태에서도 계속 청구되는 항목은?", "options": ["인스턴스에 연결된 EBS 볼륨의 스토리지 요금", "인스턴스 스토어 볼륨 요금", "중지된 인스턴스의 시간당 컴퓨팅 요금", "보안 그룹 사용 요금"], "answer": [0], "explain": "인스턴스가 중지 중·중지됨 상태가 되면 컴퓨팅 사용 요금은 더 이상 부과되지 않지만, 연결된 EBS 볼륨은 데이터를 계속 보관하므로 스토리지 요금이 계속 발생합니다.", "why": ["정답. EBS 볼륨은 유지되므로 스토리지 요금이 계속 부과됩니다.", "인스턴스 스토어는 인스턴스 요금에 포함되며 중지 시 데이터도 사라집니다.", "중지 상태에서는 인스턴스 사용 요금이 부과되지 않습니다.", "보안 그룹에는 별도 요금이 없습니다."], "tags": ["EC2", "EBS", "요금", "지식확인"]}, {"id": "m5-029", "module": 5, "level": "saa", "pick": 1, "q": "Solutions Architect가 관리하는 워크로드는 같은 리전에서 1년 이상 중단 없이 실행되며, 성수기에 가끔 급증하는 경우를 제외하면 꾸준하다. 급증 시에는 인스턴스 크기를 늘려야 할 수 있지만 인스턴스 패밀리는 그대로 유지된다. 최저 비용으로 인스턴스를 구매하려면 어떤 요금 옵션을 사용해야 하는가?", "options": ["전용 인스턴스", "Compute Savings Plans", "EC2 Instance Savings Plans", "온디맨드 인스턴스"], "answer": [2], "explain": "EC2 Instance Savings Plans는 특정 리전의 특정 인스턴스 패밀리에 약정하는 대신 가장 큰 할인을 제공하며, 같은 패밀리 안에서 크기를 바꿔도 할인이 유지됩니다. 리전·패밀리 변경 유연성이 필요 없으므로 Compute Savings Plans보다 저렴합니다.", "why": ["전용 인스턴스는 하드웨어 격리가 필요할 때 쓰는 비싼 옵션입니다.", "적용은 가능하지만 리전·패밀리 변경 유연성 대가로 할인 폭이 더 작습니다.", "정답. 같은 리전·같은 패밀리·크기 변경 = EC2 Instance Savings Plans.", "1년 이상 지속되는 워크로드에 온디맨드는 비용 효율적이지 않습니다."], "tags": ["EC2", "Savings Plans", "요금", "샘플문항"]}, {"id": "m5-030", "module": 5, "level": "saa", "pick": 1, "q": "한 연구소는 매일 밤 수천 개의 이미지 처리 배치 작업을 실행한다. 각 작업은 체크포인트를 저장하므로 중간에 중단되어도 다시 이어서 실행할 수 있고, 완료 시점에도 여유가 있다. 가장 비용 효율적인 구매 옵션은?", "options": ["온디맨드 용량 예약", "스팟 인스턴스", "3년 약정 예약 인스턴스", "온디맨드 인스턴스", "전용 호스트"], "answer": [1], "explain": "중단을 견디고 시간 유연성이 있는 배치 작업은 크게 할인된 스팟 인스턴스가 가장 적합합니다. 중단되면 체크포인트에서 재개하도록 설계합니다.", "why": ["용량 보장은 필요 없으며 온디맨드 요금이 그대로 부과됩니다.", "정답. 내결함성 + 유연한 배치 = 스팟.", "밤에만 실행되는 작업에 3년 상시 약정은 낭비입니다.", "중단 내성이 있는데 할인 없는 요금을 내는 셈입니다.", "라이선스·규정 요구가 없는데 가장 비싼 옵션 중 하나입니다."], "tags": ["EC2", "스팟 인스턴스", "요금"]}, {"id": "m5-031", "module": 5, "level": "saa", "pick": 1, "q": "한 전자상거래 웹 애플리케이션은 앞으로 3년간 항상 10대의 인스턴스가 필요하다. 또한 매일 몇 시간씩 예측하기 어려운 트래픽 급증이 있어 인스턴스를 추가하는데, 결제 처리 때문에 급증 시 추가된 인스턴스도 중단되면 안 된다. 가장 비용 효율적인 구매 전략은?", "options": ["모든 인스턴스를 스팟 인스턴스로 실행한다", "급증 시 최대 대수에 맞춰 모든 인스턴스를 3년 약정 예약 인스턴스로 구매한다", "기본 10대는 3년 약정 예약 인스턴스나 Savings Plans로, 급증분은 온디맨드 인스턴스로 실행한다", "기본 10대는 스팟 인스턴스로, 급증분은 온디맨드 인스턴스로 실행한다", "모든 인스턴스를 온디맨드로 실행한다"], "answer": [2], "explain": "항상 필요한 기준 용량은 장기 약정 할인으로, 예측 불가능하고 중단되면 안 되는 추가 용량은 온디맨드로 처리하는 것이 비용과 안정성을 모두 충족합니다.", "why": ["중단 불가 요구를 충족하지 못합니다.", "하루 몇 시간만 쓰는 용량까지 상시 약정해 낭비가 큽니다.", "정답. 안정 = 약정, 변동 + 중단 불가 = 온디맨드.", "상시 필요한 기준 용량이 중단될 수 있어 위험합니다.", "기준 용량에 약정 할인을 적용하지 않아 비쌉니다."], "tags": ["EC2", "요금", "비용 최적화"]}, {"id": "m5-032", "module": 5, "level": "saa", "pick": 1, "q": "한 회사는 앞으로 3년 동안 컴퓨팅 비용 약정 할인을 받고 싶다. 그런데 이 기간에 인스턴스 패밀리를 최신 세대로 바꾸고, 일부 워크로드는 다른 리전으로 옮기며, 일부는 AWS Lambda와 AWS Fargate로 이전할 계획이다. 가장 적절한 요금 옵션은?", "options": ["스팟 인스턴스", "EC2 Instance Savings Plans", "Standard 예약 인스턴스", "Compute Savings Plans"], "answer": [3], "explain": "Compute Savings Plans는 인스턴스 패밀리, 크기, AZ, 리전, OS, 테넌시와 관계없이 적용되고 Lambda·Fargate 사용량까지 포함하는 가장 유연한 약정 할인입니다.", "why": ["약정 할인 모델이 아니며 중단될 수 있습니다.", "특정 리전의 특정 패밀리에만 적용되고 Lambda·Fargate에는 적용되지 않습니다.", "특정 인스턴스 구성에 묶여 패밀리·리전 변경과 서버리스 이전에 대응하기 어렵습니다.", "정답. 패밀리·리전 변경 + 서버리스 이전 = Compute Savings Plans."], "tags": ["EC2", "Savings Plans", "요금"]}, {"id": "m5-033", "module": 5, "level": "saa", "pick": 1, "q": "한 회사는 물리 서버의 소켓·코어 수를 기준으로 라이선스가 부여되는 기존 데이터베이스 소프트웨어 라이선스를 AWS에서 그대로 사용하려 한다. 또한 규정상 인스턴스가 시간이 지나도 같은 물리 서버에 배치되는 것을 확인할 수 있어야 한다. 어떤 옵션을 사용해야 하는가?", "options": ["스팟 인스턴스", "기본(공유) 테넌시의 예약 인스턴스", "전용 호스트", "온디맨드 용량 예약", "전용 인스턴스"], "answer": [2], "explain": "전용 호스트는 고객 전용 물리 서버로 소켓·코어·호스트 ID를 확인하고 인스턴스 배치를 제어할 수 있어 서버 한정 라이선스(BYOL)와 규정 준수 요구에 적합합니다.", "why": ["중단될 수 있고 물리 서버 가시성이 없습니다.", "공유 하드웨어에서 실행되어 라이선스 요구를 충족하지 못합니다.", "정답. 라이선스·배치 제어 요구를 충족합니다.", "용량을 확보할 뿐 물리 서버 가시성을 제공하지 않습니다.", "하드웨어는 격리되지만 소켓·코어 가시성과 배치 제어가 없습니다."], "tags": ["EC2", "전용 호스트", "라이선스"]}, {"id": "m5-034", "module": 5, "level": "saa", "pick": 1, "q": "한 회사는 다음 달 2주 동안 열리는 대규모 온라인 행사 기간에 특정 가용 영역에서 반드시 EC2 용량을 확보해야 한다. 장기 약정은 원하지 않는다. 가장 적절한 방법은?", "options": ["스팟 인스턴스로 필요한 용량을 요청한다", "1년 약정 리전 범위 예약 인스턴스를 구매한다", "Compute Savings Plans를 구매한다", "온디맨드 용량 예약을 해당 AZ에 생성한다"], "answer": [3], "explain": "온디맨드 용량 예약은 특정 AZ에서 원하는 기간 동안 EC2 용량을 확보하며 장기 약정이 필요 없습니다. Savings Plans나 리전 범위 RI는 할인 수단일 뿐 용량을 보장하지 않습니다.", "why": ["스팟은 용량을 보장하지 않고 중단될 수 있습니다.", "1년 약정이 필요하고 리전 범위 RI는 특정 AZ의 용량을 예약하지 않습니다.", "Savings Plans는 할인 약정이며 용량을 보장하지 않습니다.", "정답. 단기 + 특정 AZ 용량 보장."], "tags": ["EC2", "용량 예약", "요금"]}, {"id": "m5-035", "module": 5, "level": "saa", "pick": 1, "q": "두 개의 가용 영역에 걸친 여러 Linux EC2 웹 서버가 사용자 업로드 파일을 같은 디렉터리에서 동시에 읽고 써야 한다. 저장 용량은 예측하기 어려워 자동으로 늘어나야 한다. 가장 적절한 스토리지는?", "options": ["인스턴스 스토어 볼륨", "각 인스턴스에 연결한 Amazon EBS 볼륨", "Amazon FSx for Windows File Server", "Amazon EFS"], "answer": [3], "explain": "Amazon EFS는 여러 AZ의 Linux 인스턴스가 NFS로 동시에 탑재하는 완전관리형 공유 파일 시스템이며, 파일 추가·삭제에 따라 용량이 자동으로 늘고 줄어듭니다.", "why": ["인스턴스 스토어는 임시 스토리지이며 공유할 수 없습니다.", "EBS는 한 번에 하나의 인스턴스(같은 AZ)에 연결하는 블록 스토리지입니다.", "Windows(SMB) 워크로드용 파일 시스템입니다.", "정답. 다중 AZ Linux 공유 + 자동 확장."], "tags": ["EC2", "EFS", "스토리지"]}, {"id": "m5-036", "module": 5, "level": "saa", "pick": 1, "q": "한 회사가 여러 Windows EC2 인스턴스에서 실행되는 업무 애플리케이션을 온프레미스에서 리프트 앤 시프트하려 한다. 애플리케이션은 SMB 파일 공유와 Active Directory 기반 파일 권한을 사용한다. 운영 오버헤드가 가장 적은 스토리지는?", "options": ["Amazon FSx for Windows File Server", "EC2 인스턴스에 Windows 파일 서버를 직접 설치하고 EBS를 연결한다", "Amazon S3", "Amazon EFS"], "answer": [0], "explain": "FSx for Windows File Server는 SMB, NTFS, Active Directory 통합, Windows ACL을 지원하는 완전관리형 Windows 파일 서버라 기존 Windows 앱을 그대로 옮기기 좋습니다.", "why": ["정답. 관리형 SMB + AD 통합.", "동작은 하지만 파일 서버 패치·백업·가용성을 직접 관리해야 해 운영 부담이 큽니다.", "S3는 객체 스토리지로 SMB 파일 공유를 제공하지 않습니다.", "EFS는 Linux용 NFS 파일 시스템입니다."], "tags": ["EC2", "FSx for Windows", "스토리지"]}, {"id": "m5-037", "module": 5, "level": "saa", "pick": 1, "q": "EC2에서 직접 운영하는 트랜잭션 데이터베이스가 지속적으로 30,000 IOPS와 일관되게 낮은 지연 시간을 요구한다. 데이터는 인스턴스를 중지해도 보존되어야 한다. 가장 적절한 스토리지는?", "options": ["범용 SSD(gp2) EBS 볼륨", "처리량 최적화 HDD(st1) EBS 볼륨", "인스턴스 스토어 볼륨", "프로비저닝된 IOPS SSD(io1) EBS 볼륨"], "answer": [3], "explain": "프로비저닝된 IOPS SSD(io1)는 미션 크리티컬하고 I/O 집약적인 DB를 위해 필요한 IOPS를 지정해 일관된 성능을 제공하는 최고 성능 EBS 볼륨입니다. gp2는 볼륨당 최대 IOPS가 이 요구보다 낮습니다.", "why": ["gp2는 GiB당 기준 IOPS로 성능이 정해지고 볼륨당 최대 16,000 IOPS라 요구를 충족하지 못합니다.", "HDD 볼륨은 처리량 중심으로 작은 랜덤 I/O가 많은 DB에 부적합합니다.", "인스턴스를 중지하면 데이터가 사라져 보존 요구를 충족하지 못합니다.", "정답. 높은 IOPS를 지속적으로 보장합니다."], "tags": ["EC2", "EBS", "볼륨 유형"]}, {"id": "m5-038", "module": 5, "level": "saa", "pick": 1, "q": "한 회사는 대용량 로그 파일을 순차적으로 읽어 분석하는 작업을 매일 여러 번 실행한다. 큰 I/O 단위의 높은 처리량(MiB/s)이 중요하고, 이 볼륨은 부팅 볼륨이 아니다. 비용을 낮추면서 요구를 충족하는 EBS 볼륨 유형은?", "options": ["처리량 최적화 HDD(st1)", "콜드 HDD(sc1)", "프로비저닝된 IOPS SSD(io1)", "범용 SSD(gp2)"], "answer": [0], "explain": "처리량 최적화 HDD(st1)는 자주 접근하는 대용량 순차 처리 워크로드(로그 처리, 빅 데이터, 데이터 웨어하우스)용 저비용 볼륨입니다. 접근 빈도가 낮다면 sc1을 고려합니다.", "why": ["정답. 자주 접근 + 순차 처리량 + 저비용.", "자주 접근하지 않는 콜드 데이터용이라 매일 여러 번 처리하는 작업에는 부적합합니다.", "IOPS 중심의 고가 볼륨으로 순차 처리량 워크로드에는 비용 효율이 낮습니다.", "IOPS 중심 범용 볼륨으로 대용량 순차 처리에서는 st1보다 GB당 비용이 높습니다."], "tags": ["EC2", "EBS", "볼륨 유형"]}, {"id": "m5-039", "module": 5, "level": "saa", "pick": 1, "q": "한 NoSQL 데이터베이스 클러스터는 애플리케이션 계층에서 데이터를 여러 노드에 복제한다. 각 노드는 로컬 스토리지에서 매우 높은 랜덤 IOPS와 짧은 지연 시간이 필요하다. 가장 적절한 인스턴스 선택은?", "options": ["버스터블 범용(T 패밀리) 인스턴스와 sc1 볼륨", "로컬 NVMe 인스턴스 스토어를 갖춘 스토리지 최적화(I 패밀리) 인스턴스", "메모리 최적화(R 패밀리) 인스턴스와 Amazon EFS", "컴퓨팅 최적화(C 패밀리) 인스턴스와 st1 볼륨"], "answer": [1], "explain": "스토리지 최적화 인스턴스는 지연 시간이 짧은 수만 단위의 랜덤 IOPS를 위해 설계되었고, 고성능 DB·NoSQL·실시간 분석에 적합합니다. 애플리케이션이 데이터를 복제하므로 인스턴스 스토어의 임시성도 감수할 수 있습니다.", "why": ["T 패밀리와 콜드 HDD는 고성능 DB에 부적합합니다.", "정답. 높은 로컬 I/O + 앱 수준 복제.", "EFS는 공유 파일 시스템으로 로컬 블록 스토리지의 저지연 랜덤 IOPS 요구에 맞지 않습니다.", "st1은 순차 처리량용으로 랜덤 IOPS에 부적합합니다."], "tags": ["EC2", "인스턴스 유형", "인스턴스 스토어"]}, {"id": "m5-040", "module": 5, "level": "saa", "pick": 1, "q": "한 HPC 애플리케이션은 노드 간에 긴밀하게 통신하므로 인스턴스 사이의 네트워크 지연 시간이 가장 낮고 처리량이 높아야 한다. 어떤 구성을 사용해야 하는가?", "options": ["여러 리전에 인스턴스를 분산 배치", "여러 AZ에 분산한 분산(spread) 배치 그룹", "파티션 배치 그룹", "단일 AZ의 클러스터 배치 그룹"], "answer": [3], "explain": "클러스터 배치 그룹은 인스턴스를 한 AZ 안에서 물리적으로 가깝게 배치해 노드 간 저지연·고처리량 네트워크 성능을 제공합니다. 긴밀하게 결합된 HPC 워크로드에 적합합니다.", "why": ["리전 간 통신은 지연 시간이 더 커집니다.", "분산 배치는 장애 격리가 목적이며 네트워크 지연을 줄이지 않습니다.", "파티션은 파티션 간 하드웨어 장애 격리가 목적입니다.", "정답. 가까이 배치 → 빠른 통신."], "tags": ["EC2", "배치 그룹"]}, {"id": "m5-041", "module": 5, "level": "saa", "pick": 1, "q": "한 회사는 Hadoop·Cassandra 같은 대규모 분산 시스템을 수십 대의 인스턴스로 운영한다. 복제본 그룹들이 서로 같은 랙(기반 하드웨어)을 공유하지 않도록 해서 하드웨어 장애가 여러 복제본 그룹에 동시에 영향을 주지 않게 하려 한다. 가장 적절한 배치 전략은?", "options": ["분산(spread) 배치 그룹", "전용 호스트 하나에 모든 인스턴스 배치", "클러스터 배치 그룹", "파티션 배치 그룹"], "answer": [3], "explain": "파티션 배치 그룹은 인스턴스를 논리적 파티션으로 나누고, 서로 다른 파티션이 기반 하드웨어를 공유하지 않게 합니다. 대규모 분산·복제 워크로드의 그룹 단위 장애 격리에 적합합니다.", "why": ["분산 배치는 소수의 핵심 인스턴스를 각각 다른 하드웨어에 두는 용도로, 수십 대 그룹 단위 격리에는 파티션이 적합합니다.", "단일 호스트에 모으면 장애가 전체에 영향을 줍니다.", "클러스터는 인스턴스를 가깝게 모아 오히려 동시 장애 위험이 커집니다.", "정답. 그룹 단위 장애 격리 + 대규모 인스턴스."], "tags": ["EC2", "배치 그룹"]}, {"id": "m5-042", "module": 5, "level": "saa", "pick": 1, "q": "한 회사에는 서로 독립적으로 동작해야 하는 핵심 인스턴스가 5대 있다. 하드웨어 장애 하나로 두 대 이상이 동시에 실패하는 일을 최소화하려면 어떻게 해야 하는가?", "options": ["클러스터 배치 그룹에 시작한다", "모두 같은 서브넷의 같은 인스턴스 유형으로 시작한다", "같은 전용 호스트에 시작한다", "분산(spread) 배치 그룹에 시작해 각 인스턴스를 서로 다른 하드웨어에 둔다"], "answer": [3], "explain": "분산 배치 그룹은 소수의 인스턴스를 각각 서로 다른 기반 하드웨어에 배치해 상관관계가 있는 동시 실패를 줄입니다.", "why": ["가깝게 배치되어 동시 실패 위험이 커집니다.", "서브넷·유형은 물리 하드웨어 분산을 보장하지 않습니다.", "한 물리 서버에 모이므로 호스트 장애 시 모두 실패합니다.", "정답. 소수 핵심 인스턴스의 개별 장애 격리."], "tags": ["EC2", "배치 그룹"]}, {"id": "m5-043", "module": 5, "level": "saa", "pick": 1, "q": "트래픽 급증 시 Auto Scaling으로 웹 서버를 빠르게 추가해야 하는데, 현재는 OS만 있는 기본 AMI로 시작한 뒤 사용자 데이터로 수십 개 패키지를 설치해 서비스 투입까지 15분이 걸린다. 모든 인스턴스가 동일하게 동작해야 하며 시작 시간을 최소화해야 한다. 가장 적절한 방법은?", "options": ["애플리케이션과 종속성을 모두 포함한 골든 AMI를 만들어 시작 템플릿에 사용한다", "인스턴스가 시작될 때마다 관리자가 SSH로 접속해 패키지를 설치한다", "커뮤니티 AMI 중 비슷한 구성을 찾아 사용한다", "사용자 데이터 스크립트를 더 길고 자세하게 작성한다"], "answer": [0], "explain": "골든 AMI는 필요한 구성이 이미 이미지에 포함되어 있어 부팅 후 설치 시간이 거의 없고, 같은 이미지로 시작한 모든 인스턴스가 동일하게 동작합니다. 대신 변경 시 이미지를 다시 만들어 교체합니다.", "why": ["정답. 부팅 빠름 + 일관성 = 골든 AMI.", "수동 작업은 느리고 오류와 구성 차이를 만듭니다.", "검증되지 않은 AMI로 보안 위험이 있고 구성 일치도 보장되지 않습니다.", "설치 작업이 부팅 시 실행되는 구조는 그대로라 시작 시간이 줄지 않습니다."], "tags": ["EC2", "AMI 배포 모델", "골든 AMI"]}, {"id": "m5-044", "module": 5, "level": "saa", "pick": 2, "q": "관리자가 운영 중인 웹 서버 A에 SSH로 접속해 추가 패키지를 수동으로 설치했다. 이후 웹 서버 A의 사용자 데이터를 복사해 새 웹 서버를 시작했더니 해당 패키지가 없었다. 앞으로 새 인스턴스가 같은 구성으로 시작되도록 하는 모범 사례를 고르시오.", "options": ["수동으로 실행한 명령을 웹 서버 A의 사용자 데이터 스크립트에도 반영해 구성 기록을 유지한다", "구성이 완료된 웹 서버 A로 새 AMI를 만들어 새 인스턴스 시작에 사용한다", "웹 서버 A의 인스턴스 스토어를 새 인스턴스에 연결한다", "인스턴스 메타데이터에 설치 명령을 저장한다", "새 인스턴스를 시작할 때마다 관리자가 SSH로 같은 명령을 수동 실행한다"], "answer": [0, 1], "explain": "수동 변경을 사용자 데이터나 AMI에 반영하지 않으면 새 인스턴스가 같은 환경으로 재현되지 않습니다(구성 드리프트). 교재는 수동 명령 실행 후 사용자 데이터를 업데이트하라고 권장하며, 구성된 인스턴스로 새 AMI를 만드는 것도 반복성·복구성을 높입니다.", "why": ["정답. 교재의 모범 사례입니다.", "정답. 변경 사항을 이미지로 저장해 같은 구성으로 시작합니다.", "인스턴스 스토어는 다른 인스턴스에 연결할 수 없습니다.", "메타데이터는 인스턴스 정보를 조회하는 서비스로 명령 저장소가 아닙니다.", "반복적인 수동 작업은 오류와 구성 차이를 만듭니다."], "tags": ["EC2", "사용자 데이터", "AMI"]}, {"id": "m5-045", "module": 5, "level": "saa", "pick": 1, "q": "실행 중인 Linux 인스턴스의 사용자 데이터 스크립트를 수정하려고 인스턴스를 중지하고 사용자 데이터를 편집한 뒤 다시 시작했지만, 수정한 스크립트가 실행되지 않았다. 교재 기준으로 빠뜨린 단계는?", "options": ["보안 그룹에 포트 80을 추가하는 단계", "인스턴스에 탄력적 IP를 연결하는 단계", "인스턴스에 접속해 /var/lib/cloud/instances/*/sem/config_scripts_user 파일을 제거하는 단계", "인스턴스 유형을 더 큰 것으로 변경하는 단계"], "answer": [2], "explain": "사용자 데이터는 기본적으로 처음 시작할 때만 실행됩니다. 교재의 재실행 절차는 ① 인스턴스 중지 ② 사용자 데이터 수정 ③ config_scripts_user 파일 제거(SSH 또는 SSM으로 접속) ④ 인스턴스 재시작 또는 스크립트 직접 실행입니다.", "why": ["보안 그룹은 네트워크 트래픽 제어로 스크립트 실행과 무관합니다.", "탄력적 IP는 사용자 데이터 실행과 무관합니다.", "정답. 이 단계를 건너뛰면 수정된 스크립트가 실행되지 않습니다.", "인스턴스 유형은 사용자 데이터 실행 여부와 무관합니다."], "tags": ["EC2", "사용자 데이터"]}, {"id": "m5-046", "module": 5, "level": "saa", "pick": 1, "q": "EC2 인스턴스에서 실행되는 애플리케이션이 S3 버킷의 객체를 읽어야 한다. 보안팀은 장기 자격 증명을 코드나 인스턴스에 저장하지 말라고 요구한다. 가장 적절한 방법은?", "options": ["필요한 S3 권한을 가진 IAM 역할을 인스턴스 프로파일로 EC2 인스턴스에 연결한다", "IAM 사용자의 액세스 키를 사용자 데이터에 넣어 환경 변수로 설정한다", "키 페어의 프라이빗 키를 인스턴스에 복사한다", "보안 그룹 아웃바운드 규칙에서 S3를 허용한다"], "answer": [0], "explain": "EC2에서 AWS API를 호출하는 애플리케이션에는 IAM 역할을 인스턴스 프로파일로 연결합니다. 애플리케이션은 자동으로 교체되는 임시 자격 증명을 사용하므로 장기 키를 저장할 필요가 없습니다.", "why": ["정답. 임시 자격 증명을 자동 제공합니다.", "장기 자격 증명을 인스턴스에 저장하는 방식이라 요구 사항에 어긋납니다.", "키 페어는 OS 접속(SSH) 인증용으로 AWS API 권한과 무관합니다.", "보안 그룹은 네트워크 트래픽 제어일 뿐 S3 API 권한을 부여하지 않습니다."], "tags": ["EC2", "IAM 역할", "보안"]}, {"id": "m5-047", "module": 5, "level": "saa", "pick": 2, "q": "퍼블릭 서브넷에 있고 퍼블릭 IP가 할당된 Linux EC2 인스턴스에 관리자가 자신의 사무실 PC에서 SSH로 접속하지 못하고 있다. 원인으로 확인해야 할 항목을 고르시오.", "options": ["인스턴스 시작 시 지정한 키 페어에 맞는 프라이빗 키를 사용하는지", "보안 그룹 인바운드 규칙이 관리자 IP의 TCP 22 포트를 허용하는지", "인스턴스에 연결된 IAM 역할에 S3 읽기 정책이 있는지", "인스턴스가 클러스터 배치 그룹에 있는지", "EBS 볼륨이 EBS 최적화로 설정되었는지"], "answer": [0, 1], "explain": "SSH 접속에는 네트워크 허용(보안 그룹 TCP 22)과 OS 인증(키 페어)이 필요합니다. IAM 역할은 AWS API 권한이므로 SSH 접속 문제를 해결하지 못합니다.", "why": ["정답. 키 페어가 맞지 않으면 인증에 실패합니다.", "정답. 보안 그룹이 SSH 트래픽을 막고 있을 수 있습니다.", "IAM 역할은 AWS API 호출 권한으로 SSH 접속과 무관합니다.", "배치 그룹은 물리 배치 전략으로 접속과 무관합니다.", "EBS 최적화는 스토리지 I/O 성능 설정입니다."], "tags": ["EC2", "보안 그룹", "키 페어"]}, {"id": "m5-048", "module": 5, "level": "saa", "pick": 1, "q": "EC2 인스턴스에서 Amazon EFS 파일 시스템을 탑재하려 했지만 연결 시간이 초과되었다. 인스턴스와 같은 AZ에 탑재 대상이 있고 DNS 이름도 올바르다. 탑재 대상에 연결된 보안 그룹의 인바운드 규칙에서 인스턴스 보안 그룹으로부터 허용해야 하는 포트는?", "options": ["TCP 3389(RDP)", "TCP 22(SSH)", "TCP 443(HTTPS)", "TCP 2049(NFS)"], "answer": [3], "explain": "EFS는 NFS 프로토콜을 사용하므로 탑재 대상의 보안 그룹이 EC2 인스턴스로부터의 TCP 2049 인바운드 트래픽을 허용해야 합니다. EFS 랩에서 사용한 원리입니다.", "why": ["RDP는 Windows 원격 데스크톱 포트입니다.", "SSH는 인스턴스 접속용 포트입니다.", "HTTPS는 EFS 탑재에 사용되지 않습니다.", "정답. NFS 포트 2049입니다."], "tags": ["EC2", "EFS", "보안 그룹", "랩원리"]}, {"id": "m5-049", "module": 5, "level": "saa", "pick": 2, "q": "카페 웹 애플리케이션이 버지니아 북부 리전의 EC2 인스턴스에서 정상 동작하고 있다. 재해 복구를 위해 같은 구성의 인스턴스를 오레곤 리전에도 실행하려 한다. 필요한 작업을 고르시오.", "options": ["S3 Transfer Acceleration으로 인스턴스를 오레곤으로 이동한다", "생성한 AMI를 오레곤 리전으로 복사한 뒤 복사된 AMI로 인스턴스를 시작한다", "실행 중인 인스턴스로 AMI를 생성한다", "버지니아의 EBS 볼륨을 오레곤의 인스턴스에 직접 연결한다", "AMI ID는 모든 리전에서 동일하므로 오레곤에서 같은 ID로 바로 시작한다"], "answer": [1, 2], "explain": "AMI는 리전 리소스이므로, 구성된 인스턴스로 AMI를 만든 뒤 대상 리전으로 복사하고 그 리전의 AMI로 인스턴스를 시작합니다. 카페 동적 웹 사이트 랩에서 사용한 원리입니다.", "why": ["Transfer Acceleration은 S3 업로드 가속 기능입니다.", "정답. AMI 복사 후 대상 리전에서 시작합니다.", "정답. 구성된 상태를 이미지로 캡처합니다.", "EBS 볼륨은 같은 AZ의 인스턴스에만 연결할 수 있습니다.", "AMI는 리전별로 존재하며, 복사하면 새 AMI ID가 생깁니다."], "tags": ["EC2", "AMI", "리전", "랩원리"]}, {"id": "m5-050", "module": 5, "level": "saa", "pick": 1, "q": "가용 영역 A의 EC2 인스턴스에 연결된 EBS 볼륨의 데이터를 가용 영역 B에서 새로 시작한 인스턴스에서 사용해야 한다. 가장 적절한 방법은?", "options": ["볼륨의 스냅샷을 만들고, 그 스냅샷으로 AZ B에 새 볼륨을 생성해 연결한다", "볼륨을 분리한 후 AZ B의 인스턴스에 바로 연결한다", "볼륨에 탄력적 IP를 연결해 다른 AZ에서 접근한다", "볼륨을 인스턴스 스토어로 변환해 이동한다"], "answer": [0], "explain": "EBS 볼륨은 생성된 AZ 안에서만 인스턴스에 연결할 수 있습니다. 다른 AZ에서 쓰려면 스냅샷을 만든 뒤 그 스냅샷으로 대상 AZ에 새 볼륨을 생성합니다.", "why": ["정답. 스냅샷 → 대상 AZ에 새 볼륨.", "EBS 볼륨은 다른 AZ의 인스턴스에 연결할 수 없습니다.", "탄력적 IP는 네트워크 주소로 스토리지 접근과 무관합니다.", "EBS를 인스턴스 스토어로 변환할 수 없습니다."], "tags": ["EC2", "EBS", "스냅샷"]}, {"id": "m5-051", "module": 5, "level": "saa", "pick": 1, "q": "한 개발팀은 Java 웹 애플리케이션 코드를 업로드하기만 하면 용량 프로비저닝, 로드 밸런싱, 자동 확장, 상태 모니터링이 자동으로 처리되기를 원한다. 인프라 관리 부담을 최소화하면서도 기반 EC2 인스턴스는 계정에서 확인할 수 있어야 한다. 가장 적절한 서비스는?", "options": ["AWS Elastic Beanstalk", "Amazon Lightsail", "Amazon EC2 인스턴스를 직접 구성한다", "Amazon EKS"], "answer": [0], "explain": "Elastic Beanstalk은 코드를 업로드하면 배포, 용량 프로비저닝, 로드 밸런싱, 자동 확장, 상태 모니터링을 자동 처리하는 PaaS 서비스입니다. 생성된 EC2 등 리소스는 계정에 그대로 보입니다.", "why": ["정답. 코드 업로드 중심의 PaaS입니다.", "단순 VPS로 자동 확장·로드 밸런싱 자동화 요구에 맞지 않습니다.", "모든 구성을 직접 해야 해 관리 부담이 가장 큽니다.", "Kubernetes 클러스터 운영 지식과 관리가 필요합니다."], "tags": ["EC2", "Elastic Beanstalk", "컴퓨팅 옵션"]}, {"id": "m5-052", "module": 5, "level": "saa", "pick": 2, "q": "Auto Scaling 그룹으로 운영하는 스테이트리스 웹 계층이 있다. 하루 종일 최소 4대가 필요하고, 낮 시간에는 트래픽에 따라 최대 20대까지 늘어난다. 인스턴스 하나가 갑자기 중단되어도 다른 인스턴스가 요청을 처리할 수 있다. 비용을 최소화하는 조합을 고르시오.", "options": ["기준 4대는 Savings Plans 또는 예약 인스턴스로 비용을 약정한다", "모든 인스턴스를 전용 호스트에서 실행한다", "추가로 늘어나는 용량도 3년 약정 예약 인스턴스로 구매한다", "추가로 늘어나는 용량은 스팟 인스턴스를 활용한다", "기준 4대는 스팟 인스턴스로만 운영한다"], "answer": [0, 3], "explain": "항상 필요한 기준 용량은 약정 할인(Savings Plans·RI)으로, 중단을 견디는 스테이트리스 확장 용량은 스팟으로 처리하는 것이 교재의 구매 옵션 결합 전략입니다.", "why": ["정답. 상시 사용량은 약정 할인이 가장 저렴합니다.", "라이선스·규정 요구가 없는데 비용만 높아집니다.", "낮 시간에만 쓰는 용량까지 상시 약정하면 낭비가 큽니다.", "정답. 내결함성 있는 스테이트리스 확장분 = 스팟.", "최소 용량까지 모두 중단될 수 있어 서비스 가용성이 위험합니다."], "tags": ["EC2", "요금", "스팟 인스턴스", "Savings Plans"]}, {"id": "m5-053", "module": 5, "level": "saa", "pick": 1, "q": "한 회사의 EC2 인스턴스 수십 대가 몇 달째 CPU 사용률 10% 미만으로 실행되고 있다. 회사는 운영 오버헤드를 최소화하면서 워크로드 패턴에 근거한 적정 크기 권장 사항을 받고 싶다. 가장 적절한 방법은?", "options": ["모든 인스턴스를 즉시 가장 작은 크기로 변경한다", "EC2 Image Builder로 새 AMI를 만든다", "AWS Compute Optimizer를 활성화해 권장 사항을 검토하고 적용한다", "모든 인스턴스를 스팟 인스턴스로 교체한다"], "answer": [2], "explain": "Compute Optimizer는 사용률 지표를 기계 학습으로 분석해 초과·과소 프로비저닝을 찾아 적정 유형과 크기를 권장합니다. CPU만 보고 무작정 줄이면 메모리·I/O 병목을 놓칠 수 있습니다.", "why": ["메모리·I/O 등 다른 지표를 고려하지 않은 축소는 성능 문제를 일으킬 수 있습니다.", "Image Builder는 이미지 생성 자동화 도구로 크기 권장과 무관합니다.", "정답. 데이터 기반 적정 크기 조정입니다.", "과대 프로비저닝 문제를 해결하지 못하고 중단 위험만 생깁니다."], "tags": ["EC2", "Compute Optimizer", "Well-Architected"]}, {"id": "m6-001", "module": 6, "level": "basic", "pick": 1, "q": "관계형 데이터베이스의 특징으로 옳은 것은?", "options": ["키-값 형태의 단순 조회에만 최적화되어 있어 조인을 지원하지 않는다", "미리 정의된 스키마(테이블·행·열)를 사용하고 SQL로 조회하며, ACID 트랜잭션을 지원한다", "스키마 없이 JSON 문서를 그대로 저장하는 것이 기본 방식이다", "수직 확장(인스턴스 키우기)은 불가능하고 수평 확장만 가능하다"], "answer": [1], "explain": "관계형 DB는 정해진 스키마와 SQL, ACID 트랜잭션이 핵심이고 조인·복잡한 쿼리·데이터 무결성이 중요한 업무(주문, 결제 등)에 맞습니다. 비관계형 DB는 키-값·문서·그래프처럼 유연한 모델과 대규모 확장에 강합니다.", "why": ["틀림: 조인과 복잡한 쿼리는 오히려 관계형 DB의 강점입니다.", "맞음: 관계형 DB의 대표 특징이 스키마, SQL, ACID 트랜잭션입니다.", "틀림: 스키마가 유연한 문서 저장은 비관계형(NoSQL, 예: DocumentDB) 특징입니다.", "틀림: 관계형 DB는 수직 확장이 일반적이며, 읽기 전용 복제본으로 읽기를 수평 확장할 수도 있습니다."], "tags": ["지식확인", "관계형 DB", "NoSQL"]}, {"id": "m6-002", "module": 6, "level": "basic", "pick": 2, "q": "데이터베이스를 Amazon EC2에 직접 설치하는 대신 Amazon RDS를 사용하면 AWS가 대신 관리해 주는 작업은?", "options": ["DB 사용자 계정별 테이블 권한 부여", "운영 체제(OS) 설치와 패치", "데이터베이스 엔진 소프트웨어 설치와 패치", "테이블 스키마와 데이터 모델 설계", "애플리케이션 쿼리와 인덱스 최적화"], "answer": [1, 2], "explain": "관리형 DB 서비스(RDS, Aurora)는 하드웨어, OS 설치·패치, DB 설치·패치, 백업, 고가용성, 규모 조정 같은 운영을 AWS가 맡습니다. 반면 애플리케이션 최적화와 데이터 설계·권한은 여전히 고객 몫입니다.", "why": ["틀림: DB 내부 사용자와 권한 관리는 고객이 직접 설정합니다.", "맞음: RDS에서는 DB 호스트의 OS 설치·패치를 AWS가 담당합니다.", "맞음: RDS는 DB 엔진 설치와 (설정한 유지 관리 기간의) 패치를 AWS가 처리합니다.", "틀림: 어떤 테이블을 어떻게 설계할지는 고객이 결정합니다.", "틀림: 애플리케이션 최적화(쿼리·스키마·인덱스 설계)는 관리형 서비스에서도 고객 책임입니다."], "tags": ["지식확인", "Amazon RDS", "공동 책임"]}, {"id": "m6-003", "module": 6, "level": "basic", "pick": 1, "q": "Amazon RDS 다중 AZ DB 인스턴스 배포(Multi-AZ)의 주된 목적은?", "options": ["여러 리전에 데이터를 복제해 리전 전체 장애에 대비한다", "다른 AZ에 동기식으로 복제되는 대기(standby) 인스턴스를 두어, 기본 인스턴스 장애 시 자동 장애 조치로 가용성을 높인다", "대기 인스턴스에 읽기 트래픽을 분산해 읽기 성능을 높인다", "애플리케이션의 DB 연결을 풀링해 연결 수를 줄인다"], "answer": [1], "explain": "다중 AZ는 장애에 대비하는 기능이고, 읽기 전용 복제본은 읽기 성능을 늘리는 기능입니다. 다중 AZ 대기 인스턴스는 평소에는 읽기·쓰기에 쓰이지 않고 장애 때 자동으로 기본 인스턴스가 됩니다.", "why": ["틀림: 다중 AZ는 같은 리전 안의 다른 AZ에 복제합니다. 리전 간 대비는 크로스 리전 백업이나 복제본으로 합니다.", "맞음: 다중 AZ의 목적은 고가용성과 자동 장애 조치입니다.", "틀림: 다중 AZ DB 인스턴스 배포의 대기 인스턴스는 읽기 요청을 받지 않습니다. 읽기 확장은 읽기 전용 복제본의 역할입니다.", "틀림: 연결 풀링은 RDS Proxy의 기능입니다."], "tags": ["지식확인", "Amazon RDS", "다중 AZ", "고가용성"]}, {"id": "m6-004", "module": 6, "level": "basic", "pick": 1, "q": "Amazon RDS 읽기 전용 복제본(Read Replica)에 대한 설명으로 옳은 것은?", "options": ["기본 인스턴스와 같은 AZ에만 만들 수 있다", "쓰기 요청도 여러 복제본에 분산하여 쓰기 성능을 높인다", "동기식으로 복제되므로 데이터 손실 없이 자동 장애 조치가 이루어진다", "기본 DB 인스턴스로부터 비동기식으로 복제되며, 읽기 전용 쿼리를 분산해 읽기 처리량을 늘린다"], "answer": [3], "explain": "읽기 전용 복제본은 비동기 복제라서 최신 쓰기가 늦게 보일 수 있지만, 읽기 위주 작업(보고서, 조회)을 나누어 기본 DB 부하를 줄입니다. 필요하면 독립 DB로 승격할 수 있지만 이는 다중 AZ의 자동 장애 조치와는 다릅니다.", "why": ["틀림: 다른 AZ나 다른 리전에도 만들 수 있습니다.", "틀림: 복제본은 읽기 전용입니다. 쓰기는 기본 인스턴스에서만 처리합니다.", "틀림: 동기 복제와 자동 장애 조치는 다중 AZ의 특징입니다. 복제본은 비동기라 약간의 지연이 있을 수 있습니다.", "맞음: 읽기 전용 복제본은 비동기 복제로 읽기 부하를 나눕니다."], "tags": ["지식확인", "Amazon RDS", "읽기 전용 복제본"]}, {"id": "m6-005", "module": 6, "level": "basic", "pick": 1, "q": "Amazon RDS 자동 백업의 보존 기간으로 설정할 수 있는 최대 기간은?", "options": ["7일", "14일", "35일", "90일"], "answer": [2], "explain": "RDS 자동 백업은 보존 기간(최대 35일) 안에서 원하는 시점으로 복구(PITR)할 수 있게 해 줍니다. 35일보다 오래 보관하려면 사용자가 지울 때까지 남는 수동 DB 스냅샷을 사용합니다.", "why": ["틀림: 7일은 교재에서 설명하는 기본값입니다. 최대값은 아닙니다.", "틀림: 14일로 설정할 수는 있지만 최대값은 아닙니다.", "맞음: 자동 백업 보존 기간은 최대 35일까지 설정할 수 있습니다.", "틀림: 자동 백업은 90일까지 보존할 수 없습니다. 더 오래 보관하려면 수동 스냅샷을 사용합니다."], "tags": ["지식확인", "Amazon RDS", "백업"]}, {"id": "m6-006", "module": 6, "level": "basic", "pick": 2, "q": "Amazon Aurora에 대한 설명으로 옳은 것은?", "options": ["읽기 전용 복제본을 만들 수 없어 읽기 확장이 불가능하다", "Oracle 및 SQL Server와 호환되는 엔진으로만 제공된다", "데이터를 단일 AZ의 EBS 볼륨 하나에만 저장한다", "데이터를 3개 AZ에 걸쳐 6개 사본으로 저장해 내구성과 가용성을 높인다", "MySQL 및 PostgreSQL과 호환되는 관계형 데이터베이스 엔진이다"], "answer": [3, 4], "explain": "Aurora는 클라우드용으로 설계된 MySQL·PostgreSQL 호환 관계형 DB입니다. 3개 AZ에 6개 사본을 두는 스토리지, 최대 15개 읽기 복제본, S3로의 연속 백업 덕분에 고가용성·읽기 확장 요구에 잘 맞습니다.", "why": ["틀림: Aurora는 최대 15개의 Aurora 복제본으로 읽기를 확장할 수 있습니다.", "틀림: Oracle·SQL Server는 RDS for Oracle·RDS for SQL Server로 제공되며, Aurora는 MySQL·PostgreSQL 호환입니다.", "틀림: Aurora는 여러 AZ에 분산된 클러스터 스토리지 볼륨을 사용합니다.", "맞음: Aurora 클러스터 스토리지는 3개 AZ에 6개 사본을 유지합니다.", "맞음: Aurora는 MySQL 호환과 PostgreSQL 호환 버전을 제공합니다."], "tags": ["지식확인", "Amazon Aurora"]}, {"id": "m6-007", "module": 6, "level": "basic", "pick": 1, "q": "Amazon DynamoDB 테이블의 기본 키(primary key)로 구성할 수 있는 방식은?", "options": ["기본 키 없이 모든 속성을 자유롭게 저장하고 SQL WHERE 절로 찾는다", "반드시 파티션 키, 정렬 키, 보조 인덱스 키 세 개를 모두 지정해야 한다", "정렬 키 하나만 사용하고 파티션 키는 생략할 수 있다", "파티션 키 하나만 사용하거나, 파티션 키와 정렬 키를 함께 사용한다"], "answer": [3], "explain": "DynamoDB는 기본 키로 항목을 고유하게 식별합니다. 파티션 키만 쓰면 그 값이 고유해야 하고, 파티션 키+정렬 키를 쓰면 두 값의 조합이 고유하면 됩니다(예: 장비 ID + 측정 시각).", "why": ["틀림: DynamoDB 테이블에는 반드시 기본 키가 있어야 합니다.", "틀림: 보조 인덱스는 기본 키 구성 요소가 아니며 선택 사항입니다.", "틀림: 파티션 키는 항상 필요합니다. 정렬 키만 단독으로 쓸 수는 없습니다.", "맞음: 단순 기본 키(파티션 키)와 복합 기본 키(파티션 키+정렬 키) 두 가지가 있습니다."], "tags": ["지식확인", "DynamoDB", "기본 키"]}, {"id": "m6-008", "module": 6, "level": "basic", "pick": 2, "q": "DynamoDB의 글로벌 보조 인덱스(GSI)와 로컬 보조 인덱스(LSI)에 대한 설명으로 옳은 것은?", "options": ["LSI는 기본 테이블과 다른 파티션 키를 사용한다", "GSI에서는 강력한 일관성(strongly consistent) 읽기를 선택할 수 있다", "GSI는 기본 테이블과 다른 파티션 키를 사용할 수 있다", "LSI는 운영 중인 테이블에 언제든지 추가하거나 삭제할 수 있다", "LSI는 테이블을 생성할 때 함께 정의해야 한다"], "answer": [2, 4], "explain": "파티션 키까지 바꿔 조회하고 싶으면 GSI(언제든 추가 가능, 최종 일관성), 같은 파티션 키 안에서 다른 정렬 기준이 필요하고 강력한 일관성이 필요하면 LSI(생성 시 정의)를 씁니다.", "why": ["틀림: LSI는 기본 테이블과 같은 파티션 키를 쓰고 정렬 키만 다르게 합니다.", "틀림: GSI 읽기는 최종 일관성만 지원합니다. 강력한 일관성이 필요하면 LSI를 고려합니다.", "맞음: GSI는 파티션 키와 정렬 키를 모두 새로 정할 수 있습니다.", "틀림: 운영 중 추가·삭제가 가능한 것은 GSI입니다.", "맞음: LSI는 테이블 생성 시점에만 만들 수 있습니다."], "tags": ["지식확인", "DynamoDB", "GSI", "LSI"]}, {"id": "m6-009", "module": 6, "level": "basic", "pick": 1, "q": "소셜 네트워크 서비스에서 '친구의 친구'를 찾거나 관계를 따라가는 추천 기능을 구현하려고 한다. 관계 탐색에 최적화된 목적별 데이터베이스는?", "options": ["Amazon Keyspaces", "Amazon Timestream", "Amazon Redshift", "Amazon Neptune"], "answer": [3], "explain": "관계와 연결을 따라가는 질의(소셜 그래프, 추천, 사기 탐지, 지식 그래프)는 그래프 데이터베이스인 Amazon Neptune이 적합합니다.", "why": ["틀림: Keyspaces는 Apache Cassandra 호환 와이드 컬럼 DB입니다.", "틀림: Timestream은 시간순 측정값(시계열) DB입니다.", "틀림: Redshift는 대규모 분석(OLAP)용 데이터 웨어하우스입니다.", "맞음: Neptune은 노드와 관계(엣지)를 다루는 그래프 DB로 관계 탐색에 최적화되어 있습니다."], "tags": ["지식확인", "목적별 데이터베이스", "Neptune"]}, {"id": "m6-010", "module": 6, "level": "basic", "pick": 1, "q": "온프레미스 Oracle 데이터베이스를 Amazon Aurora PostgreSQL로 옮기는 이기종 마이그레이션에서, 소스의 스키마와 저장 프로시저 같은 SQL 코드를 대상 엔진에 맞게 변환하는 도구는?", "options": ["AWS Schema Conversion Tool(AWS SCT)", "AWS DMS Fleet Advisor", "Amazon RDS Proxy", "Amazon DynamoDB Streams"], "answer": [0], "explain": "이기종 마이그레이션은 두 단계입니다. 먼저 AWS SCT(또는 DMS Schema Conversion)로 스키마·코드를 변환하고, 그다음 AWS DMS로 데이터를 옮기며 변경 사항을 복제합니다.", "why": ["맞음: AWS SCT(또는 DMS Schema Conversion)는 스키마와 코드 객체를 대상 엔진 형식으로 변환합니다.", "틀림: Fleet Advisor는 온프레미스 DB 서버의 인벤토리를 수집·평가하는 도구입니다.", "틀림: RDS Proxy는 DB 연결 풀링 서비스입니다.", "틀림: DynamoDB 항목 변경을 캡처하는 기능으로 마이그레이션 변환과 무관합니다."], "tags": ["지식확인", "AWS DMS", "AWS SCT", "마이그레이션"]}, {"id": "m6-011", "module": 6, "level": "saa", "pick": 1, "q": "한 회사에 고가용성 관계형 데이터베이스가 필요하다. 초기 데이터는 8TB이고 매일 약 8GB씩 증가한다. 또한 증가하는 읽기 트래픽을 처리하기 위해 최소 8개의 읽기 전용 복제본이 필요하다. 가장 적합한 서비스는?", "options": ["Amazon DynamoDB", "Amazon Neptune", "Amazon Aurora", "Amazon Redshift"], "answer": [2], "explain": "'관계형 + 고가용성 + 많은 읽기 복제본 + 계속 늘어나는 데이터' 조합이면 Aurora를 떠올리면 됩니다. Aurora는 최대 15개의 읽기 복제본을 지원하고 스토리지가 자동으로 늘어납니다.", "why": ["틀림: DynamoDB는 NoSQL 키-값·문서 DB로, 관계형 요구에 맞지 않습니다.", "틀림: Neptune은 그래프 DB입니다.", "맞음: Aurora는 관계형 + 고가용성(3개 AZ 6개 사본) + 최대 15개 읽기 복제본 + 자동 증가 스토리지를 제공합니다.", "틀림: Redshift는 분석(OLAP)용 데이터 웨어하우스로, 트랜잭션용 관계형 DB 요구와 다릅니다."], "tags": ["교재샘플", "Amazon Aurora", "읽기 전용 복제본"]}, {"id": "m6-012", "module": 6, "level": "basic", "pick": 2, "q": "Amazon RDS Proxy를 사용할 때 얻을 수 있는 이점은?", "options": ["저장된 데이터를 자동으로 KMS 키로 암호화한다", "장애 조치 중 애플리케이션 연결을 유지해 장애 조치 시간을 줄인다", "DB 연결을 풀링·공유하여 데이터베이스의 연결 부담을 줄인다", "읽기 전용 복제본을 자동으로 생성하고 삭제한다", "DynamoDB 테이블 앞에서 인메모리 캐시 역할을 한다"], "answer": [1, 2], "explain": "RDS Proxy는 애플리케이션과 DB 사이에서 연결 풀을 관리합니다. 연결 수를 줄여 확장성을 높이고, 장애 조치 때 연결을 유지해 가용성을 높이며, IAM 인증과 Secrets Manager로 보안도 강화할 수 있습니다.", "why": ["틀림: 저장 데이터 암호화는 RDS 인스턴스 생성 시 설정하는 기능입니다.", "맞음: 교재는 RDS Proxy가 장애 조치 시간을 최대 66%까지 줄일 수 있다고 설명합니다.", "맞음: 연결 풀링으로 많은 짧은 연결을 소수의 DB 연결로 재사용합니다.", "틀림: 복제본 생성은 RDS Proxy의 기능이 아닙니다.", "틀림: RDS Proxy는 RDS·Aurora용이며 캐시 서비스가 아닙니다."], "tags": ["Amazon RDS", "RDS Proxy"]}, {"id": "m6-013", "module": 6, "level": "basic", "pick": 1, "q": "암호화되지 않은 상태로 운영 중인 Amazon RDS DB 인스턴스를 저장 데이터 암호화가 적용된 상태로 바꾸려면 어떻게 해야 하는가?", "options": ["클라이언트 연결에 SSL/TLS를 강제한다", "DB 스냅샷을 만들고, 스냅샷을 복사할 때 KMS 키로 암호화한 뒤, 암호화된 스냅샷에서 새 DB 인스턴스를 복원한다", "DB 인스턴스 설정에서 암호화를 켜고 재부팅한다", "암호화된 읽기 전용 복제본을 만든 뒤 독립 DB로 승격한다"], "answer": [1], "explain": "RDS 저장 데이터 암호화는 생성 시점에 정합니다. 기존 DB를 암호화하려면 '스냅샷 생성 → 암호화하며 복사 → 새 DB로 복원' 순서를 따르고, 이후 애플리케이션 연결 대상을 바꿉니다.", "why": ["틀림: TLS는 전송 중 데이터 보호이며 저장 데이터 암호화가 아닙니다.", "맞음: 기존 인스턴스는 직접 암호화할 수 없으므로 스냅샷 복사 시 암호화하고 새 인스턴스로 복원합니다.", "틀림: RDS 저장 데이터 암호화는 생성 후에 켤 수 없습니다.", "틀림: 암호화되지 않은 원본에서 암호화된 읽기 전용 복제본을 만들 수 없습니다."], "tags": ["Amazon RDS", "암호화", "스냅샷", "AWS KMS"]}, {"id": "m6-014", "module": 6, "level": "basic", "pick": 2, "q": "Amazon RDS의 자동 백업과 수동 DB 스냅샷에 대한 설명으로 옳은 것은?", "options": ["스냅샷에서 복원하면 기존 DB 인스턴스가 그 시점 데이터로 덮어써진다", "수동 DB 스냅샷은 사용자가 명시적으로 삭제할 때까지 보존된다", "자동 백업을 사용하면 보존 기간 안의 원하는 시점으로 복원(특정 시점 복구)할 수 있다", "수동 DB 스냅샷도 최대 35일이 지나면 자동으로 삭제된다", "자동 백업 보존 기간은 7일로 고정되어 바꿀 수 없다"], "answer": [1, 2], "explain": "자동 백업은 '보존 기간 내 어느 시점으로든' 돌아가는 기능이고, 수동 스냅샷은 '찍은 시점의 상태를 원하는 만큼 오래' 보관하는 기능입니다. 둘 다 복원하면 새 DB 인스턴스가 생깁니다.", "why": ["틀림: 복원하면 항상 새 DB 인스턴스가 만들어집니다.", "맞음: 수동 스냅샷은 보존 기간 제한 없이 직접 삭제할 때까지 남습니다.", "맞음: 자동 백업은 일일 스냅샷과 트랜잭션 로그로 특정 시점 복구를 지원합니다.", "틀림: 35일 제한은 자동 백업 보존 기간입니다.", "틀림: 보존 기간은 사용자가 설정할 수 있으며 최대 35일입니다."], "tags": ["Amazon RDS", "백업", "스냅샷"]}, {"id": "m6-015", "module": 6, "level": "basic", "pick": 2, "q": "Amazon DynamoDB에 대한 설명으로 옳은 것은?", "options": ["여러 테이블을 조인하는 복잡한 SQL 쿼리에 최적화되어 있다", "저장 데이터 암호화를 지원하지 않는다", "서버리스 완전관리형 NoSQL 데이터베이스로 키-값과 문서 데이터 모델을 지원한다", "글로벌 테이블을 사용하면 여러 AWS 리전에 테이블을 자동으로 복제할 수 있다", "사용자가 DB 서버의 운영 체제 패치를 직접 적용해야 한다"], "answer": [2, 3], "explain": "DynamoDB는 정해진 키로 빠르게(한 자릿수 밀리초) 읽고 쓰는 대규모 애플리케이션에 맞는 서버리스 NoSQL DB입니다. 글로벌 테이블, Streams, 특정 시점 복구, 기본 암호화 같은 기능을 제공합니다.", "why": ["틀림: 복잡한 조인은 관계형 DB(RDS, Aurora)가 적합합니다.", "틀림: DynamoDB는 저장 데이터를 기본적으로 암호화하며 AWS KMS 키를 사용합니다.", "맞음: DynamoDB는 서버 관리가 필요 없는 키-값·문서형 NoSQL DB입니다.", "맞음: 글로벌 테이블은 다중 리전·다중 활성 복제를 제공합니다.", "틀림: 서버리스이므로 OS와 서버는 AWS가 관리합니다."], "tags": ["DynamoDB", "NoSQL"]}, {"id": "m6-016", "module": 6, "level": "basic", "pick": 1, "q": "Amazon DynamoDB Streams의 용도로 가장 알맞은 것은?", "options": ["테이블에 대해 SQL 조인 쿼리를 실행한다", "테이블을 여러 리전에 다중 활성으로 복제한다", "테이블의 저장 데이터를 KMS 키로 암호화한다", "테이블 항목의 생성·수정·삭제 변경 사항을 시간순으로 캡처해, AWS Lambda 같은 이벤트 기반 처리와 연결한다"], "answer": [3], "explain": "DynamoDB Streams는 '무엇이 바뀌었는지'를 순서대로 흘려보내는 기능입니다. 변경을 트리거로 Lambda를 실행해 알림, 집계, 다른 시스템 동기화 같은 작업을 할 수 있습니다.", "why": ["틀림: Streams는 쿼리 기능이 아닙니다.", "틀림: 다중 리전 복제는 글로벌 테이블의 기능입니다(내부적으로 Streams를 활용하지만 목적이 다릅니다).", "틀림: 암호화는 별도의 저장 데이터 암호화 기능입니다.", "맞음: Streams는 항목 수준 변경을 순서대로 기록해 후속 처리를 가능하게 합니다."], "tags": ["DynamoDB", "DynamoDB Streams"]}, {"id": "m6-017", "module": 6, "level": "basic", "pick": 1, "q": "수년치 판매 데이터를 모아 비즈니스 인텔리전스(BI) 보고서용 대규모 집계·분석 쿼리(OLAP)를 실행하려고 한다. 가장 적합한 서비스는?", "options": ["Amazon RDS for MySQL", "Amazon Redshift", "Amazon DynamoDB", "Amazon ElastiCache"], "answer": [1], "explain": "OLTP(주문·결제 같은 일상 거래)는 RDS·Aurora, OLAP(많은 데이터의 집계·분석)는 Amazon Redshift가 맞습니다. Redshift Serverless를 쓰면 클러스터 관리 없이 분석할 수도 있습니다.", "why": ["틀림: RDS는 일상적인 트랜잭션 처리(OLTP)에 적합합니다.", "맞음: Redshift는 열 기반 저장과 병렬 처리로 대규모 분석 쿼리에 최적화된 데이터 웨어하우스입니다.", "틀림: DynamoDB는 키 기반 빠른 읽기·쓰기(OLTP성 접근)에 맞고 대규모 집계 분석에는 적합하지 않습니다.", "틀림: ElastiCache는 인메모리 캐시입니다."], "tags": ["목적별 데이터베이스", "Amazon Redshift", "OLAP"]}, {"id": "m6-018", "module": 6, "level": "basic", "pick": 2, "q": "목적별 데이터베이스와 적합한 용도를 올바르게 짝지은 것은?", "options": ["Amazon Timestream - IoT 센서 측정값 같은 시계열 데이터", "Amazon Keyspaces - Redis 호환 인메모리 데이터", "Amazon MemoryDB - 관계 탐색용 그래프 데이터", "Amazon DocumentDB - MongoDB 호환 JSON 문서 데이터", "Amazon Neptune - 대규모 데이터 웨어하우스 분석"], "answer": [0, 3], "explain": "서비스 이름과 데이터 모양을 연결해 외우세요. 문서(MongoDB) → DocumentDB, 와이드 컬럼(Cassandra) → Keyspaces, 인메모리(Redis) → MemoryDB, 그래프 → Neptune, 시계열 → Timestream, 분석 → Redshift입니다.", "why": ["맞음: Timestream은 시간순으로 쌓이는 측정 데이터에 최적화되어 있습니다.", "틀림: Keyspaces는 Apache Cassandra 호환입니다. Redis 호환 내구성 인메모리 DB는 MemoryDB입니다.", "틀림: 그래프 데이터는 Neptune입니다.", "맞음: DocumentDB는 MongoDB 호환 문서 DB입니다.", "틀림: 데이터 웨어하우스는 Redshift입니다."], "tags": ["목적별 데이터베이스"]}, {"id": "m6-019", "module": 6, "level": "basic", "pick": 1, "q": "Amazon RDS DB 인스턴스가 현재 db.m6g.large(vCPU 2개, 메모리 8GiB)로 실행 중이다. CPU 사용률은 낮지만 메모리가 부족하다. vCPU 수는 그대로 두고 메모리만 두 배로 늘리려면 어떤 인스턴스 클래스로 바꿔야 하는가?", "options": ["db.t3.medium (vCPU 2개, 메모리 4GiB)", "db.r6g.large (vCPU 2개, 메모리 16GiB)", "db.m6g.xlarge (vCPU 4개, 메모리 16GiB)", "db.r6g.xlarge (vCPU 4개, 메모리 32GiB)"], "answer": [1], "explain": "RDS 인스턴스 클래스는 범용(T, M)과 메모리 최적화(R, X)로 나뉩니다. 병목이 메모리라면 같은 크기의 R 계열로 바꾸는 것이 데이터에 기반한 알맞은 크기 조정입니다.", "why": ["틀림: 버스터블 범용 클래스이며 메모리가 오히려 줄어듭니다.", "맞음: R 계열은 메모리 최적화 클래스로, 같은 vCPU에서 메모리가 두 배입니다.", "틀림: 메모리는 두 배지만 vCPU도 두 배로 늘어 불필요한 비용이 생깁니다.", "틀림: vCPU와 메모리가 모두 필요 이상으로 커집니다."], "tags": ["Amazon RDS", "인스턴스 유형", "크기 조정"]}, {"id": "m6-020", "module": 6, "level": "basic", "pick": 2, "q": "AWS Database Migration Service(AWS DMS)에 대한 설명으로 옳은 것은?", "options": ["마이그레이션하는 동안에도 소스 데이터베이스를 계속 운영할 수 있어 가동 중지 시간을 최소화한다", "온프레미스 데이터베이스는 소스로 사용할 수 없다", "같은 엔진 간(동종) 마이그레이션과 다른 엔진 간(이기종) 마이그레이션을 모두 지원한다", "대상(target)으로 Amazon S3는 지정할 수 없다", "이기종 마이그레이션에서 저장 프로시저까지 모든 코드를 수정 없이 자동 변환해 준다"], "answer": [0, 2], "explain": "DMS는 데이터를 '옮기고 계속 동기화'하는 도구입니다. 엔진이 다르면 먼저 SCT로 스키마를 바꾸고, DMS로 전체 로드와 변경 데이터 복제(CDC)를 수행한 뒤 전환합니다.", "why": ["맞음: DMS는 소스를 운영하면서 데이터를 옮기고 변경 사항을 계속 복제할 수 있습니다.", "틀림: 온프레미스 DB는 대표적인 DMS 소스입니다.", "맞음: 예: MySQL→RDS for MySQL(동종), Oracle→Aurora(이기종).", "틀림: DMS는 S3를 대상으로 데이터 레이크에 복제할 수 있습니다.", "틀림: 스키마·코드 변환은 SCT/Schema Conversion의 역할이며, 일부는 수동 수정이 필요할 수 있습니다."], "tags": ["AWS DMS", "마이그레이션"]}, {"id": "m6-021", "module": 6, "level": "basic", "pick": 1, "q": "Amazon Aurora Serverless v2가 특히 적합한 경우는?", "options": ["항상 일정하고 예측 가능한 대용량 트래픽이 24시간 들어오는 워크로드만", "사용량을 예측하기 어렵고 수시로 크게 변하는 워크로드나 개발·테스트 환경", "수 페타바이트 데이터의 열 기반 분석", "그래프 관계를 탐색해야 하는 워크로드"], "answer": [1], "explain": "Aurora Serverless v2는 DB 용량을 수요에 맞춰 자동으로 늘리고 줄입니다. 가변성이 높은 워크로드, 새 애플리케이션, 개발·테스트처럼 용량 계획이 어려운 경우에 좋습니다.", "why": ["틀림: 일정한 부하는 프로비저닝된 인스턴스로도 충분히 효율적일 수 있습니다. 서버리스의 장점은 변동성 대응입니다.", "맞음: Aurora Serverless v2는 수요에 따라 용량을 자동으로 조정합니다.", "틀림: 대규모 분석은 Redshift입니다.", "틀림: 그래프는 Neptune입니다."], "tags": ["Amazon Aurora", "Aurora Serverless"]}, {"id": "m6-022", "module": 6, "level": "basic", "pick": 2, "q": "웹 서버(EC2)가 Amazon RDS for MySQL에 연결하는 구조에서 데이터베이스 보안 모범 사례에 해당하는 것은?", "options": ["AWS KMS 키로 DB 인스턴스의 저장 데이터 암호화를 활성화한다", "관리 편의를 위해 DB 보안 그룹에서 0.0.0.0/0의 3306 포트를 허용한다", "RDS를 프라이빗 서브넷에 두고, DB 보안 그룹의 3306 인바운드 소스를 웹 서버 보안 그룹으로 제한한다", "DB 마스터 암호를 애플리케이션 소스 코드에 직접 적어 둔다", "RDS를 퍼블릭 서브넷에 두고 '퍼블릭 액세스 가능'을 켠다"], "answer": [0, 2], "explain": "DB 계층은 프라이빗 서브넷 + 앱 보안 그룹만 허용 + 저장·전송 암호화가 기본입니다. IAM은 누가 DB를 만들고 바꿀지(관리 작업)를, 보안 그룹은 누가 연결할지를, DB 사용자 권한은 무엇을 할 수 있을지를 각각 통제합니다.", "why": ["맞음: 저장 데이터와 백업·스냅샷을 KMS로 암호화하는 것이 모범 사례입니다.", "틀림: 인터넷 전체에 DB 포트를 열면 안 됩니다.", "맞음: 필요한 주체(웹 서버)만 DB 포트에 접근하게 하는 최소 권한 구성입니다.", "틀림: 자격 증명은 Secrets Manager 등에 보관해야 합니다.", "틀림: 웹 서버만 접근하면 되므로 DB를 인터넷에 노출할 이유가 없습니다."], "tags": ["Amazon RDS", "보안 그룹", "암호화"]}, {"id": "m6-023", "module": 6, "level": "saa", "pick": 1, "q": "온라인 쇼핑몰이 Amazon RDS for MySQL 단일 인스턴스를 사용한다. 매일 오후 실행되는 대규모 보고서 조회 때문에 주문 처리(쓰기) 응답이 느려진다. 보고서는 몇 초 정도 지난 데이터여도 괜찮다. 애플리케이션 변경을 최소화하면서 주문 처리 성능을 지키는 방법은?", "options": ["다중 AZ를 활성화하고 보고서 조회를 대기 인스턴스로 보낸다", "데이터를 Amazon DynamoDB로 옮기고 보고서는 Scan으로 처리한다", "RDS Proxy를 앞에 두어 보고서 쿼리 부하를 없앤다", "읽기 전용 복제본을 만들고 보고서 조회를 복제본 엔드포인트로 보낸다", "자동 백업 보존 기간을 35일로 늘린다"], "answer": [3], "explain": "읽기 위주의 무거운 작업을 분리할 때는 읽기 전용 복제본이 정답입니다. '몇 초 늦은 데이터 허용'이라는 단서가 비동기 복제를 써도 된다는 뜻입니다.", "why": ["틀림: 다중 AZ DB 인스턴스 배포의 대기 인스턴스는 읽기 요청을 받을 수 없습니다.", "틀림: 큰 재설계가 필요하고 Scan 기반 보고서는 비효율적입니다.", "틀림: RDS Proxy는 연결 수를 관리할 뿐 무거운 쿼리의 실행 부하를 다른 DB로 옮기지 않습니다.", "맞음: 보고서 읽기를 복제본으로 분리해 기본 인스턴스 부하를 줄입니다. 비동기 지연(수 초)은 허용 범위입니다.", "틀림: 백업 보존 기간은 성능과 무관합니다."], "tags": ["Amazon RDS", "읽기 전용 복제본", "성능"]}, {"id": "m6-024", "module": 6, "level": "saa", "pick": 1, "q": "금융 회사의 Amazon RDS for PostgreSQL DB는 AZ 장애가 나도 자동으로 복구되어야 하며, 커밋된 트랜잭션이 유실되면 안 되고, 애플리케이션의 DB 엔드포인트(연결 주소)를 바꾸지 않아야 한다. 가장 적합한 구성은?", "options": ["RDS Proxy만 앞에 배치한다", "자동 백업을 다른 리전으로 복제한다", "다중 AZ DB 인스턴스 배포를 활성화한다", "다른 AZ에 읽기 전용 복제본을 만들고 장애 시 승격한다", "매시간 수동 DB 스냅샷을 만들고 장애 시 복원한다"], "answer": [2], "explain": "'자동 장애 조치 + 데이터 유실 없음 + 엔드포인트 유지'는 다중 AZ의 정의와 같습니다. 읽기 전용 복제본은 비동기라 RPO 0을 보장하지 못합니다.", "why": ["틀림: Proxy는 장애 조치 시간을 줄여 주지만, 장애 조치할 대기 인스턴스 자체를 만들어 주지는 않습니다.", "틀림: 리전 재해 대비용이며 AZ 장애 시 자동 장애 조치를 제공하지 않습니다.", "맞음: 동기식 복제된 대기 인스턴스로 자동 장애 조치되며, 같은 DNS 엔드포인트가 새 기본 인스턴스를 가리킵니다.", "틀림: 비동기 복제라 일부 데이터 유실이 가능하고, 승격은 수동이며 엔드포인트도 바뀝니다.", "틀림: 복원은 새 인스턴스·새 엔드포인트를 만들고 최대 1시간치 데이터가 유실될 수 있습니다."], "tags": ["Amazon RDS", "다중 AZ", "고가용성"]}, {"id": "m6-025", "module": 6, "level": "saa", "pick": 1, "q": "서버리스 애플리케이션의 AWS Lambda 함수가 트래픽 급증 시 수천 개로 동시에 실행되면서 Amazon RDS for MySQL에 'Too many connections' 오류가 발생한다. 또한 보안팀은 DB 자격 증명을 코드에 넣지 말고 AWS Secrets Manager로 관리하길 원한다. 가장 적합한 해결책은?", "options": ["DB 인스턴스 클래스를 가장 큰 크기로 올려 최대 연결 수를 늘린다", "Amazon RDS Proxy를 구성하고 Lambda가 프록시 엔드포인트로 연결하게 한다", "DB 자격 증명을 Lambda 환경 변수에 평문으로 저장한다", "다중 AZ를 활성화한다", "읽기 전용 복제본을 5개 추가한다"], "answer": [1], "explain": "짧게 실행되는 함수가 연결을 많이 여는 경우 → RDS Proxy입니다. 연결 풀링, 장애 조치 시간 단축, IAM·Secrets Manager 기반 인증을 함께 얻을 수 있습니다.", "why": ["틀림: 일시적으로 완화될 수 있으나 연결 폭증의 근본 해결이 아니고 비용이 크며 자격 증명 요구도 충족하지 못합니다.", "맞음: RDS Proxy가 연결을 풀링해 DB 연결 수를 줄이고, Secrets Manager·IAM 인증과 통합됩니다.", "틀림: 연결 문제도 해결하지 못하고 보안 요구에도 어긋납니다.", "틀림: 가용성 기능이며 연결 수 문제와 무관합니다.", "틀림: 쓰기 연결과 연결 관리 문제는 해결되지 않습니다."], "tags": ["RDS Proxy", "AWS Lambda", "Secrets Manager"]}, {"id": "m6-026", "module": 6, "level": "saa", "pick": 1, "q": "운영자가 14:05에 실수로 Amazon RDS for MySQL의 중요한 테이블을 삭제했고 15:00에 발견했다. DB는 다중 AZ로 구성되어 있고 자동 백업 보존 기간은 7일이다. 데이터 손실을 최소화하며 복구하는 방법은?", "options": ["백업 보존 기간을 35일로 늘린 뒤 복원한다", "다중 AZ 장애 조치를 강제로 실행해 대기 인스턴스로 전환한다", "읽기 전용 복제본을 독립 DB로 승격한다", "기존 DB 인스턴스 위에 어제 날짜 자동 백업을 덮어써서 복원한다", "특정 시점 복구(PITR)로 14:04 시점의 새 DB 인스턴스를 만든 뒤, 애플리케이션 연결 대상을 새 인스턴스로 바꾼다"], "answer": [4], "explain": "고가용성(다중 AZ, 복제본)은 실수까지 그대로 복제하므로 백업을 대신하지 못합니다. 실수 이전으로 돌아가려면 자동 백업의 특정 시점 복구를 사용하고, 결과는 새 DB 인스턴스로 만들어집니다.", "why": ["틀림: 보존 기간 변경은 이번 복구와 무관합니다.", "틀림: 대기 인스턴스는 동기 복제되어 삭제도 그대로 반영되어 있습니다.", "틀림: 복제본에도 삭제가 이미 복제되었을 가능성이 큽니다.", "틀림: RDS는 기존 인스턴스에 덮어쓰는 복원을 하지 않고, 어제 시점은 손실이 더 큽니다.", "맞음: 자동 백업과 트랜잭션 로그로 삭제 직전 시점까지 복원할 수 있으며, 복원은 새 인스턴스로 생성됩니다."], "tags": ["Amazon RDS", "백업", "특정 시점 복구"]}, {"id": "m6-027", "module": 6, "level": "saa", "pick": 2, "q": "한 회사는 리전 전체 장애에 대비해 Amazon RDS 백업을 다른 AWS 리전에도 보관해야 한다. 복구 목표 시간은 몇 시간까지 허용되며 비용을 최소화하고 싶다. 요구 사항을 충족하는 방법은?", "options": ["자동 백업의 크로스 리전 복제를 활성화한다", "다중 AZ를 활성화한다", "RDS Proxy를 다른 리전에 만든다", "DB 스냅샷을 다른 리전으로 복사한다", "같은 리전의 다른 AZ에 읽기 전용 복제본을 만든다"], "answer": [0, 3], "explain": "AZ 장애 대비는 다중 AZ, 리전 장애 대비는 백업이나 데이터를 다른 리전에 두는 것입니다. 복구에 몇 시간이 걸려도 괜찮다면 스냅샷 복사나 크로스 리전 자동 백업 복제가 저렴한 선택입니다.", "why": ["맞음: 자동 백업(스냅샷과 트랜잭션 로그)을 다른 리전에 복제해 그 리전에서 특정 시점 복구가 가능합니다.", "틀림: 다중 AZ는 같은 리전 안의 AZ 장애 대비입니다.", "틀림: 프록시는 백업 기능이 아닙니다.", "맞음: 스냅샷을 다른 리전으로 복사해 두면 그 리전에서 새 DB를 복원할 수 있습니다.", "틀림: 같은 리전이면 리전 장애에 대비할 수 없습니다."], "tags": ["Amazon RDS", "백업", "재해 복구", "크로스 리전"]}, {"id": "m6-028", "module": 6, "level": "saa", "pick": 1, "q": "회사 A는 기본 AWS 관리형 키(aws/rds)로 암호화된 Amazon RDS 수동 스냅샷을 감사용 별도 계정 B와 공유하려 했지만 공유할 수 없었다. 올바른 해결 방법은?", "options": ["스냅샷의 암호화를 해제한 다음 공유한다", "계정 B에 읽기 전용 복제본을 직접 만든다", "계정 B의 IAM 사용자에게 AdministratorAccess를 부여한다", "스냅샷을 퍼블릭(공개)으로 설정한다", "고객 관리형 KMS 키로 암호화하여 스냅샷을 복사하고, 키 정책에서 계정 B에 키 사용을 허용한 뒤 복사본 스냅샷을 공유한다"], "answer": [4], "explain": "스냅샷을 다른 계정과 공유하려면 그 계정이 스냅샷을 해독할 수 있어야 합니다. 기본 AWS 관리형 키는 다른 계정에 권한을 줄 수 없으므로 고객 관리형 키로 복사·재암호화한 뒤 키 정책과 스냅샷을 함께 공유합니다.", "why": ["틀림: 암호화된 스냅샷의 암호화를 해제하는 기능은 없습니다.", "틀림: 다른 계정에 복제본을 만드는 방식으로 스냅샷 공유 문제를 해결할 수 없습니다.", "틀림: 계정 A의 KMS 키 권한 문제는 계정 B의 IAM 권한으로 해결되지 않습니다.", "틀림: 암호화된 스냅샷은 공개할 수 없고, 감사 데이터를 공개하는 것도 위험합니다.", "맞음: AWS 관리형 키로 암호화된 스냅샷은 공유할 수 없고, 고객 관리형 키로 다시 암호화한 복사본은 키 권한과 함께 공유할 수 있습니다."], "tags": ["Amazon RDS", "스냅샷", "AWS KMS", "암호화"]}, {"id": "m6-029", "module": 6, "level": "saa", "pick": 1, "q": "전 세계 사용자를 대상으로 하는 모바일 게임이 플레이어 프로필을 저장한다. 북미·유럽·아시아의 사용자가 모두 가까운 리전에서 한 자릿수 밀리초 지연으로 읽고 써야 하며, 한 리전이 장애가 나도 다른 리전에서 계속 쓰기가 가능해야 한다. 운영 부담이 가장 적은 방법은?", "options": ["한 리전의 Amazon RDS for MySQL에 다른 리전 읽기 전용 복제본을 둔다", "단일 리전 DynamoDB 테이블에 GSI를 추가한다", "리전마다 독립 DynamoDB 테이블을 만들고 애플리케이션이 직접 세 곳에 쓰게 한다", "DynamoDB Streams와 Lambda로 리전 간 복제 코드를 직접 작성한다", "Amazon DynamoDB 글로벌 테이블을 사용해 세 리전에 복제본 테이블을 둔다"], "answer": [4], "explain": "'여러 리전 + 각 리전에서 쓰기 + 낮은 지연 + 관리형'이면 DynamoDB 글로벌 테이블입니다. RDS 크로스 리전 복제본은 읽기만 분산합니다.", "why": ["틀림: 쓰기는 여전히 한 리전에서만 가능하므로 리전 장애 시 쓰기가 멈춥니다.", "틀림: GSI는 조회 방식을 바꾸는 인덱스이지 다중 리전 복제가 아닙니다.", "틀림: 동기화·충돌 처리를 직접 구현해야 해 운영 부담이 큽니다.", "틀림: 가능은 하지만 글로벌 테이블이 같은 기능을 관리형으로 제공하므로 운영 부담이 큽니다.", "맞음: 글로벌 테이블은 다중 리전·다중 활성 복제로 각 리전에서 로컬 읽기·쓰기를 제공합니다."], "tags": ["DynamoDB", "글로벌 테이블", "다중 리전"]}, {"id": "m6-030", "module": 6, "level": "saa", "pick": 1, "q": "운영 중인 DynamoDB Orders 테이블의 기본 키는 CustomerId(파티션 키) + OrderDate(정렬 키)이다. 새로 '모든 고객의 주문 중 OrderStatus가 SHIPPED인 주문'을 효율적으로 조회해야 한다. 테이블을 다시 만들지 않고 해결하는 방법은?", "options": ["DynamoDB Streams를 활성화한다", "기본 키를 OrderStatus로 바꾸도록 테이블 설정을 수정한다", "OrderStatus를 정렬 키로 하는 로컬 보조 인덱스(LSI)를 추가한다", "OrderStatus를 파티션 키로 하는 글로벌 보조 인덱스(GSI)를 추가한다", "Scan 작업에 OrderStatus 필터를 걸어 조회한다"], "answer": [3], "explain": "새로운 접근 패턴이 '다른 파티션 키'를 요구하면 GSI입니다. GSI는 언제든 추가할 수 있지만 읽기는 최종 일관성이라는 점도 함께 기억하세요.", "why": ["틀림: Streams는 변경 캡처 기능이지 조회용 인덱스가 아닙니다.", "틀림: 기존 테이블의 기본 키는 바꿀 수 없습니다.", "틀림: LSI는 테이블 생성 시에만 만들 수 있고, 파티션 키가 CustomerId로 같아 고객 전체를 가로지르는 조회에 맞지 않습니다.", "맞음: GSI는 운영 중인 테이블에 추가할 수 있고 파티션 키를 다르게 정할 수 있습니다.", "틀림: Scan은 전체 테이블을 읽으므로 대규모 테이블에서 느리고 비용이 큽니다."], "tags": ["DynamoDB", "GSI"]}, {"id": "m6-031", "module": 6, "level": "saa", "pick": 1, "q": "새로 설계하는 DynamoDB 테이블의 기본 키는 DeviceId(파티션 키) + Timestamp(정렬 키)이다. 같은 장비 안에서 ErrorLevel 순으로도 정렬해 조회해야 하며, 이 조회에는 강력한 일관성(strongly consistent) 읽기가 반드시 필요하다. 가장 적합한 방법은?", "options": ["DynamoDB 글로벌 테이블을 활성화한다", "테이블 생성 시 DeviceId 파티션 키와 ErrorLevel 정렬 키로 로컬 보조 인덱스(LSI)를 정의한다", "테이블 생성 후 ErrorLevel 파티션 키로 GSI를 추가한다", "DeviceId 파티션 키와 ErrorLevel 정렬 키로 GSI를 만든다"], "answer": [1], "explain": "LSI는 '같은 파티션 키, 다른 정렬 키'이고 강력한 일관성 읽기를 고를 수 있지만, 반드시 테이블 생성 시 정의해야 합니다. 새 테이블 설계 단계라서 LSI를 쓸 수 있습니다.", "why": ["틀림: 다중 리전 복제 기능으로 정렬·일관성 요구와 무관합니다.", "맞음: 같은 파티션 키 + 다른 정렬 키 + 강력한 일관성 읽기는 LSI의 조건입니다.", "틀림: GSI는 강력한 일관성 읽기를 지원하지 않습니다.", "틀림: 키 구성은 맞아도 GSI는 최종 일관성만 지원합니다."], "tags": ["DynamoDB", "LSI"]}, {"id": "m6-032", "module": 6, "level": "saa", "pick": 3, "q": "한 기업이 여러 워크로드에 맞는 AWS 데이터베이스를 고르고 있다. 요구 사항과 서비스가 올바르게 짝지어진 것은?", "options": ["수백만 사용자의 세션 데이터를 키로 빠르게 읽고 쓰는 서버리스 저장소 - Amazon DynamoDB", "공장 센서의 초 단위 온도 측정값 저장·추세 분석 - Amazon Neptune", "계좌·기기·주소 간 관계를 따라가는 사기 탐지 - Amazon Timestream", "기존 MongoDB 애플리케이션의 관리형 이전 - Amazon Keyspaces", "수십억 행의 판매 데이터를 집계하는 BI 분석 - Amazon Redshift", "복잡한 조인과 ACID 트랜잭션이 필요한 결제 시스템 - Amazon Aurora"], "answer": [0, 4, 5], "explain": "'하나의 DB로 모든 것'이 아니라 데이터 모양과 접근 패턴에 맞는 목적별 DB를 고르는 것이 AWS의 권장 방식입니다. 관계형 거래 → Aurora/RDS, 분석 → Redshift, 키-값 → DynamoDB, 그래프 → Neptune, 시계열 → Timestream, 문서 → DocumentDB입니다.", "why": ["맞음: 키 기반의 빠른 접근과 서버리스 확장은 DynamoDB의 강점입니다.", "틀림: 시계열 데이터는 Timestream입니다. Neptune은 그래프 DB입니다.", "틀림: 관계 탐색은 그래프 DB인 Neptune입니다.", "틀림: MongoDB 호환은 DocumentDB입니다. Keyspaces는 Cassandra 호환입니다.", "맞음: 대규모 집계 분석(OLAP)은 Redshift입니다.", "맞음: 관계형 OLTP 요구에는 Aurora(또는 RDS)가 맞습니다."], "tags": ["목적별 데이터베이스", "Amazon Aurora", "Amazon Redshift", "DynamoDB"]}, {"id": "m6-033", "module": 6, "level": "saa", "pick": 2, "q": "온프레미스 Oracle 데이터베이스를 Amazon Aurora PostgreSQL로 이전하려 한다. 마이그레이션 중에도 소스 DB는 계속 주문을 받아야 하며, 최종 전환 시 가동 중지 시간을 최소화해야 한다. 함께 사용해야 하는 방법은?", "options": ["온프레미스 Oracle에 대해 Aurora 읽기 전용 복제본을 만들고 승격한다", "AWS DMS만 사용하면 저장 프로시저까지 자동으로 완전히 변환되므로 다른 도구는 필요 없다", "AWS SCT(또는 DMS Schema Conversion)로 Oracle 스키마와 코드를 PostgreSQL 형식으로 변환한다", "소스 DB를 중지하고 전체 덤프 파일을 만든 뒤 Aurora로 가져온다", "AWS DMS로 전체 로드 후 변경 데이터 캡처(CDC)로 지속 복제하다가 전환한다"], "answer": [2, 4], "explain": "이기종 이전 = 스키마 변환(SCT) + 데이터 이동·지속 복제(DMS)입니다. 전체 로드 후 CDC로 차이를 따라잡게 하면 마지막 전환만 짧게 멈추면 됩니다.", "why": ["틀림: 온프레미스 Oracle을 원본으로 하는 Aurora 읽기 복제본은 만들 수 없습니다.", "틀림: DMS는 데이터를 옮기는 도구이며, 코드 변환은 SCT/Schema Conversion의 역할입니다.", "맞음: 이기종 이전이므로 스키마·코드 변환이 먼저 필요합니다.", "틀림: 덤프·가져오기 동안 서비스가 멈추므로 가동 중지 최소화 요구에 맞지 않습니다.", "맞음: 소스를 운영하면서 변경 사항을 계속 복제하면 전환 시 중지 시간이 짧습니다."], "tags": ["AWS DMS", "AWS SCT", "마이그레이션"]}, {"id": "m6-034", "module": 6, "level": "saa", "pick": 2, "q": "규정상 Amazon RDS의 모든 저장 데이터(백업과 복제본 포함)를 암호화해야 한다. 이에 대한 설명으로 옳은 것은?", "options": ["저장 데이터 암호화를 켜면 클라이언트와의 연결도 자동으로 TLS로 암호화된다", "DB 인스턴스 생성 시 KMS 암호화를 켜면 기본 스토리지뿐 아니라 자동 백업, 스냅샷, 읽기 전용 복제본도 암호화된다", "암호화된 기본 인스턴스에서 암호화되지 않은 읽기 전용 복제본을 만들 수 있다", "이미 운영 중인 암호화되지 않은 인스턴스는 스냅샷을 암호화하여 복사한 뒤 새 인스턴스로 복원해야 한다", "암호화된 DB 인스턴스는 필요하면 나중에 암호화를 해제할 수 있다"], "answer": [1, 3], "explain": "RDS 암호화는 '생성할 때 켜고, 켜면 파생물까지 모두 암호화, 끌 수 없음'으로 기억하세요. 저장 데이터 암호화(KMS)와 전송 중 암호화(TLS)는 서로 다른 설정입니다.", "why": ["틀림: 전송 중 암호화(SSL/TLS)는 별도로 설정·강제해야 합니다.", "맞음: 암호화된 인스턴스에서 파생된 백업·스냅샷·복제본도 암호화됩니다.", "틀림: 기본 인스턴스가 암호화되어 있으면 복제본도 암호화되어야 합니다.", "맞음: 생성 후에는 직접 암호화를 켤 수 없으므로 스냅샷 복사 경로를 사용합니다.", "틀림: 한 번 암호화된 RDS 인스턴스의 암호화는 해제할 수 없습니다."], "tags": ["Amazon RDS", "암호화", "AWS KMS"]}, {"id": "m6-035", "module": 6, "level": "saa", "pick": 1, "q": "개발팀의 테스트용 관계형 데이터베이스는 업무 시간 중 불규칙하게 몇 시간만 사용되고 부하 크기도 예측하기 어렵다. 용량 계획 부담을 없애고 비용을 줄이면서 MySQL 호환성을 유지하려면 어떻게 해야 하는가?", "options": ["읽기 전용 복제본을 여러 개 미리 만들어 둔다", "Amazon Aurora Serverless v2(MySQL 호환)를 사용한다", "메모리 최적화 대형 인스턴스로 다중 AZ RDS를 프로비저닝한다", "Amazon Redshift Serverless로 이전한다", "EC2에 MySQL을 직접 설치하고 크기를 수동으로 조정한다"], "answer": [1], "explain": "예측이 어렵고 들쭉날쭉한 관계형 워크로드에는 Aurora Serverless v2가 맞습니다. 데이터에 기반해 알맞은 리소스 유형을 고르는 것은 Well-Architected 비용 최적화 원칙과도 연결됩니다.", "why": ["틀림: 복제본을 늘리면 비용이 증가하고 용량 계획 문제도 해결되지 않습니다.", "맞음: 수요에 따라 용량이 자동 조정되므로 변동이 큰 개발·테스트 워크로드에 적합합니다.", "틀림: 사용하지 않는 시간에도 큰 용량 비용이 발생합니다.", "틀림: Redshift는 분석용 데이터 웨어하우스로 MySQL 호환 트랜잭션 DB가 아닙니다.", "틀림: 관리 부담이 늘고 용량 계획 문제가 그대로 남습니다."], "tags": ["Aurora Serverless", "비용 최적화"]}, {"id": "m6-036", "module": 6, "level": "saa", "pick": 2, "q": "Amazon RDS for MySQL 기반 서비스가 성장하면서 두 가지 요구가 생겼다. (1) AZ 장애 시 자동으로 복구되어야 한다. (2) 늘어나는 조회 트래픽을 기본 인스턴스 밖으로 분산해야 한다. 두 요구를 모두 충족하는 조합은?", "options": ["읽기 전용 복제본을 추가하고 조회 트래픽을 복제본으로 보낸다", "다중 AZ 대기 인스턴스를 조회용 엔드포인트로 사용한다", "다중 AZ 배포를 활성화한다", "RDS Proxy를 추가해 읽기 쿼리를 대기 인스턴스로 보낸다", "자동 백업 보존 기간을 늘린다"], "answer": [0, 2], "explain": "장애 대비 → 다중 AZ, 읽기 증가 → 읽기 전용 복제본으로 각각 설계합니다. 두 기능은 함께 사용할 수 있으며 서로를 대신하지 않습니다.", "why": ["맞음: 읽기 트래픽을 분산합니다(요구 2).", "틀림: 다중 AZ DB 인스턴스 배포의 대기 인스턴스는 읽기에 사용할 수 없습니다.", "맞음: AZ 장애 시 자동 장애 조치를 제공합니다(요구 1).", "틀림: RDS Proxy는 연결 풀링 서비스이며 읽을 수 없는 대기 인스턴스로 쿼리를 보낼 수 없습니다.", "틀림: 백업은 시점 복구용이지 자동 장애 조치나 읽기 분산 기능이 아닙니다."], "tags": ["Amazon RDS", "다중 AZ", "읽기 전용 복제본"]}, {"id": "m6-037", "module": 6, "level": "saa", "pick": 1, "q": "애플리케이션 버그로 DynamoDB 테이블의 일부 항목이 잘못된 값으로 덮어써졌다. 회사는 앞으로 최근 35일 이내의 임의 시점(초 단위)으로 테이블을 복원할 수 있기를 원한다. 가장 적합한 기능은?", "options": ["DynamoDB 글로벌 테이블을 활성화한다", "DynamoDB 특정 시점 복구(PITR)를 활성화한다", "테이블의 저장 데이터 암호화를 고객 관리형 키로 바꾼다", "글로벌 보조 인덱스(GSI)를 추가한다", "매주 일요일 온디맨드 백업을 만든다"], "answer": [1], "explain": "DynamoDB의 특정 시점 복구(PITR)는 최대 35일 이내의 원하는 시점으로 복원해 실수나 버그로 인한 변경을 되돌릴 수 있게 합니다. 복제 기능(글로벌 테이블)은 실수까지 복제한다는 점에 주의하세요.", "why": ["틀림: 잘못된 쓰기도 다른 리전으로 그대로 복제됩니다.", "맞음: PITR은 최근 35일 내 원하는 시점으로 테이블을 새 테이블로 복원합니다.", "틀림: 암호화는 데이터 보호이지 복구 기능이 아닙니다.", "틀림: GSI는 조회용 인덱스이며 복구 기능이 아닙니다.", "틀림: 백업 시점으로만 복원할 수 있어 임의 시점 복구 요구를 충족하지 못합니다."], "tags": ["DynamoDB", "특정 시점 복구", "백업"]}, {"id": "m6-038", "module": 6, "level": "saa", "pick": 1, "q": "모바일 앱 사용자가 AWS 자격 증명을 받아 DynamoDB UserData 테이블에 직접 접근한다. 테이블의 파티션 키는 UserId이다. 각 사용자가 자신의 UserId와 같은 파티션 키 항목만 읽고 쓰도록 제한하는 가장 적절한 방법은?", "options": ["VPC 엔드포인트 정책에 모든 사용자 ID를 나열한다", "보안 그룹 규칙으로 사용자별 접근을 제한한다", "사용자마다 별도의 DynamoDB 테이블을 만든다", "IAM 정책 조건(dynamodb:LeadingKeys)으로 파티션 키 값을 사용자 ID로 제한한다", "사용자마다 다른 KMS 키로 테이블을 암호화한다"], "answer": [3], "explain": "DynamoDB 보안 모범 사례는 IAM 역할로 인증하고, IAM 정책(및 조건)으로 권한을 최소화하는 것입니다. 조건 키를 쓰면 '자기 데이터만' 같은 세분화된 접근 제어를 할 수 있습니다.", "why": ["틀림: 모바일 앱은 VPC 밖에서 접근하며, 엔드포인트 정책은 이런 사용자별 제어에 맞지 않습니다.", "틀림: 보안 그룹은 네트워크 수준 제어로 항목 단위 권한을 표현할 수 없습니다.", "틀림: 테이블이 무수히 늘어 관리가 불가능하고 확장성이 떨어집니다.", "맞음: IAM 정책 조건을 사용하면 항목 수준의 세분화된 액세스 제어가 가능합니다.", "틀림: 테이블은 하나의 키로 암호화되며 항목별 접근 제어 수단이 아닙니다."], "tags": ["DynamoDB", "IAM", "보안"]}, {"id": "m6-039", "module": 6, "level": "saa", "pick": 1, "q": "한 회사가 EC2에서 직접 운영하던 MongoDB 기반 콘텐츠 관리 시스템을 관리형 서비스로 옮기려 한다. JSON 문서 구조를 유지하고 애플리케이션 코드 변경을 최소화해야 한다. 가장 적합한 서비스는?", "options": ["Amazon DocumentDB(MongoDB 호환)", "Amazon RDS for PostgreSQL", "Amazon Keyspaces(Apache Cassandra 호환)", "Amazon Neptune", "Amazon Timestream"], "answer": [0], "explain": "'MongoDB + 관리형 + 코드 변경 최소화'는 Amazon DocumentDB입니다. 이전에는 AWS DMS를 사용해 MongoDB 데이터를 DocumentDB로 옮길 수 있습니다.", "why": ["맞음: MongoDB 호환 API와 JSON 문서 모델을 제공하는 완전관리형 문서 DB입니다.", "틀림: 관계형 스키마로 재설계와 코드 변경이 많이 필요합니다.", "틀림: Cassandra 호환으로 MongoDB 코드를 그대로 쓸 수 없습니다.", "틀림: 그래프 DB입니다.", "틀림: 시계열 DB입니다."], "tags": ["목적별 데이터베이스", "Amazon DocumentDB"]}, {"id": "m7-001", "module": 7, "level": "basic", "pick": 1, "q": "Amazon VPC와 서브넷의 범위에 대한 설명으로 옳은 것은?", "options": ["VPC와 서브넷 모두 여러 리전에 걸쳐 만들 수 있다", "서브넷 하나를 여러 AZ에 걸쳐 만들어 고가용성을 확보한다", "VPC는 한 리전 안의 여러 AZ에 걸칠 수 있지만, 서브넷은 하나의 AZ에만 속한다", "VPC는 하나의 AZ에만 만들 수 있으므로 AZ마다 VPC를 따로 만들어야 한다"], "answer": [2], "explain": "VPC는 한 리전 안에서 논리적으로 격리된 내 네트워크이고, 그 안을 AZ별 서브넷으로 나눕니다. 고가용성을 원하면 여러 AZ에 서브넷을 하나씩 만들어 리소스를 나눠 배치합니다.", "why": ["틀림: VPC는 하나의 리전에 속합니다.", "틀림: 서브넷은 여러 AZ에 걸칠 수 없습니다. 고가용성은 AZ마다 서브넷을 만들어 확보합니다.", "맞음: VPC는 리전 단위, 서브넷은 AZ 단위입니다.", "틀림: 하나의 VPC 안에 여러 AZ의 서브넷을 둘 수 있습니다."], "tags": ["지식확인", "VPC", "서브넷", "가용 영역"]}, {"id": "m7-002", "module": 7, "level": "basic", "pick": 1, "q": "10.0.1.0/24 서브넷에서 EC2 인스턴스 등 리소스에 할당할 수 있는 IPv4 주소는 몇 개인가?", "options": ["256개", "254개", "251개", "250개"], "answer": [2], "explain": "AWS는 모든 서브넷에서 IP 5개를 예약합니다: 첫 주소(네트워크 주소), .1(VPC 라우터), .2(DNS), .3(향후 사용), 마지막 주소(브로드캐스트). 그래서 /24는 251개, /28은 11개만 쓸 수 있습니다.", "why": ["틀림: /24의 전체 주소 수는 256개지만 AWS가 5개를 예약합니다.", "틀림: 일반 네트워크의 계산(네트워크·브로드캐스트 2개 제외)이며, AWS는 5개를 예약합니다.", "맞음: 256 - 5(AWS 예약) = 251개입니다.", "틀림: AWS 예약 주소는 6개가 아니라 5개입니다."], "tags": ["지식확인", "CIDR", "서브넷", "예약 IP"]}, {"id": "m7-003", "module": 7, "level": "basic", "pick": 1, "q": "어떤 서브넷을 '퍼블릭 서브넷'으로 만드는 결정적인 조건은?", "options": ["서브넷 이름에 public이라는 태그를 붙인다", "서브넷 CIDR 블록이 공인 IP 대역이다", "서브넷에 연결된 라우팅 테이블에 인터넷 게이트웨이(IGW)로 가는 경로(예: 0.0.0.0/0 → IGW)가 있다", "서브넷에 NAT 게이트웨이로 가는 경로가 있다"], "answer": [2], "explain": "서브넷 자체에 '퍼블릭' 스위치가 있는 것이 아니라, 연결된 라우팅 테이블에 IGW로 가는 경로가 있으면 퍼블릭 서브넷입니다. 그 안의 인스턴스가 실제로 인터넷과 통신하려면 퍼블릭 IP(또는 탄력적 IP)도 필요합니다.", "why": ["틀림: 이름이나 태그는 동작에 영향을 주지 않습니다.", "틀림: VPC 서브넷은 보통 사설 대역을 쓰며, 퍼블릭 여부는 경로로 결정됩니다.", "맞음: 퍼블릭/프라이빗은 라우팅 테이블에 IGW 경로가 있는지로 구분합니다.", "틀림: 0.0.0.0/0 → NAT 게이트웨이 경로는 '인터넷으로 나가기만 하는' 프라이빗 서브넷의 구성입니다."], "tags": ["지식확인", "퍼블릭 서브넷", "인터넷 게이트웨이", "라우팅 테이블"]}, {"id": "m7-004", "module": 7, "level": "basic", "pick": 1, "q": "NAT 게이트웨이의 역할로 옳은 것은?", "options": ["인터넷 사용자가 프라이빗 서브넷의 인스턴스에 직접 접속할 수 있게 한다", "프라이빗 서브넷의 인스턴스가 인터넷으로 나가는 연결을 시작할 수 있게 하되, 인터넷에서 시작된 연결은 받지 않게 한다", "서로 다른 두 VPC를 연결한다", "인스턴스마다 고정 퍼블릭 IP를 자동으로 할당한다"], "answer": [1], "explain": "NAT(네트워크 주소 변환)는 사설 IP를 NAT 게이트웨이의 퍼블릭 IP로 바꿔 내보내고, 돌아오는 응답을 원래 인스턴스로 되돌려 줍니다. 패치 다운로드처럼 '나가기만 하면 되는' 프라이빗 서버에 사용합니다.", "why": ["틀림: NAT 게이트웨이는 외부에서 시작한 인바운드 연결을 허용하지 않습니다.", "맞음: NAT 게이트웨이는 내부에서 시작한 아웃바운드 연결과 그 응답만 처리합니다.", "틀림: NAT 게이트웨이는 VPC 간 연결 수단이 아닙니다.", "틀림: NAT 게이트웨이는 여러 인스턴스의 사설 IP를 자신의 퍼블릭 IP 하나로 변환합니다."], "tags": ["지식확인", "NAT 게이트웨이", "프라이빗 서브넷"]}, {"id": "m7-005", "module": 7, "level": "basic", "pick": 2, "q": "보안 그룹과 네트워크 ACL에 대한 설명으로 옳은 것은?", "options": ["네트워크 ACL은 개별 EC2 인스턴스(네트워크 인터페이스) 수준에서 적용된다", "보안 그룹 규칙은 규칙 번호가 낮은 것부터 차례로 평가된다", "보안 그룹에서 특정 IP를 차단하는 거부(Deny) 규칙을 만들 수 있다", "보안 그룹은 상태 저장(stateful) 방식이라 허용된 요청의 응답 트래픽이 자동으로 허용된다", "네트워크 ACL에는 허용 규칙과 거부 규칙을 모두 만들 수 있다"], "answer": [3, 4], "explain": "보안 그룹 = 인스턴스 수준, 허용만, 상태 저장, 모든 규칙 평가. 네트워크 ACL = 서브넷 수준, 허용·거부, 상태 비저장, 번호 순서대로 처음 일치하는 규칙 적용. 이 표를 그대로 외워 두세요.", "why": ["틀림: NACL은 서브넷 수준, 보안 그룹이 인스턴스(ENI) 수준입니다.", "틀림: 번호 순서 평가는 NACL의 방식입니다. 보안 그룹은 모든 규칙을 함께 평가합니다.", "틀림: 보안 그룹은 허용 규칙만 있습니다.", "맞음: 보안 그룹은 연결 상태를 추적하므로 응답을 위한 별도 규칙이 필요 없습니다.", "맞음: NACL은 Allow와 Deny를 모두 지원합니다."], "tags": ["지식확인", "보안 그룹", "네트워크 ACL"]}, {"id": "m7-006", "module": 7, "level": "basic", "pick": 1, "q": "탄력적 IP 주소(Elastic IP address)에 대한 설명으로 옳은 것은?", "options": ["IPv6 전용 주소로 IPv4 통신에는 사용할 수 없다", "VPC 내부 통신에만 쓰는 고정 프라이빗 IP 주소다", "계정에 할당되는 고정 퍼블릭 IPv4 주소로, 필요하면 다른 인스턴스나 네트워크 인터페이스로 다시 연결할 수 있다", "인스턴스를 중지했다가 시작할 때마다 새로 바뀌는 퍼블릭 IP 주소다"], "answer": [2], "explain": "인스턴스를 교체해도 같은 공인 주소를 유지해야 할 때 탄력적 IP를 씁니다. 참고로 2024년부터 퍼블릭 IPv4 주소는 사용 중이어도 요금이 부과되므로 필요한 곳에만 사용합니다.", "why": ["틀림: 탄력적 IP는 IPv4 주소입니다.", "틀림: 탄력적 IP는 퍼블릭 IPv4 주소입니다.", "맞음: 탄력적 IP는 고정되어 있고 재연결(재매핑)이 가능합니다.", "틀림: 그것은 자동 할당 퍼블릭 IP의 동작입니다. 탄력적 IP는 바뀌지 않습니다."], "tags": ["지식확인", "탄력적 IP"]}, {"id": "m7-007", "module": 7, "level": "basic", "pick": 2, "q": "게이트웨이 VPC 엔드포인트로 연결할 수 있는 AWS 서비스는?", "options": ["Amazon S3", "Amazon EC2 API", "Amazon SQS", "Amazon DynamoDB", "Amazon CloudWatch"], "answer": [0, 3], "explain": "게이트웨이 엔드포인트는 S3와 DynamoDB 두 서비스만 지원하며, 라우팅 테이블에 경로를 추가하는 방식이고 추가 요금이 없습니다. 그 밖의 많은 서비스는 인터페이스 엔드포인트(PrivateLink)를 사용합니다.", "why": ["맞음: S3는 게이트웨이 엔드포인트를 지원합니다.", "틀림: EC2 API는 인터페이스 엔드포인트로 연결합니다.", "틀림: SQS는 인터페이스 엔드포인트(PrivateLink)로 연결합니다.", "맞음: DynamoDB는 게이트웨이 엔드포인트를 지원합니다.", "틀림: CloudWatch는 인터페이스 엔드포인트로 연결합니다."], "tags": ["지식확인", "VPC 엔드포인트", "게이트웨이 엔드포인트"]}, {"id": "m7-008", "module": 7, "level": "basic", "pick": 2, "q": "VPC 흐름 로그(VPC Flow Logs)를 게시(저장)할 수 있는 대상은?", "options": ["Amazon CloudWatch Logs", "Amazon RDS", "Amazon DynamoDB", "Amazon EBS 볼륨", "Amazon S3"], "answer": [0, 4], "explain": "흐름 로그는 CloudWatch Logs, Amazon S3, Amazon Kinesis Data Firehose로 보낼 수 있습니다. S3에 쌓은 로그는 Athena로, Firehose를 통한 로그는 OpenSearch Service 등으로 분석합니다.", "why": ["맞음: 흐름 로그의 대표 대상입니다.", "틀림: RDS는 흐름 로그 대상이 아닙니다.", "틀림: DynamoDB는 흐름 로그 대상이 아닙니다.", "틀림: EBS는 흐름 로그 대상이 아닙니다.", "맞음: S3에 저장하고 Amazon Athena로 분석할 수 있습니다."], "tags": ["지식확인", "VPC 흐름 로그", "모니터링"]}, {"id": "m7-009", "module": 7, "level": "basic", "pick": 1, "q": "배스천 호스트(bastion host)의 역할로 옳은 것은?", "options": ["퍼블릭 서브넷에 두고, 이를 경유해 프라이빗 서브넷의 인스턴스에 SSH 등으로 안전하게 접속하는 관리용 서버", "들어오는 웹 트래픽을 여러 인스턴스에 분산하는 서버", "프라이빗 인스턴스가 인터넷에서 패치를 내려받을 수 있게 주소를 변환하는 서버", "S3에 인터넷 없이 접근하기 위한 VPC 내부 연결 지점"], "answer": [0], "explain": "배스천 호스트는 관리자 IP에서만 SSH를 허용하는 퍼블릭 서버입니다. 프라이빗 인스턴스는 배스천의 보안 그룹에서 오는 SSH만 허용해, 관리 포트를 인터넷 전체에 열지 않습니다.", "why": ["맞음: 배스천 호스트는 프라이빗 리소스 관리를 위한 통제된 진입점입니다.", "틀림: 그것은 로드 밸런서의 역할입니다.", "틀림: 그것은 NAT 게이트웨이의 역할입니다.", "틀림: 그것은 VPC 엔드포인트입니다."], "tags": ["지식확인", "배스천 호스트", "보안"]}, {"id": "m7-010", "module": 7, "level": "basic", "pick": 1, "q": "Amazon VPC Reachability Analyzer에 대한 설명으로 옳은 것은?", "options": ["누가 언제 어떤 AWS API를 호출했는지 기록한다", "소스와 대상 사이의 네트워크 구성(라우팅 테이블, 보안 그룹, 네트워크 ACL 등)을 분석해 연결 가능 여부와 차단 지점을 알려준다", "잘못된 보안 그룹 규칙을 자동으로 수정한다", "네트워크 패킷의 실제 내용(페이로드)을 복사해 분석 도구로 보낸다"], "answer": [1], "explain": "'어디서 막혔나?'를 찾을 때는 Reachability Analyzer, '어떤 트래픽이 허용·거부되었나?'를 기록할 때는 VPC 흐름 로그를 사용합니다.", "why": ["틀림: API 호출 기록은 AWS CloudTrail입니다.", "맞음: Reachability Analyzer는 실제 패킷을 보내지 않고 구성을 분석해 경로와 차단 요소를 보여 줍니다.", "틀림: 분석 결과를 알려 줄 뿐 자동 수정은 하지 않습니다.", "틀림: 패킷 복사는 Traffic Mirroring의 기능입니다."], "tags": ["지식확인", "Reachability Analyzer", "문제 해결"]}, {"id": "m7-011", "module": 7, "level": "basic", "pick": 3, "q": "새로 만든 VPC의 퍼블릭 서브넷에 EC2 인스턴스를 시작했다. 인스턴스에는 퍼블릭 IP가 있고 보안 그룹과 네트워크 ACL도 필요한 트래픽을 허용한다. 이 인스턴스가 인터넷과 통신하려면 추가로 해야 하는 작업을 모두 고르시오.", "options": ["서브넷의 CIDR 블록을 /16으로 늘린다", "프라이빗 서브넷에 NAT 게이트웨이를 생성한다", "생성한 인터넷 게이트웨이를 VPC에 연결(attach)한다", "S3용 게이트웨이 VPC 엔드포인트를 생성한다", "인터넷 게이트웨이(IGW)를 생성한다", "서브넷의 라우팅 테이블에 0.0.0.0/0 → 인터넷 게이트웨이 경로를 추가한다"], "answer": [2, 4, 5], "explain": "인터넷 연결의 3단계는 'IGW 만들기 → VPC에 연결하기 → 라우팅 테이블에 0.0.0.0/0 → IGW 경로 추가하기'입니다. 여기에 인스턴스의 퍼블릭 IP와 보안 규칙 허용이 함께 맞아야 통신됩니다.", "why": ["틀림: 주소 범위 크기는 인터넷 연결 여부와 관계없습니다.", "틀림: NAT 게이트웨이는 프라이빗 인스턴스의 아웃바운드용이며, 퍼블릭 서브넷 인스턴스에는 필요 없습니다(또한 NAT는 퍼블릭 서브넷에 둡니다).", "맞음: IGW는 만든 것만으로는 동작하지 않고 VPC에 연결해야 합니다.", "틀림: 엔드포인트는 AWS 서비스로 가는 비공개 경로이지 인터넷 연결 수단이 아닙니다.", "맞음: 인터넷 출입구인 IGW가 있어야 합니다.", "맞음: 경로가 있어야 인터넷 방향 트래픽이 IGW로 갑니다."], "tags": ["인터넷 게이트웨이", "라우팅 테이블", "퍼블릭 서브넷", "랩 원리"]}, {"id": "m7-012", "module": 7, "level": "basic", "pick": 2, "q": "VPC 라우팅 테이블에 대한 설명으로 옳은 것은?", "options": ["라우팅 테이블에 명시적으로 연결하지 않은 서브넷은 경로가 없어 통신할 수 없다", "하나의 라우팅 테이블은 하나의 서브넷에만 연결할 수 있다", "각 서브넷은 한 번에 하나의 라우팅 테이블에만 연결된다", "VPC CIDR에 대한 local 경로가 자동으로 생성되며 삭제할 수 없다", "0.0.0.0/0 경로는 local 경로보다 항상 우선 적용된다"], "answer": [2, 3], "explain": "라우팅 테이블은 '이 목적지로 가는 트래픽을 어디로 보낼지' 정합니다. 서브넷 하나는 테이블 하나만 쓰지만, 테이블 하나는 여러 서브넷이 공유할 수 있습니다. local 경로는 항상 있고 지울 수 없습니다.", "why": ["틀림: 명시적 연결이 없는 서브넷은 VPC의 기본(main) 라우팅 테이블을 사용합니다.", "틀림: 하나의 라우팅 테이블을 여러 서브넷이 함께 사용할 수 있습니다.", "맞음: 서브넷과 라우팅 테이블은 '서브넷 하나당 테이블 하나' 관계입니다.", "맞음: local 경로 덕분에 VPC 내부 서브넷끼리 기본적으로 통신할 수 있습니다.", "틀림: 라우팅은 가장 구체적인(접두사가 긴) 경로가 우선이므로 VPC 내부 주소는 local 경로를 따릅니다."], "tags": ["라우팅 테이블", "VPC"]}, {"id": "m7-013", "module": 7, "level": "basic", "pick": 2, "q": "네트워크 ACL의 기본 동작에 대한 설명으로 옳은 것은?", "options": ["명시적으로 NACL을 연결하지 않은 서브넷에는 NACL이 적용되지 않는다", "새로 만든 사용자 지정 네트워크 ACL은 규칙을 추가하기 전까지 모든 인바운드·아웃바운드 트래픽을 거부한다", "VPC와 함께 만들어지는 기본 네트워크 ACL은 모든 인바운드·아웃바운드 트래픽을 허용한다", "하나의 네트워크 ACL은 하나의 서브넷에만 연결할 수 있다", "새로 만든 사용자 지정 네트워크 ACL은 기본적으로 모든 트래픽을 허용한다"], "answer": [1, 2], "explain": "기본 NACL은 '모두 허용', 새 사용자 지정 NACL은 '모두 거부'로 시작합니다. 사용자 지정 NACL을 서브넷에 붙이는 순간 규칙을 추가하지 않으면 모든 통신이 끊기므로 주의해야 합니다.", "why": ["틀림: 명시적 연결이 없으면 기본 NACL이 자동으로 적용됩니다.", "맞음: 사용자 지정 NACL은 * (모두 거부) 규칙만 있는 상태로 시작합니다.", "맞음: 기본 NACL은 처음에 양방향 모두 허용합니다.", "틀림: 하나의 NACL을 여러 서브넷에 연결할 수 있습니다. 반대로 서브넷은 하나의 NACL만 가집니다.", "틀림: 모두 허용은 기본 NACL의 동작입니다. 사용자 지정 NACL은 모두 거부로 시작합니다."], "tags": ["네트워크 ACL"]}, {"id": "m7-014", "module": 7, "level": "basic", "pick": 1, "q": "새로 만든 보안 그룹(규칙을 추가하지 않은 상태)의 기본 동작은?", "options": ["인바운드 트래픽은 모두 거부되고, 아웃바운드 트래픽은 모두 허용된다", "인바운드와 아웃바운드가 모두 허용된다", "인바운드와 아웃바운드가 모두 거부된다", "인바운드는 모두 허용되고, 아웃바운드는 모두 거부된다"], "answer": [0], "explain": "보안 그룹은 '허용한 것만 들어온다'는 화이트리스트 방식입니다. 새 보안 그룹은 들어오는 것은 아무것도 허용하지 않고, 나가는 것은 모두 허용합니다.", "why": ["맞음: 새 보안 그룹은 인바운드 규칙이 없고, 모든 아웃바운드를 허용하는 규칙이 있습니다.", "틀림: 인바운드는 규칙을 추가해야만 허용됩니다.", "틀림: 아웃바운드는 기본적으로 모두 허용됩니다.", "틀림: 반대입니다."], "tags": ["보안 그룹"]}, {"id": "m7-015", "module": 7, "level": "basic", "pick": 1, "q": "Amazon VPC를 만들 때 지정할 수 있는 IPv4 CIDR 블록의 크기 범위는?", "options": ["/8 ~ /32", "/16 ~ /28", "/12 ~ /24", "/24 ~ /32"], "answer": [1], "explain": "VPC CIDR은 가장 큰 것이 /16(약 6만 5천 개 주소), 가장 작은 것이 /28(16개 주소)입니다. 숫자가 작을수록 주소가 많습니다. 앞으로의 확장을 생각해 넉넉하게 잡는 것이 좋습니다.", "why": ["틀림: VPC에는 /8이나 /32 같은 크기를 쓸 수 없습니다.", "맞음: VPC IPv4 CIDR은 /16(65,536개)부터 /28(16개)까지입니다.", "틀림: 허용 범위와 다릅니다.", "틀림: /16처럼 큰 VPC도 만들 수 있고 /32는 허용되지 않습니다."], "tags": ["CIDR", "VPC"]}, {"id": "m7-016", "module": 7, "level": "basic", "pick": 2, "q": "프라이빗 서브넷의 인스턴스를 위해 퍼블릭 NAT 게이트웨이를 만들 때 올바른 구성은?", "options": ["NAT 게이트웨이는 인터넷에서 시작된 인바운드 연결도 프라이빗 인스턴스로 전달한다", "NAT 게이트웨이를 인터넷을 사용할 프라이빗 서브넷 안에 생성한다", "NAT 게이트웨이에 탄력적 IP 주소를 연결한다", "NAT 게이트웨이를 퍼블릭 서브넷에 생성한다", "NAT 게이트웨이가 있으면 VPC에 인터넷 게이트웨이는 필요 없다"], "answer": [2, 3], "explain": "프라이빗 인스턴스 → (프라이빗 라우팅 테이블 0.0.0.0/0) → 퍼블릭 서브넷의 NAT 게이트웨이(탄력적 IP) → (퍼블릭 라우팅 테이블 0.0.0.0/0) → IGW → 인터넷 순서로 흐릅니다.", "why": ["틀림: NAT 게이트웨이는 내부에서 시작한 연결의 응답만 돌려보냅니다.", "틀림: 프라이빗 서브넷에는 IGW 경로가 없어 NAT가 인터넷에 나갈 수 없습니다.", "맞음: 퍼블릭 NAT 게이트웨이는 탄력적 IP를 사용해 외부와 통신합니다.", "맞음: NAT 게이트웨이 자신은 IGW를 통해 인터넷에 나가야 하므로 퍼블릭 서브넷에 둡니다.", "틀림: 퍼블릭 NAT 게이트웨이도 결국 IGW를 통해 인터넷에 나갑니다."], "tags": ["NAT 게이트웨이", "탄력적 IP", "퍼블릭 서브넷"]}, {"id": "m7-017", "module": 7, "level": "basic", "pick": 1, "q": "인터페이스 VPC 엔드포인트에 대한 설명으로 옳은 것은?", "options": ["서브넷에 프라이빗 IP를 가진 탄력적 네트워크 인터페이스(ENI)를 만들고, AWS PrivateLink로 서비스에 비공개로 연결한다", "라우팅 테이블에 경로를 추가하는 방식이며 S3와 DynamoDB만 지원한다", "트래픽을 인터넷 게이트웨이를 통해 퍼블릭 인터넷으로 보낸다", "트래픽을 타사 방화벽 같은 보안 어플라이언스로 보내 검사한다"], "answer": [0], "explain": "VPC 엔드포인트는 세 종류입니다. 인터페이스 엔드포인트(ENI + PrivateLink, 많은 서비스 지원, 시간당 요금), 게이트웨이 엔드포인트(라우팅 테이블, S3·DynamoDB, 무료), 게이트웨이 로드 밸런서 엔드포인트(보안 어플라이언스로 전달)입니다.", "why": ["맞음: 인터페이스 엔드포인트는 ENI + PrivateLink 방식입니다.", "틀림: 이것은 게이트웨이 엔드포인트의 설명입니다.", "틀림: 엔드포인트는 인터넷을 거치지 않고 AWS 네트워크 안에서 연결합니다.", "틀림: 이것은 게이트웨이 로드 밸런서 엔드포인트의 용도입니다."], "tags": ["VPC 엔드포인트", "인터페이스 엔드포인트", "PrivateLink"]}, {"id": "m7-018", "module": 7, "level": "basic", "pick": 1, "q": "VPC 흐름 로그로 확인할 수 없는 정보는?", "options": ["소스·대상 포트 번호와 프로토콜", "소스 IP 주소와 대상 IP 주소", "HTTP 요청 본문 같은 패킷의 실제 내용(페이로드)", "트래픽이 허용되었는지 거부되었는지(ACCEPT/REJECT)"], "answer": [2], "explain": "흐름 로그는 '누가, 어디로, 어떤 포트로, 얼마나, 허용/거부' 같은 메타데이터를 기록합니다. 패킷 내용 자체를 검사하려면 트래픽 미러링 같은 다른 도구가 필요합니다.", "why": ["틀림: srcport, dstport, protocol 필드로 확인할 수 있습니다.", "틀림: srcaddr, dstaddr 필드로 확인할 수 있습니다.", "맞음: 흐름 로그는 트래픽의 메타데이터만 기록하며 패킷 내용은 담지 않습니다.", "틀림: action 필드로 확인할 수 있습니다."], "tags": ["VPC 흐름 로그", "모니터링"]}, {"id": "m7-019", "module": 7, "level": "basic", "pick": 1, "q": "서브넷의 네트워크 ACL 인바운드 규칙이 다음과 같다. 100번: TCP 443, 소스 0.0.0.0/0, 허용 / 200번: TCP 443, 소스 203.0.113.5/32, 거부 / *: 모든 트래픽, 거부. IP 203.0.113.5에서 들어오는 HTTPS(443) 요청을 이 네트워크 ACL은 어떻게 처리하는가?", "options": ["네트워크 ACL은 판단하지 않고 보안 그룹 규칙만으로 결정된다", "거부한다. 더 구체적인 /32 CIDR 규칙이 우선 적용된다", "거부한다. 거부 규칙은 허용 규칙보다 항상 우선한다", "허용한다. 번호가 낮은 100번 규칙에 먼저 일치하므로 이후 규칙은 평가하지 않는다"], "answer": [3], "explain": "특정 IP를 막으려면 거부 규칙의 번호를 허용 규칙보다 낮게(예: 90번) 두어야 합니다. NACL은 번호 순서 → 처음 일치 → 즉시 적용입니다.", "why": ["틀림: NACL도 서브넷 경계에서 독립적으로 평가됩니다.", "틀림: 가장 구체적인 주소 우선은 라우팅 테이블의 방식이지 NACL의 방식이 아닙니다.", "틀림: NACL에서는 거부 우선이 아니라 번호 순서가 결정합니다.", "맞음: NACL은 낮은 번호부터 평가해 처음 일치한 규칙을 적용합니다."], "tags": ["네트워크 ACL", "규칙 평가 순서"]}, {"id": "m7-020", "module": 7, "level": "basic", "pick": 1, "q": "인터넷에서 퍼블릭 서브넷의 EC2 인스턴스로 들어오는 트래픽이 거치는 계층의 순서로 옳은 것은?", "options": ["NAT 게이트웨이 → 인터넷 게이트웨이 → 보안 그룹 → EC2 인스턴스", "인터넷 게이트웨이 → 보안 그룹 → 네트워크 ACL → 라우팅 테이블 → EC2 인스턴스", "라우팅 테이블 → 보안 그룹 → 인터넷 게이트웨이 → 네트워크 ACL → EC2 인스턴스", "인터넷 게이트웨이 → 라우팅 테이블 → 네트워크 ACL(서브넷) → 보안 그룹 → EC2 인스턴스"], "answer": [3], "explain": "서브넷 경계에서는 네트워크 ACL이, 인스턴스 앞에서는 보안 그룹이 검사합니다. 두 계층을 함께 쓰면 하나를 잘못 설정해도 다른 하나가 보호하는 심층 방어가 됩니다.", "why": ["틀림: 인바운드 인터넷 트래픽은 NAT 게이트웨이를 거쳐 들어오지 않습니다.", "틀림: 보안 그룹은 인스턴스 바로 앞, NACL은 서브넷 경계에서 적용됩니다.", "틀림: IGW가 VPC의 입구이므로 가장 먼저입니다.", "맞음: 교재의 보안 방어 계층 그림과 같은 순서입니다."], "tags": ["보안 그룹", "네트워크 ACL", "심층 방어"]}, {"id": "m7-021", "module": 7, "level": "basic", "pick": 3, "q": "VPC 흐름 로그를 생성할 수 있는 수준(대상 리소스)을 모두 고르시오.", "options": ["네트워크 인터페이스(ENI)", "서브넷", "AWS 리전 전체", "VPC", "보안 그룹"], "answer": [0, 1, 3], "explain": "흐름 로그는 VPC, 서브넷, 네트워크 인터페이스 세 수준에서 만들 수 있습니다. VPC나 서브넷 수준으로 만들면 그 안의 모든 네트워크 인터페이스가 기록됩니다.", "why": ["맞음: 개별 ENI
