"캐시된 복사본을 엣지에서 바로 제공합니다.", "CloudFront 캐싱은 리전 간 복제가 아닙니다."], "tags": ["모범 사례", "캐싱", "CloudFront"]}, {"id": "m2-015", "module": 2, "level": "basic", "pick": 1, "q": "AWS 로컬 영역에 대한 설명으로 옳지 않은 것은 무엇입니까?", "options": ["로컬 영역은 리전의 확장이다.", "로컬 영역은 고객이 자체 데이터 센터에 직접 설치하고 운영하는 AWS 장비다.", "지연 시간에 민감한 애플리케이션을 최종 사용자 가까이에서 실행해 한 자릿수 밀리초 수준의 지연 시간을 낼 수 있다.", "로컬 영역에서 Amazon EC2, Amazon EBS 등 일부 서비스를 실행할 수 있다.", "로컬 영역은 AWS에서 관리하고 지원한다."], "answer": [1], "explain": "로컬 영역은 리전이 없는 대도시·산업 중심지 가까이에 AWS 컴퓨팅·스토리지 등 일부 서비스를 배치한 리전의 확장입니다. AWS가 관리·지원하며, 실시간 게임·미디어 제작처럼 지연 시간에 민감한 워크로드에 사용합니다.", "why": ["옳은 설명입니다. 각 로컬 영역은 리전의 확장입니다.", "틀린 설명입니다. 로컬 영역은 AWS가 관리하는 인프라입니다.", "옳은 설명입니다(교재: 10밀리초 미만).", "옳은 설명입니다.", "옳은 설명입니다."], "tags": ["글로벌 인프라", "로컬 영역"]}, {"id": "m2-016", "module": 2, "level": "basic", "pick": 1, "q": "오리진 서버와 엣지 로케이션 사이에 위치하며, 엣지 로케이션에 유지할 만큼 자주 액세스되지 않는 콘텐츠를 캐시하는 AWS 인프라 구성 요소는 무엇입니까?", "options": ["가용 영역", "리전 엣지 캐시", "데이터 센터", "로컬 영역"], "answer": [1], "explain": "리전 엣지 캐시는 오리진과 엣지 로케이션 사이에 있는 더 큰 캐시로, CloudFront에서 기본으로 사용됩니다. 엣지 로케이션에서 밀려난 덜 인기 있는 콘텐츠도 사용자 가까이에서 제공해 오리진 요청을 줄입니다.", "why": ["가용 영역은 리전 안의 격리된 위치로, 캐시 계층이 아닙니다.", "엣지 로케이션과 오리진 사이에서 더 큰 캐시를 제공합니다.", "데이터 센터는 서버가 실제로 운영되는 시설로, 이 질문의 캐시 계층을 가리키지 않습니다.", "로컬 영역은 지연 시간에 민감한 워크로드를 실행하기 위한 리전의 확장입니다."], "tags": ["글로벌 인프라", "POP", "엣지 로케이션"]}, {"id": "m2-017", "module": 2, "level": "basic", "pick": 1, "q": "한 회사가 2019년 3월 20일 이후 도입된 리전(예: 아시아 태평양(홍콩))에 리소스를 배포하려고 합니다. 이 리전을 사용하려면 먼저 무엇을 해야 합니까?", "options": ["해당 국가에서 새 AWS 계정을 만든다.", "해당 리전에는 고객 리소스를 배포할 수 없다.", "AWS Support에 데이터 센터 주소를 요청한다.", "AWS Management Console 등에서 계정에 해당 리전을 사용하도록 설정(활성화)한다."], "answer": [3], "explain": "2019년 3월 20일 이전에 도입된 리전은 기본으로 사용할 수 있지만, 그 이후 도입된 리전은 기본적으로 사용이 중지되어 있습니다. 콘솔 등에서 리전을 사용 설정하면 이용할 수 있습니다.", "why": ["계정을 새로 만들 필요는 없습니다.", "사용 설정을 하면 배포할 수 있습니다.", "고객은 데이터 센터를 지정하지 않습니다.", "이후 도입된 리전은 기본적으로 사용이 중지되어 있어 먼저 활성화해야 합니다."], "tags": ["글로벌 인프라", "리전"]}, {"id": "m2-018", "module": 2, "level": "basic", "pick": 2, "q": "AWS 엣지 로케이션(POP)을 활용하는 AWS 서비스를 고르시오.", "options": ["Amazon EBS", "Amazon Route 53", "Amazon RDS", "Amazon EC2 Auto Scaling", "Amazon CloudFront"], "answer": [1, 4], "explain": "교재는 엣지 로케이션이 Amazon Route 53, AWS Global Accelerator, Amazon CloudFront 같은 서비스를 지원한다고 설명합니다. 이 서비스들은 사용자 가까이에서 요청을 처리해 지연 시간을 줄입니다.", "why": ["EBS는 가용 영역 안에서 EC2에 연결되는 블록 스토리지입니다.", "DNS 서비스로, 엣지 로케이션에서 제공됩니다.", "RDS는 리전·가용 영역에서 실행되는 관리형 데이터베이스입니다.", "Auto Scaling은 리전 안에서 EC2 인스턴스 수를 조정합니다.", "엣지 로케이션에서 콘텐츠를 캐시해 전달합니다."], "tags": ["글로벌 인프라", "엣지 로케이션"]}, {"id": "m2-019", "module": 2, "level": "saa", "pick": 1, "q": "한 온라인 쇼핑몰은 매주 금요일 저녁 할인 이벤트 때 접속자가 평소의 5배로 늘어납니다. 현재는 운영자가 CPU 사용률을 지켜보다가 EC2 인스턴스를 수동으로 추가하는데, 새 인스턴스가 준비되는 몇 분 동안 사용자가 오류를 겪습니다. 이벤트가 끝나도 추가한 인스턴스는 그대로 실행됩니다. 운영 오버헤드를 최소화하면서 이 문제를 해결하는 방법은 무엇입니까?", "options": ["다른 리전에 웹 서버를 한 대 더 만들고 이벤트 때 DNS를 수동으로 바꾼다.", "최대 트래픽을 기준으로 큰 인스턴스를 항상 여러 대 실행해 둔다.", "CPU 경보가 울리면 운영자에게 이메일을 보내 더 빨리 수동으로 인스턴스를 시작하게 한다.", "Amazon CloudWatch 경보(예: 5분 이상 CPU 사용률 60% 초과)를 기준으로 EC2 Auto Scaling이 인스턴스를 자동으로 추가·제거하게 하고, Elastic Load Balancing으로 트래픽을 분산한다.", "인스턴스를 더 큰 유형으로 바꾸고(수직 확장) 매주 재부팅한다."], "answer": [3], "explain": "확장성은 수요 증가에 맞춰 용량을 늘리는 것이고, 탄력성은 수요가 줄면 다시 줄이는 것입니다. CloudWatch로 임계값을 감지하고 EC2 Auto Scaling이 자동으로 인스턴스를 조정하면 사람의 개입 없이 둘 다 달성할 수 있습니다.", "why": ["수동 작업이며 수요에 맞춘 자동 조정이 아닙니다.", "평소에는 유휴 리소스 비용이 낭비되어 비용 최적화에 어긋납니다.", "여전히 수동이라 대응 지연과 운영 부담이 남습니다.", "최대 용량에 도달하기 전에 자동으로 확장하고 수요가 줄면 축소하므로 확장성과 탄력성을 모두 충족합니다.", "용량 한계와 단일 서버 의존이 남고, 이벤트가 없을 때도 비용이 듭니다."], "tags": ["모범 사례", "확장성", "Auto Scaling", "CloudWatch"]}, {"id": "m2-020", "module": 2, "level": "saa", "pick": 2, "q": "웹 서버 3대가 애플리케이션 서버 3대에 IP 주소로 직접 연결된 구조입니다. 애플리케이션 서버 1대가 중단되면 그 서버로 요청을 보내던 웹 서버에서 오류가 나고, 애플리케이션 서버를 추가할 때마다 모든 웹 서버의 설정을 바꿔야 합니다. 또한 주문 처리 작업은 즉시 응답할 필요가 없습니다. 이 아키텍처를 개선하는 방법을 고르시오.", "options": ["각 웹 서버에 모든 애플리케이션 서버의 IP 목록을 넣고, 실패하면 다음 IP로 직접 재시도하게 한다.", "웹 계층과 애플리케이션 계층 사이에 Elastic Load Balancing을 두어 정상 상태인 애플리케이션 서버로만 요청을 분산한다.", "주문 처리 요청은 Amazon SQS 대기열에 넣고, 애플리케이션 서버가 대기열에서 메시지를 가져가 비동기로 처리하게 한다.", "애플리케이션 서버 3대를 더 큰 인스턴스 1대로 통합한다.", "모든 서버를 같은 가용 영역에 배치해 통신 지연을 줄인다."], "answer": [1, 2], "explain": "강하게 결합된 구조에서는 한 구성 요소의 장애가 다른 계층에 바로 전파됩니다. 로드 밸런서(동기 요청)와 메시지 대기열(비동기 작업)을 중개자로 두면 계층이 독립적으로 확장되고 장애 영향이 줄어듭니다.", "why": ["여전히 강하게 결합된 구조이며 서버 변경 시 설정 수정이 필요합니다.", "로드 밸런서가 중개자가 되어 장애 서버를 피하고, 서버 추가·제거도 자동으로 반영합니다.", "메시지 대기열로 계층을 분리하면 처리 서버가 잠시 중단되어도 요청이 유실되지 않습니다.", "단일 실패 지점이 생겨 가용성이 더 나빠집니다.", "결합도 문제를 해결하지 못하고 가용 영역 장애에도 취약해집니다."], "tags": ["모범 사례", "느슨한 결합", "ELB", "SQS"]}, {"id": "m2-021", "module": 2, "level": "saa", "pick": 1, "q": "애플리케이션 서버 2대가 데이터베이스 서버 1대에 연결되어 있습니다. 최근 데이터베이스 서버의 하드웨어 장애로 서비스 전체가 몇 시간 동안 중단되었습니다. 데이터베이스 계층의 단일 실패 지점을 제거하기 위한 가장 적절한 설계는 무엇입니까?", "options": ["같은 가용 영역에서 데이터베이스 서버를 더 큰 인스턴스로 교체한다.", "매일 밤 데이터베이스를 백업해 둔다.", "애플리케이션 서버를 4대로 늘린다.", "다른 가용 영역에 보조(대기) 데이터베이스 서버를 두고 데이터를 복제하여, 기본 서버 장애 시 보조 서버가 요청을 처리하게 한다."], "answer": [3], "explain": "단일 실패 지점 제거는 '모든 구성 요소에서 장애가 발생한다고 가정하고 역방향으로 설계'하는 모범 사례입니다. 대기 DB 서버로 데이터를 복제하면 기본 서버 장애 시에도 서비스를 계속할 수 있습니다(모듈 6의 RDS 다중 AZ 배포가 이 방식입니다).", "why": ["여전히 서버가 1대뿐이라 단일 실패 지점이 남습니다.", "백업은 데이터 복구에 필요하지만, 장애 시 복원하는 동안 서비스가 중단되므로 단일 실패 지점은 그대로입니다.", "데이터베이스가 1대뿐이면 애플리케이션 서버를 늘려도 DB 장애 시 모두 중단됩니다.", "기본 서버가 오프라인이 되어도 보조 서버가 부하를 처리할 수 있습니다."], "tags": ["모범 사례", "단일 실패 지점", "신뢰성"]}, {"id": "m2-023", "module": 2, "level": "saa", "pick": 1, "q": "국내 금융 회사가 고객 거래 데이터를 처리하는 시스템을 AWS로 이전합니다. 규정상 고객 데이터는 국내에만 저장해야 하며, 데이터 센터 하나가 정전되더라도 서비스가 계속되어야 합니다. 두 요구 사항을 모두 충족하는 배포 방식은 무엇입니까?", "options": ["고객 데이터를 엣지 로케이션에 저장해 사용자와 가깝게 둔다.", "서울 리전의 한 가용 영역에 더 큰 인스턴스를 배포한다.", "서울 리전을 선택하고, 해당 리전의 여러 가용 영역에 애플리케이션과 데이터베이스를 분산 배포한다.", "서울 리전의 단일 가용 영역에 배포하고, 재해 대비를 위해 도쿄 리전으로 데이터를 복제한다.", "지연 시간이 가장 낮은 해외 리전에 배포하고 Amazon CloudFront로 캐시한다."], "answer": [2], "explain": "리전은 규정 준수(데이터 거주) 기준으로 고르고, 고가용성은 같은 리전 안의 여러 가용 영역으로 확보합니다. 데이터는 고객이 직접 복제하지 않는 한 선택한 리전 밖으로 나가지 않습니다.", "why": ["엣지 로케이션은 캐시용이며 주 데이터 저장소가 아닙니다.", "가용 영역 장애 시 서비스가 중단됩니다.", "데이터는 국내 리전에 머물고, 가용 영역 하나가 중단되어도 다른 가용 영역에서 서비스가 계속됩니다.", "데이터가 국외 리전으로 복제되어 데이터 거주 규정을 위반합니다.", "데이터가 국외에 저장되어 규정을 위반합니다."], "tags": ["글로벌 인프라", "리전", "가용 영역", "규정 준수"]}, {"id": "m2-024", "module": 2, "level": "saa", "pick": 1, "q": "한 게임 회사는 AWS 리전이 없는 대도시의 사용자에게 10밀리초 미만의 지연 시간으로 실시간 게임 서버를 제공해야 합니다. 게임 서버는 Amazon EC2에서 실행되고, 나머지 백엔드는 가장 가까운 리전에 있습니다. 가장 적합한 방법은 무엇입니까?", "options": ["해당 도시 근처의 AWS 로컬 영역에 게임 서버용 EC2 인스턴스를 배포한다.", "Amazon CloudFront 엣지 로케이션에 EC2 인스턴스를 직접 배포한다.", "가장 가까운 리전의 가용 영역 3개에 모두 인스턴스를 배포한다.", "해당 도시에 직접 데이터 센터를 지어 새 AWS 리전으로 등록한다."], "answer": [0], "explain": "로컬 영역은 리전이 없는 대규모 인구 중심지 가까이에 EC2, EBS, VPC 등을 배치해 10밀리초 미만의 지연 시간을 낼 수 있게 해 줍니다. 로컬 영역의 워크로드는 상위 리전의 서비스와 안전하게 연결됩니다.", "why": ["로컬 영역은 지연 시간에 민감한 워크로드를 사용자 가까이에서 실행하도록 만든 리전의 확장입니다.", "엣지 로케이션에는 고객이 EC2 인스턴스를 배포할 수 없습니다.", "가용성은 높아지지만 사용자와의 물리적 거리는 줄지 않습니다.", "고객이 AWS 리전을 만들 수는 없습니다."], "tags": ["글로벌 인프라", "로컬 영역"]}, {"id": "m2-026", "module": 2, "level": "saa", "pick": 2, "q": "한 회사의 개발 팀은 평일 09시~18시에만 개발용 EC2 인스턴스 20대를 사용하지만, 인스턴스는 24시간 내내 실행 중입니다. CloudWatch 지표를 보면 대부분의 인스턴스는 CPU 사용률이 항상 10% 미만입니다. 성능 요구를 해치지 않으면서 비용을 줄이는 방법을 고르시오.", "options": ["온프레미스 서버를 구매해 고정 비용으로 전환한다.", "장애에 대비해 개발 인스턴스를 다른 리전에도 복제해 둔다.", "사용률 지표를 근거로 인스턴스를 더 작은 유형으로 적정 크기 조정(라이트사이징)한다.", "업무 시간 외와 주말에는 개발용 인스턴스를 자동으로 중지한다.", "향후 성장에 대비해 더 큰 인스턴스 유형으로 미리 변경한다."], "answer": [2, 3], "explain": "비용 최적화 모범 사례는 '적합한 크기와 유형인가', '사용하지 않는 리소스를 어떻게 비활성화할까'를 묻는 것입니다. 사용 시간에만 실행하고, 측정된 사용률에 맞게 크기를 줄이면 성능은 유지하면서 비용이 줄어듭니다.", "why": ["가변 비용 모델의 이점을 포기하는 것입니다.", "개발 환경에 불필요한 비용이 추가됩니다.", "'내 리소스가 작업에 적합한 크기인가?'를 지표로 확인해 조정하는 것입니다.", "사용하지 않는 리소스를 중지하는 것이 비용 최적화의 기본입니다.", "사용률이 낮은데 크기를 키우면 낭비가 더 커집니다."], "tags": ["모범 사례", "비용 최적화"]}, {"id": "m2-027", "module": 2, "level": "saa", "pick": 2, "q": "한 웹 애플리케이션은 이미지·CSS 같은 정적 파일과 사용자 로그인 세션을 각 EC2 웹 서버의 로컬 디스크에 저장합니다. 그래서 Auto Scaling으로 서버가 추가·제거될 때 일부 이미지가 보이지 않거나 사용자가 갑자기 로그아웃됩니다. '서버가 아닌 서비스 설계' 모범 사례에 따라 개선하는 방법을 고르시오.", "options": ["사용자를 처음 접속한 서버에만 계속 연결되도록 고정한다.", "사용자 세션 상태를 Amazon DynamoDB 같은 관리형 서비스에 저장해 웹 서버를 상태 비저장(stateless)으로 만든다.", "정적 웹 자산을 Amazon S3에 저장하고 웹 서버는 이를 참조하게 한다.", "Auto Scaling을 끄고 웹 서버 수를 고정한다.", "각 웹 서버의 EBS 볼륨 크기를 늘린다."], "answer": [1, 2], "explain": "서버가 아닌 서비스 설계란 모든 것을 EC2에 넣지 말고, 정적 자산은 S3, 사용자 상태는 관리형 서비스, 계층 간 통신은 대기열 등 적합한 서비스를 쓰라는 뜻입니다. 웹 서버가 상태를 갖지 않아야 자유롭게 확장·축소할 수 있습니다.", "why": ["그 서버가 축소(제거)되면 세션은 여전히 사라지고, 이미지 누락도 해결되지 않습니다.", "사용자 상태를 관리형 서비스로 옮기면 어떤 서버가 추가·제거되어도 세션이 유지됩니다.", "교재 예시처럼 정적 자산은 서버 외부의 S3에 저장합니다.", "문제를 숨길 뿐 확장성을 포기하는 것입니다.", "데이터가 여전히 개별 서버에 묶여 있어 문제가 해결되지 않습니다."], "tags": ["모범 사례", "서버가 아닌 서비스", "S3"]}, {"id": "m2-028", "module": 2, "level": "saa", "pick": 1, "q": "운영 중인 웹 서버 10대에 매달 OS 보안 패치를 적용합니다. 운영자가 서버에 하나씩 접속해 패치하다 보니 서버마다 구성이 조금씩 달라지고, 패치가 실패하면 복구도 어렵습니다. '리소스를 일회용으로 취급' 모범 사례에 가장 부합하는 방법은 무엇입니까?", "options": ["서버를 더 큰 인스턴스 1대로 통합해 패치 대상을 줄인다.", "보안 패치를 중단하고 보안 그룹 규칙만 강화한다.", "패치 작업을 경험이 많은 운영자 한 명에게만 맡긴다.", "패치를 적용한 새 이미지로 동일한 구성의 새 인스턴스를 자동 배포해 테스트한 뒤, 기존 인스턴스를 새 인스턴스로 교체한다."], "answer": [3], "explain": "리소스를 일회용으로 취급한다는 것은 서버를 고쳐 쓰는 하드웨어가 아니라 언제든 새로 만들 수 있는 소프트웨어로 보는 것입니다. 동일한 구성으로 새 리소스 배포를 자동화하고, 테스트 후 이전 리소스를 대체합니다.", "why": ["단일 실패 지점이 생깁니다.", "OS 취약점이 그대로 남습니다.", "여전히 수동 작업이며 구성 차이 문제가 남습니다.", "새 리소스를 테스트한 후 이전 리소스를 대체하는 방식이 '일회용 리소스' 사례입니다."], "tags": ["모범 사례", "일회용 리소스"]}, {"id": "m2-030", "module": 2, "level": "saa", "pick": 3, "q": "한 회사가 새 웹 애플리케이션을 AWS에 배포하려 합니다. 요구 사항은 (1) 가용 영역 하나가 중단되어도 서비스 지속, (2) 트래픽 변화에 자동 대응, (3) 서버 한 대의 장애가 사용자에게 드러나지 않을 것입니다. 요구 사항을 충족하기 위해 함께 적용해야 할 구성을 고르시오.", "options": ["통신 성능을 위해 모든 인스턴스를 하나의 가용 영역에 배치한다.", "EC2 인스턴스를 2개 이상의 가용 영역에 분산 배치한다.", "Elastic Load Balancing으로 정상 인스턴스에만 트래픽을 분산한다.", "클라이언트에 각 서버의 IP 주소를 직접 알려 준다.", "가장 큰 인스턴스 1대로 모든 트래픽을 처리한다.", "EC2 Auto Scaling으로 수요에 따라 인스턴스 수를 조정한다."], "answer": [1, 2, 5], "explain": "고가용성 웹 아키텍처의 기본 조합은 '다중 가용 영역 + Auto Scaling + 로드 밸런서'입니다. 각각 장애 격리, 자동 확장, 느슨한 결합(정상 인스턴스로의 분산)을 담당합니다.", "why": ["(1)을 충족하지 못합니다.", "(1) 가용 영역 장애 대응을 충족합니다.", "(3) 장애 서버를 피해 요청을 보내므로 사용자에게 장애가 드러나지 않습니다.", "서버 장애가 사용자에게 그대로 드러나고 강한 결합이 생깁니다.", "단일 실패 지점이 되어 (1)(3)을 충족하지 못합니다.", "(2) 트래픽 변화에 자동 대응합니다."], "tags": ["모범 사례", "가용 영역", "Auto Scaling", "ELB"]}, {"id": "m2-032", "module": 2, "level": "saa", "pick": 1, "q": "한 애플리케이션 서버가 메모리 누수로 가끔 응답하지 않게 됩니다. 지금은 야간 당직 운영자가 장애를 확인하고 서버를 수동으로 새로 시작하고 구성하는데, 복구에 30분 이상 걸립니다. 운영 오버헤드를 최소화하면서 복구 시간을 줄이는 방법은 무엇입니까?", "options": ["당직 운영자를 2명으로 늘린다.", "Amazon CloudWatch로 비정상 인스턴스를 자동 감지하고, EC2 Auto Scaling이 동일한 구성의 새 서버를 자동으로 시작하게 하며, 관리자에게 알림을 보낸다.", "매일 새벽 모든 서버를 정해진 시간에 재부팅하는 작업을 수동으로 실행한다.", "서버를 더 큰 인스턴스로 변경해 메모리 부족이 늦게 발생하게 한다.", "장애 발생 시 사용자가 고객센터에 신고하도록 안내한다."], "answer": [1], "explain": "내장 모니터링·자동화 도구가 없으면 장애를 수동으로 감지하고 대응해야 합니다. CloudWatch와 EC2 Auto Scaling을 함께 쓰면 비정상 리소스를 감지해 자동으로 대체하고, 변경 사항과 알림도 자동으로 남길 수 있습니다.", "why": ["여전히 수동이라 복구 지연이 남고 인건비가 늘어납니다.", "교재의 '환경 자동화' 예시 그대로입니다. 감지·대체·알림이 자동으로 이루어집니다.", "수동 작업이며 그 사이에 발생한 장애에는 대응하지 못합니다.", "근본적인 자동 복구가 아니며 장애는 결국 다시 발생합니다.", "장애 감지를 사용자에게 의존하는 것은 운영 우수성에 어긋납니다."], "tags": ["모범 사례", "환경 자동화", "CloudWatch", "Auto Scaling"]}, {"id": "m2-033", "module": 2, "level": "saa", "pick": 1, "q": "한 회사는 모든 데이터를 오랫동안 써 온 관계형 데이터베이스 하나에 저장합니다. 그중 장바구니 데이터는 복잡한 조인 없이 사용자 ID로 단순 조회·저장만 하지만, 이벤트 때 초당 수만 건의 요청이 몰려 데이터베이스 전체가 느려집니다. '적절한 데이터베이스 솔루션 선택' 모범 사례에 가장 부합하는 접근 방식은 무엇입니까?", "options": ["장바구니 데이터는 접근 패턴(키 기반 단순 조회, 높은 동시 요청)에 맞는 키-값 데이터베이스(예: Amazon DynamoDB)로 분리한다.", "데이터베이스 서버를 같은 가용 영역의 더 큰 인스턴스로 교체하는 것만으로 해결한다.", "익숙한 기술이므로 모든 데이터를 기존 관계형 데이터베이스에 계속 저장하고 사용자에게 대기하도록 안내한다.", "장바구니 데이터를 각 웹 서버의 로컬 디스크 파일에 저장한다."], "answer": [0], "explain": "교재는 '워크로드를 기술 수준에 맞추는 것이 아니라 기술 수준을 워크로드에 맞추라'고 합니다. 읽기/쓰기 요구, 지연 시간, 최대 동시 사용자 수, 쿼리 특성 등을 기준으로 데이터 스토어를 선택합니다(자세한 DB 종류는 모듈 6).", "why": ["워크로드를 기술에 맞추지 않고, 기술을 워크로드의 읽기/쓰기·지연 시간·동시 사용자 요구에 맞추는 것입니다.", "일시적으로 완화될 뿐, 접근 패턴에 맞는 저장소를 고르는 원칙과는 거리가 있습니다.", "워크로드를 기술 수준에 맞추는 안티 패턴입니다.", "서버가 교체되면 데이터가 사라지고, 서버 간 데이터가 공유되지 않습니다."], "tags": ["모범 사례", "데이터베이스 선택"]}, {"id": "m2-034", "module": 2, "level": "saa", "pick": 2, "q": "독일·프랑스 고객이 대부분인 한 회사는 개인정보를 EU 안에만 저장해야 합니다. 한편 일부 아시아 고객에게도 공개 제품 이미지를 빠르게 제공하고 싶습니다. 요구 사항을 충족하는 조치를 고르시오.", "options": ["아시아 사용자를 위해 고객 데이터베이스를 아시아 리전에 복제한다.", "고객 데이터를 엣지 로케이션에만 저장한다.", "모든 리소스를 아시아와 유럽의 중간 지점에 가까운 리전 하나에 배포한다.", "공개 제품 이미지는 Amazon CloudFront로 배포해 전 세계 엣지 로케이션에서 캐시되게 한다.", "애플리케이션과 고객 데이터베이스를 EU 리전(예: 유럽(프랑크푸르트))에 배포한다."], "answer": [3, 4], "explain": "리전은 규정 준수와 주 사용자와의 거리로 고르고, 멀리 있는 사용자에게는 CloudFront 엣지 캐시로 정적 콘텐츠 성능을 보완합니다. 규제 대상 데이터와 공개 콘텐츠를 구분해 판단하는 것이 핵심입니다.", "why": ["개인정보가 EU 밖으로 나가 규정을 위반합니다.", "엣지 로케이션은 캐시 계층이며 데이터의 주 저장소가 아닙니다.", "EU 데이터 거주 요구를 충족하지 못할 수 있고 주 사용자의 지연 시간도 늘어납니다.", "개인정보가 아닌 공개 정적 콘텐츠를 아시아 사용자 가까이에서 빠르게 제공합니다.", "개인정보의 데이터 거주 요구와 주 사용자와의 지연 시간을 모두 충족합니다."], "tags": ["글로벌 인프라", "리전", "CloudFront", "규정 준수"]}, {"id": "m2-101", "module": 2, "level": "basic", "pick": 1, "q": "한 웹 서비스는 트래픽이 늘면 CloudWatch 경보에 따라 서버를 자동으로 추가하도록 설정했지만, 서버를 줄이는 정책은 만들지 않았습니다. 그래서 행사가 끝나 사용자가 줄어도 늘어난 서버가 그대로 실행됩니다. 이 서비스에 부족한 특성은 무엇입니까?", "options": ["확장성", "내구성", "일관성", "탄력성"], "answer": [3], "explain": "확장성은 수요가 늘 때 용량을 늘리는 능력이고, 탄력성은 수요가 줄면 용량을 다시 줄여 필요한 만큼만 쓰는 능력입니다. 이 서비스는 서버를 늘리기만 하고 줄이지 않으므로 탄력성이 부족하고, 그만큼 유휴 비용이 발생합니다.", "why": ["수요가 늘 때 서버를 추가하고 있으므로 확장성은 갖추고 있습니다.", "내구성은 데이터를 잃지 않는 능력으로, 서버 수 조정과는 관계가 없습니다.", "일관성은 데이터가 여러 곳에서 같은 값으로 보이는지에 관한 특성입니다.", "수요 감소에 맞춰 용량을 줄이지 않으므로 탄력성이 부족합니다."], "tags": ["모범 사례", "확장성", "탄력성"]}, {"id": "m2-102", "module": 2, "level": "saa", "pick": 1, "q": "한 쇼핑몰 팀이 상품 조회 API 앞에 캐시 계층을 추가할지 논의하고 있습니다. 캐시를 쓰면 응답은 빨라지지만, 바뀐 가격이 몇 초 늦게 보일 수 있고 운영 비용과 구성 복잡성도 늘어납니다. 교재가 제시한 '설계 절충(trade-off)' 관점에서 가장 적절한 결정 방법은 무엇입니까?", "options": ["부하 테스트와 운영 지표로 지연 시간 개선 효과, 데이터 최신성에 미치는 영향, 추가 비용을 측정해 요구 사항과 비교한 뒤 결정한다.", "비용이 늘어나는 선택은 항상 피하고 현재 구성을 유지한다.", "캐시는 항상 성능을 높이므로 측정 없이 모든 계층에 도입한다.", "팀에서 경험이 가장 많은 사람의 직감으로 결정하고, 이후에는 다시 검토하지 않는다."], "answer": [0], "explain": "캐시·복제처럼 성능을 높이는 선택은 일관성(최신성), 비용, 복잡성과 맞바꾸는 경우가 많습니다. 교재는 이런 절충을 감이 아니라 실증 데이터(측정 결과)로 결정하라고 강조합니다. 얻는 이득과 잃는 것을 측정해 요구 사항에 비추어 판단합니다.", "why": ["측정한 데이터로 이득(지연 시간)과 대가(최신성·운영비)를 비교해 결정하는 것이 교재의 접근입니다.", "요구 성능을 달성하는 데 비용 증가가 필요할 수도 있으므로, 비용만 보고 거부하는 것도 절충을 판단하지 않은 것입니다.", "캐시는 데이터 최신성과 비용·복잡성을 대가로 하므로 무조건 도입할 대상이 아닙니다.", "직감에 의존하고 재검토하지 않는 방식은 데이터 기반 결정과 반대입니다."], "tags": ["모범 사례", "Cloud Architect", "캐싱"]}, {"id": "m2-103", "module": 2, "level": "saa", "pick": 1, "q": "한 회사는 사용자가 S3 버킷에 사진을 올리면 썸네일을 만드는 기능을 운영합니다. 현재는 EC2 인스턴스 2대가 24시간 실행되면서 1분마다 버킷에 새 파일이 있는지 확인하는데, 업로드는 하루에 수십 건뿐이라 인스턴스는 대부분 유휴 상태입니다. '서버가 아닌 서비스 설계' 모범 사례에 가장 부합하는 개선 방법은 무엇입니까?", "options": ["EC2 인스턴스를 더 큰 유형으로 바꾸고 확인 주기를 10초로 줄인다.", "EC2 인스턴스를 4대로 늘리고 Elastic Load Balancing 뒤에 둔다.", "S3에 새 객체가 생성되는 이벤트로 AWS Lambda 함수를 호출해 썸네일을 만들게 하고, 상시 실행되는 EC2 인스턴스를 없앤다.", "원본 사진을 EC2 인스턴스의 로컬 디스크에 저장해 처리 속도를 높인다."], "answer": [2], "explain": "EC2가 항상 첫 번째 답은 아닙니다. 가끔 발생하는 이벤트에 반응해 짧게 실행되는 작업은 AWS Lambda처럼 서버를 관리하지 않는 서비스로 처리하면, 유휴 서버 비용과 서버 운영 부담이 사라집니다.", "why": ["유휴 시간이 많은 구조는 그대로이고 비용만 늘어납니다.", "수요가 적은 작업에 서버를 더 늘리는 것은 낭비입니다.", "이벤트가 발생할 때만 코드가 실행되어 유휴 비용과 서버 관리가 없어집니다.", "로컬 디스크는 서버와 함께 사라질 수 있어 내구성이 떨어지고, 유휴 서버 문제도 해결하지 못합니다."], "tags": ["모범 사례", "서버가 아닌 서비스", "Lambda"]}, {"id": "m2-104", "module": 2, "level": "saa", "pick": 1, "q": "한 결제 서비스는 서울 리전의 여러 가용 영역에 배포되어 있습니다. 경영진은 드물더라도 서울 리전 전체에 문제가 생기는 경우까지 대비해, 몇 시간 안에 다른 지역에서 서비스를 재개할 수 있기를 원합니다. 데이터 거주 제한은 없습니다. 요구 사항을 충족하는 설계는 무엇입니까?", "options": ["서울 리전 안에서 가용 영역을 하나 더 추가해 배포한다.", "다른 리전(예: 도쿄)으로 데이터 복제를 직접 구성하고, 그 리전에서 애플리케이션을 다시 시작할 수 있는 복구 환경을 준비한다.", "AWS가 리전의 데이터를 다른 리전에 자동으로 복제하므로 추가 조치는 필요 없다.", "엣지 로케이션에 애플리케이션 서버와 데이터베이스를 배포한다."], "answer": [1], "explain": "다중 AZ는 한 리전 안의 데이터 센터·AZ 장애를 견디는 설계이고, 리전 전체 장애에는 대비하지 못합니다. 리전 장애까지 대비하려면 다른 리전으로의 데이터 복제와 복구 환경을 직접 설계해야 합니다. 리전 간 데이터는 고객이 설정하지 않으면 자동으로 복제되지 않으며, 다중 리전은 비용과 복잡성이 커지므로 이런 요구가 있을 때 선택합니다.", "why": ["같은 리전 안의 가용 영역을 늘려도 리전 전체 장애는 막지 못합니다.", "리전 장애 대비는 다른 리전으로의 복제와 복구 환경을 직접 준비해야 합니다.", "리전에 저장한 데이터는 고객이 복제를 설정하지 않는 한 다른 리전으로 복제되지 않습니다.", "엣지 로케이션은 콘텐츠 캐시·전달용이며 애플리케이션과 데이터베이스를 배포하는 곳이 아닙니다."], "tags": ["글로벌 인프라", "리전", "신뢰성"]}, {"id": "m2-105", "module": 2, "level": "saa", "pick": 3, "q": "한 회사의 3계층 웹 애플리케이션은 인터넷과 맞닿은 경계 방화벽 하나만 두고, 그 안쪽에서는 모든 서버가 서로 모든 포트로 통신할 수 있습니다. 관리자들은 공용 관리자 계정 하나를 MFA 없이 함께 쓰고, 데이터베이스는 암호화되어 있지 않으며 접근 기록도 남기지 않습니다. '전체 인프라 보호' 모범 사례에 맞는 개선 방향을 고르시오.", "options": ["경계 방화벽 규칙을 더 강화하면 내부 계층에는 별도 통제가 필요 없다.", "계층마다 필요한 포트와 출처만 허용하도록 모든 계층에 보안 통제를 적용한다.", "관리자마다 개별 자격 증명을 발급하고 최소 권한과 MFA를 적용한다.", "저장 데이터를 암호화하고 API 호출·접근 로그를 기록해 추적할 수 있게 한다.", "성능을 위해 로그 기록을 끄고 보안 점검 주기를 늘린다.", "모든 서버를 하나의 서브넷에 모아 관리 지점을 줄인다."], "answer": [1, 2, 3], "explain": "교재의 '전체 인프라 보호'는 경계만 방어하지 말고 모든 계층에 보안을 적용하라는 모범 사례입니다. 계층별 접근 통제, 개인별 자격 증명과 최소 권한·MFA, 암호화, 로깅을 함께 적용해 한 겹이 뚫려도 다음 겹이 막도록 설계합니다.", "why": ["경계 하나만 지키면 그 경계가 뚫렸을 때 내부 전체가 노출됩니다.", "모든 계층에 보안을 적용하는 것이 이 모범 사례의 핵심입니다.", "개인별 자격 증명·최소 권한·MFA는 계정 도용과 권한 남용을 줄입니다.", "암호화로 데이터를 보호하고, 로깅으로 누가 무엇을 했는지 추적할 수 있습니다.", "로그가 없으면 보안 사고를 탐지하거나 조사할 수 없습니다.", "계층을 분리하지 않으면 한 서버가 침해될 때 피해가 전체로 번집니다."], "tags": ["모범 사례", "전체 인프라 보호"]}, {"id": "m3-001", "module": 3, "level": "basic", "pick": 2, "q": "AWS 공동 책임 모델에서 AWS가 책임지는 영역('클라우드 자체의 보안')을 고르시오.", "options": ["보안 그룹과 방화벽 규칙 구성", "EC2 인스턴스의 게스트 운영 체제 보안 패치", "데이터 센터의 물리적 보안", "IAM 사용자와 권한 관리", "서비스를 실행하는 호스트 운영 체제와 가상화 계층"], "answer": [2, 4], "explain": "AWS는 '클라우드 자체'의 보안(컴퓨팅·스토리지·DB·네트워킹 기초 서비스와 리전·AZ·엣지 같은 글로벌 인프라)을, 고객은 '클라우드 내부'의 보안(고객 데이터, 자격 증명·액세스 관리, OS·네트워크·방화벽 구성, 암호화)을 책임집니다.", "why": ["네트워크·방화벽 구성은 고객 책임입니다.", "EC2의 게스트 OS는 고객이 관리합니다.", "AWS가 시설의 물리적 보안을 책임집니다.", "자격 증명과 액세스 관리는 고객 책임입니다.", "호스트 OS와 가상화 계층은 AWS가 운영·보호합니다."], "tags": ["지식확인", "공동 책임 모델"]}, {"id": "m3-002", "module": 3, "level": "basic", "pick": 1, "q": "요청자가 인증된 후, 그 요청자가 어떤 리소스에 어떤 작업을 할 수 있는지 허용하거나 거부하는 과정을 무엇이라고 합니까?", "options": ["인증(Authentication)", "페더레이션(Federation)", "암호화(Encryption)", "권한 부여(Authorization)"], "answer": [3], "explain": "인증은 '누구인가'(신원 확인), 권한 부여는 '무엇을 할 수 있는가'(허용/거부 결정)입니다. 교재의 은행 비유처럼, 로그인(인증)했다고 다른 고객의 계좌 돈을 쓸 수 있는(권한) 것은 아닙니다.", "why": ["인증은 자격 증명으로 '누가' 요청하는지 신원을 확인하는 과정입니다.", "외부 자격 증명 시스템의 사용자가 AWS에 접근하도록 연동하는 방식입니다.", "암호화는 데이터를 읽을 수 없게 보호하는 수단입니다.", "인증 이후 요청을 허용할지 거부할지 결정하는 과정입니다."], "tags": ["지식확인", "인증", "권한 부여"]}, {"id": "m3-003", "module": 3, "level": "basic", "pick": 1, "q": "IAM 역할에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["루트 사용자만 역할을 수임할 수 있다.", "IAM 그룹에 멤버로 추가할 수 있다.", "한 사람에게 고유하게 연결되며 장기 암호와 액세스 키를 가진다.", "역할을 수임(assume)한 사용자·애플리케이션·서비스에게 임시 보안 자격 증명을 제공한다."], "answer": [3], "explain": "IAM 역할은 권한 정책을 연결할 수 있는 자격 증명이지만 장기 자격 증명이 없습니다. 사람이나 서비스가 역할을 수임하면 그 세션 동안 사용할 임시 보안 자격 증명이 발급됩니다.", "why": ["IAM 사용자, 애플리케이션, AWS 서비스 등 필요한 주체가 수임할 수 있습니다.", "그룹에는 IAM 사용자만 추가할 수 있습니다.", "IAM 사용자의 특징입니다. 역할에는 장기 자격 증명이 없습니다.", "역할의 핵심 특성입니다."], "tags": ["지식확인", "IAM", "역할"]}, {"id": "m3-004", "module": 3, "level": "basic", "pick": 2, "q": "AWS 계정 루트 사용자를 보호하기 위한 모범 사례를 고르시오.", "options": ["루트 사용자에 MFA(다중 인증)를 설정한다.", "관리 팀원들이 루트 사용자 암호를 함께 공유해 사용한다.", "일상적인 관리 작업은 별도로 만든 관리자 사용자로 수행하고, 루트 사용자는 루트만 할 수 있는 작업에만 사용한다.", "보안을 위해 계정 생성 직후 루트 사용자를 삭제한다.", "자동화 스크립트에서 쓰도록 루트 사용자의 액세스 키를 만들어 둔다."], "answer": [0, 2], "explain": "루트 사용자는 계정의 모든 리소스에 대한 전체 권한을 가지므로 신용카드 번호처럼 보호해야 합니다. MFA를 설정하고, 일상 작업에는 IAM Identity Center 등에서 만든 관리자 사용자를 사용합니다.", "why": ["루트 사용자에게 별도의 보안 계층을 추가합니다.", "자격 증명 공유는 개인 책임 추적을 불가능하게 합니다.", "교재의 루트 사용자 보호 지침입니다.", "루트 사용자는 삭제할 수 없으며, 루트 전용 작업에 필요합니다.", "루트 액세스 키는 만들지 않는 것이 원칙입니다. 유출되면 계정 전체가 위험합니다."], "tags": ["지식확인", "루트 사용자", "MFA"]}, {"id": "m3-005", "module": 3, "level": "basic", "pick": 1, "q": "IAM 사용자가 AWS CLI에서 명령을 실행하거나 SDK로 AWS API를 프로그래밍 방식으로 호출할 때 사용하는 자격 증명은 무엇입니까?", "options": ["사용자 이름과 암호", "MFA 디바이스의 인증 코드만", "액세스 키 ID와 비밀 액세스 키", "AWS 계정 ID와 루트 사용자 이메일 주소"], "answer": [2], "explain": "콘솔 로그인은 사용자 이름과 암호, CLI·SDK·API 호출은 AWS 액세스 키(액세스 키 ID + 비밀 액세스 키)를 사용합니다. 사용자 이름과 암호로는 CLI·API 인증을 할 수 없습니다.", "why": ["AWS Management Console 로그인에 사용합니다.", "MFA 코드는 추가 인증 요소일 뿐 단독 자격 증명이 아닙니다.", "AWS 액세스 키는 액세스 키 ID와 비밀 액세스 키의 조합입니다.", "API 호출 자격 증명이 아닙니다."], "tags": ["지식확인", "IAM", "자격 증명", "액세스 키"]}, {"id": "m3-006", "module": 3, "level": "basic", "pick": 2, "q": "리소스 기반 정책에 대한 설명으로 옳은 것을 고르시오.", "options": ["Amazon S3 버킷 같은 AWS 리소스에 연결된다.", "거부(Deny)만 지정할 수 있고 허용은 할 수 없다.", "IAM 사용자, 그룹, 역할에 연결된다.", "Principal 요소로 접근을 허용하거나 거부할 계정·사용자·역할 등을 지정한다.", "다른 AWS 계정에 대한 접근 권한은 부여할 수 없다."], "answer": [0, 3], "explain": "자격 증명 기반 정책은 '이 주체가 무엇을 할 수 있는가', 리소스 기반 정책은 '누가 이 리소스에 무엇을 할 수 있는가'를 정의합니다. 차이는 연결 위치이며, 리소스 기반 정책에는 Principal 요소가 들어갑니다.", "why": ["리소스 기반 정책은 리소스에 연결됩니다.", "Allow와 Deny를 모두 사용할 수 있습니다.", "자격 증명 기반 정책에 대한 설명입니다.", "'누가' 이 리소스에 접근할 수 있는지를 Principal로 지정합니다.", "교재의 크로스 계정 버킷 정책 예처럼 다른 계정에 권한을 줄 수 있습니다."], "tags": ["지식확인", "IAM 정책", "리소스 기반 정책"]}, {"id": "m3-008", "module": 3, "level": "basic", "pick": 1, "q": "최소 권한의 원칙에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["처음에는 넓은 권한을 부여하고, 문제가 생기면 그때 권한을 줄인다.", "비용을 줄이기 위해 가장 작은 인스턴스 유형만 사용하게 한다.", "작업을 수행하는 데 필요한 권한만 부여하고, 최소한의 권한 세트에서 시작해 필요할 때 추가한다.", "관리 부담을 줄이기 위해 모든 사용자에게 같은 권한을 부여한다."], "answer": [2], "explain": "최소 권한 원칙은 작업에 필요한 권한만 부여하는 것입니다. 너무 관대한 권한으로 시작했다가 나중에 줄이는 것보다, 최소 권한으로 시작해 필요한 만큼 추가하고 불필요한 권한은 회수하는 편이 안전합니다.", "why": ["교재는 반대로 최소 권한에서 시작하라고 권장합니다.", "최소 권한은 권한 범위에 대한 원칙이지 인스턴스 크기와 무관합니다.", "최소 권한 원칙의 정확한 설명입니다.", "업무에 필요 없는 권한까지 주게 되어 원칙에 어긋납니다."], "tags": ["지식확인", "최소 권한"]}, {"id": "m3-009", "module": 3, "level": "basic", "pick": 1, "q": "클라이언트가 데이터를 클라우드로 전송하기 전에 직접 암호화하고, 클라우드 스토리지에서 암호화된 데이터를 가져온 뒤 클라이언트에서 해독해 사용하는 방식은 무엇입니까?", "options": ["TLS를 이용한 전송 중 암호화만 적용", "클라이언트측 암호화", "다중 인증(MFA)", "서버측 암호화"], "answer": [1], "explain": "클라이언트측 암호화는 클라이언트가 전송 전에 암호화하고 내려받은 뒤 해독합니다. 서버측 암호화는 암호화되지 않은 데이터가 (보안 채널로) 전송된 후 서버가 저장할 때 암호화합니다(예: Amazon S3 서버측 암호화).", "why": ["TLS는 전송 구간만 보호하며 저장 데이터는 보호하지 않습니다.", "소스에서 스토리지까지 전송 중·저장 중 객체를 모두 보호합니다.", "MFA는 인증을 강화하는 수단이지 데이터 암호화 방식이 아닙니다.", "서버측 암호화는 서비스가 데이터를 저장할 때 암호화하고 요청 시 해독합니다."], "tags": ["지식확인", "암호화", "클라이언트측 암호화"]}, {"id": "m3-010", "module": 3, "level": "basic", "pick": 3, "q": "자격 증명 기반 IAM 정책의 스테이트먼트에서 권한을 결정하는 핵심 요소로 기본적으로 포함하는 3가지는 무엇입니까?", "options": ["Principal", "Effect", "Resource", "Action", "Condition"], "answer": [1, 2, 3], "explain": "교재 핵심 사항: IAM 정책 스테이트먼트의 주요 요소는 effect, action, resource이며 이들이 함께 정책 권한을 결정합니다. Principal은 리소스 기반 정책에서, Condition은 필요할 때 선택적으로 사용합니다.", "why": ["리소스 기반 정책에서 사용하며, 자격 증명 기반 정책에는 넣을 수 없습니다(정책이 연결된 주체가 곧 보안 주체).", "Allow 또는 Deny를 지정합니다.", "작업이 적용되는 리소스를 ARN으로 지정합니다.", "허용하거나 거부할 API 작업(예: s3:GetObject)을 지정합니다.", "정책을 적용할 조건을 지정하는 선택 사항입니다."], "tags": ["지식확인", "IAM 정책", "JSON"]}, {"id": "m3-011", "module": 3, "level": "saa", "pick": 1, "q": "한 개발자 팀이 9개월 동안 Virtual Private Cloud(VPC)의 여러 서비스와 리소스에 액세스해야 합니다. 프로젝트 도중에 팀원이 바뀔 가능성이 높습니다. 이 요구 사항을 충족하고 주요 보안 원칙을 따르는 옵션은 무엇입니까?", "options": ["각 개발자별로 IAM 사용자를 생성하고 필요한 IAM 정책을 각 사용자에게 연결한다.", "이 개발자 팀을 위한 단일 IAM 사용자를 생성하고 필요한 IAM 정책을 사용자에게 연결한다.", "개발자 팀을 위한 단일 IAM 사용자를 생성하여 IAM 그룹에 추가한 다음 필요한 IAM 정책을 해당 그룹에 연결한다.", "각 개발자별로 IAM 사용자를 생성하여 모두 IAM 그룹에 추가한 다음 필요한 IAM 정책을 해당 그룹에 연결한다."], "answer": [3], "explain": "교재 샘플 시험 문항입니다. 핵심 단어는 '변경될 수 있는 개발자 팀', '9개월 동안 액세스', '주요 보안 원칙'입니다. 그룹에 정책을 연결하면 새 사용자는 그룹에 추가하는 즉시 권한을 받고, 제거하면 권한이 회수됩니다.", "why": ["동작은 하지만 팀원이 자주 바뀌면 사용자마다 정책을 관리해야 해 비효율적입니다.", "여러 사람이 사용자 하나를 공유하면 개인 책임 추적이 불가능합니다.", "결국 사용자 하나를 공유하므로 개인 책임이 사라집니다.", "개인 식별을 유지하면서, 그룹 멤버십만 바꾸면 권한이 자동으로 부여·회수됩니다."], "tags": ["샘플문항", "IAM", "그룹"]}, {"id": "m3-012", "module": 3, "level": "basic", "pick": 1, "q": "IAM 용어 중 '보안 주체(Principal)'의 정의로 옳은 것은 무엇입니까?", "options": ["AWS가 인증에 사용하는 IAM 리소스 객체(IAM 사용자 및 역할)", "리소스에 대해 허용·거부할 작업을 정의한 JSON 문서", "AWS 계정 루트 사용자, IAM 사용자 또는 IAM 역할을 사용해 인증하고 AWS에 요청하는 사람 또는 애플리케이션", "IAM에 저장된 사용자, 그룹, 역할, 정책, 자격 증명 공급자 객체"], "answer": [2], "explain": "IAM 리소스(사용자·그룹·역할·정책 등 저장 객체) ⊃ IAM 자격 증명(사용자·그룹·역할: 정책을 연결할 수 있는 객체) ⊃ IAM 엔터티(인증에 쓰이는 사용자·역할), 보안 주체는 실제로 요청을 보내는 사람·애플리케이션입니다.", "why": ["'IAM 엔터티'의 정의입니다.", "'IAM 정책'의 정의입니다.", "'보안 주체'의 정의입니다.", "'IAM 리소스'의 정의입니다."], "tags": ["IAM", "용어"]}, {"id": "m3-013", "module": 3, "level": "basic", "pick": 2, "q": "IAM 그룹에 대한 설명으로 옳은 것을 고르시오.", "options": ["IAM 역할을 그룹 멤버로 추가할 수 있다.", "그룹은 자체 암호로 AWS Management Console에 로그인할 수 있다.", "사용자를 그룹에서 제거하면, 그 그룹에 연결된 정책으로 받던 권한도 더 이상 적용되지 않는다.", "IAM 그룹을 S3 버킷 정책의 Principal로 지정할 수 있다.", "여러 IAM 사용자에게 동일한 권한 세트를 한 번에 부여하는 데 사용한다."], "answer": [2, 4], "explain": "IAM 그룹은 IAM 사용자의 모음입니다. 장기 액세스를 구성할 때는 정책을 그룹에 연결하고 사용자를 그룹에 할당하는 것이 모범 사례입니다. 필요하면 사용자에게 정책을 직접 연결해 추가 권한을 줄 수도 있습니다.", "why": ["그룹 멤버는 IAM 사용자만 가능합니다.", "그룹은 자격 증명을 갖지 않으며 로그인 주체가 아닙니다.", "그룹 멤버는 그룹의 권한을 상속하므로, 제거되면 상속도 끝납니다.", "그룹은 인증 주체가 아니므로 Principal로 지정할 수 없습니다.", "그룹의 목적입니다."], "tags": ["IAM", "그룹"]}, {"id": "m3-014", "module": 3, "level": "basic", "pick": 3, "q": "Well-Architected Framework 보안 원칙의 설계 원칙에 해당하는 것을 고르시오.", "options": ["보안은 네트워크 외부 경계에서만 처리한다.", "추적 가능성을 유지 관리한다.", "강력한 자격 증명 기반을 구현한다.", "장기 정적 자격 증명을 여러 사람이 공유하도록 중앙에서 배포한다.", "데이터를 사람이 직접 처리하는 비중을 늘린다.", "모든 계층에 보안을 적용한다."], "answer": [1, 2, 5], "explain": "보안 원칙의 7가지 설계 원칙은 강력한 자격 증명 기반, 전송 중·저장 데이터 보호, 모든 계층에 보안 적용, 데이터 수동 처리 최소화, 추적 가능성 유지, 보안 이벤트 대비, 보안 모범 사례 자동화입니다.", "why": ["외부 경계만이 아니라 모든 계층에 보안을 적용해야 합니다.", "실시간 모니터링·알림·감사로 작업과 변경을 추적합니다.", "최소 권한, 직무 분리, 중앙 집중식 자격 증명 관리가 포함됩니다.", "장기 정적 자격 증명에 의존하지 않는 것이 원칙입니다.", "반대로 '데이터 수동 처리 최소화'가 설계 원칙입니다.", "네트워크 엣지, VPC, 로드 밸런싱, 인스턴스, OS, 애플리케이션 등 심층 방어를 적용합니다."], "tags": ["Well-Architected", "보안 원칙"]}, {"id": "m3-015", "module": 3, "level": "basic", "pick": 1, "q": "같은 AWS 계정에서, IAM 사용자 Bob의 자격 증명 기반 정책은 버킷 X에 대해 GET, PUT, LIST를 모두 허용합니다. 버킷 X의 리소스 기반 정책은 Bob에게 GET과 LIST는 허용하고 PUT은 명시적으로 거부합니다. Bob이 버킷 X에서 수행할 수 없는 작업은 무엇입니까?", "options": ["PUT(객체 업로드)", "LIST(객체 나열)", "세 작업 모두 수행할 수 없다.", "세 작업 모두 수행할 수 있다.", "GET(객체 읽기)"], "answer": [0], "explain": "교재 '정책: 예제 1'입니다. 자격 증명 기반 정책이 PUT을 허용해도, 버킷의 리소스 기반 정책에 PUT 명시적 거부가 있으면 최종 결과는 거부입니다.", "why": ["버킷 정책의 명시적 거부가 자격 증명 기반 정책의 허용보다 우선합니다.", "두 정책 모두 허용하므로 가능합니다.", "명시적 거부는 PUT에만 적용됩니다.", "PUT은 명시적으로 거부되었습니다.", "두 정책 모두 허용하고 거부가 없으므로 가능합니다."], "tags": ["IAM 정책", "정책 평가", "리소스 기반 정책"]}, {"id": "m3-017", "module": 3, "level": "basic", "pick": 2, "q": "다음 IAM 정책이 연결된 사용자가 수행할 수 있는 작업을 고르시오.\n\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": {\n    \"Effect\": \"Allow\",\n    \"Action\": [\"iam:Get*\", \"iam:List*\"],\n    \"Resource\": \"*\"\n  }\n}", "options": ["s3:ListBucket", "iam:AttachUserPolicy", "iam:CreateUser", "iam:GetRole", "iam:ListUsers"], "answer": [3, 4], "explain": "교재 활동 'IAM 정책 분석(1/3)'입니다. 이 정책은 IAM 서비스에 대해 Get·List 요청만 허용하므로 사실상 읽기 전용입니다. 사용자·그룹·정책·역할을 생성할 수는 없습니다.", "why": ["이 정책은 IAM 서비스 작업만 허용합니다.", "정책 연결은 쓰기 작업으로 허용되지 않습니다.", "생성 작업은 Get*/List*에 포함되지 않습니다.", "iam:Get*에 포함됩니다.", "iam:List*에 포함됩니다."], "tags": ["IAM 정책", "JSON", "와일드카드"]}, {"id": "m3-018", "module": 3, "level": "basic", "pick": 2, "q": "다음 IAM 정책에 대한 설명으로 옳은 것을 고르시오.\n\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    { \"Effect\": \"Allow\", \"Action\": \"ec2:TerminateInstances\", \"Resource\": \"*\" },\n    { \"Effect\": \"Deny\", \"Action\": \"ec2:TerminateInstances\",\n      \"Condition\": { \"NotIpAddress\": { \"aws:SourceIp\": [\"192.0.2.0/24\", \"203.0.113.0/24\"] } },\n      \"Resource\": \"*\" }\n  ]\n}", "options": ["이 정책은 조건 없이 언제 어디서든 종료를 허용한다.", "203.0.113.0/24 범위에서의 종료 요청은 거부된다.", "IP 주소 192.0.2.243에서 요청하면 EC2 인스턴스를 종료할 수 있다.", "IP 주소 198.51.100.20에서 요청하면 종료가 거부된다.", "Deny 스테이트먼트가 있으므로 어떤 IP에서도 종료할 수 없다."], "answer": [2, 3], "explain": "교재 활동 'IAM 정책 분석(2/3)'입니다. Deny는 '지정한 두 IP 범위가 아닌 곳'에서 온 요청에만 적용되므로, 결과적으로 두 범위 안에서만 종료할 수 있습니다. 조건부 Deny는 조건을 대입해 적용 여부부터 판단하세요.", "why": ["Deny 스테이트먼트가 지정된 범위 밖의 요청을 거부합니다.", "203.0.113.0/24는 허용된 범위입니다.", "192.0.2.0/24 범위(192.0.2.0~192.0.2.255)에 속하므로 Deny 조건에 해당하지 않습니다.", "두 범위 어디에도 속하지 않아 Deny 조건이 적용됩니다.", "Deny는 조건(NotIpAddress)을 만족할 때만 적용됩니다."], "tags": ["IAM 정책", "Condition", "정책 평가"]}, {"id": "m3-019", "module": 3, "level": "basic", "pick": 2, "q": "다음 두 스테이트먼트가 한 정책에 함께 들어 있습니다. 옳은 설명을 고르시오.\n\n{ \"Effect\": \"Deny\",\n  \"Action\": [\"ec2:RunInstances\", \"ec2:StartInstances\"],\n  \"Resource\": \"arn:aws:ec2:*:*:instance/*\",\n  \"Condition\": { \"StringNotEquals\": { \"ec2:InstanceType\": [\"t2.micro\", \"t2.small\"] } } }\n\n{ \"Effect\": \"Allow\", \"Action\": \"ec2:*\", \"Resource\": \"*\" }", "options": ["m3.xlarge 유형의 인스턴스를 새로 시작(RunInstances)할 수 있다.", "중지된 m3.xlarge 인스턴스를 다시 시작(StartInstances)할 수 있다.", "실행 중인 m3.xlarge 인스턴스를 종료(TerminateInstances)할 수 있다.", "Allow 스테이트먼트가 나중에 작성되었으므로 모든 EC2 작업이 허용된다.", "t2.micro 유형의 인스턴스를 시작(RunInstances)할 수 있다."], "answer": [2, 4], "explain": "교재 활동 'IAM 정책 분석(3/3)'입니다. Deny 스테이트먼트만 있으면 아무 작업도 허용되지 않지만, ec2:* Allow를 더하면 t2.micro·t2.small 외 유형의 실행·시작만 막히고 나머지 EC2 작업은 허용됩니다.", "why": ["t2.micro·t2.small이 아니므로 Deny가 적용됩니다.", "StartInstances도 Deny 대상입니다.", "Deny는 RunInstances와 StartInstances에만 적용되므로 종료는 ec2:*로 허용됩니다.", "작성 순서는 평가 결과에 영향을 주지 않으며, 명시적 거부가 우선합니다.", "t2.micro는 Deny 조건(StringNotEquals)에 해당하지 않고 ec2:*로 허용됩니다."], "tags": ["IAM 정책", "Condition", "정책 평가"]}, {"id": "m3-020", "module": 3, "level": "basic", "pick": 1, "q": "다음 정책이 연결된 사용자에 대한 설명으로 옳은 것은 무엇입니까?\n\n[\n  { \"Effect\": \"Allow\", \"Action\": [\"dynamodb:*\", \"s3:*\"],\n    \"Resource\": [\"...:table/course-notes\", \"arn:aws:s3:::course-notes-web\", \"arn:aws:s3:::course-notes-mp3/*\"] },\n  { \"Effect\": \"Deny\", \"Action\": [\"dynamodb:*\", \"s3:*\"],\n    \"NotResource\": [\"...:table/course-notes\", \"arn:aws:s3:::course-notes-web\", \"arn:aws:s3:::course-notes-mp3/*\"] }\n]", "options": ["NotResource에 나열된 리소스에 대한 모든 작업이 거부된다.", "계정의 모든 DynamoDB 테이블과 S3 버킷에 접근할 수 있다.", "Deny 스테이트먼트 때문에 이 사용자는 어떤 작업도 할 수 없다.", "나열된 테이블과 버킷에 대해서만 DynamoDB·S3 작업을 할 수 있고, 다른 정책이 다른 DynamoDB·S3 리소스를 허용하더라도 그 접근은 거부된다."], "answer": [3], "explain": "교재 '예제: 리소스 기반 정책' 슬라이드의 정책입니다. Deny + NotResource는 '나열한 리소스를 제외한 모든 리소스'에 거부를 적용합니다. 명시적 거부는 다른 정책의 허용보다 우선하므로, 지정 리소스 외 접근은 어떤 정책으로도 열 수 없습니다.", "why": ["반대입니다. NotResource는 '나열된 리소스를 제외한' 리소스에 Deny를 적용합니다.", "지정 리소스 외에는 명시적으로 거부됩니다.", "Deny는 나열된 리소스를 제외한 범위에만 적용됩니다.", "Allow로 지정 리소스를 허용하고, 나머지 리소스는 명시적 Deny로 막습니다."], "tags": ["IAM 정책", "NotResource", "정책 평가"]}, {"id": "m3-021", "module": 3, "level": "basic", "pick": 1, "q": "계정 A가 S3 버킷 DOC-EXAMPLE-BUCKET에 다음 버킷 정책을 연결했습니다. 계정 B의 IAM 사용자 Kim이 이 버킷에 실제로 접근하려면 추가로 무엇이 필요합니까?\n\n{ \"Principal\": { \"AWS\": \"111122223333\" },   ← 계정 B\n  \"Effect\": \"Allow\", \"Action\": \"s3:*\",\n  \"Resource\": [\"arn:aws:s3:::DOC-EXAMPLE-BUCKET\", \"arn:aws:s3:::DOC-EXAMPLE-BUCKET/*\"] }", "options": ["계정 A 루트 사용자의 액세스 키를 Kim에게 전달해야 한다.", "계정 A에 Kim과 같은 이름의 IAM 사용자를 만들어야 한다.", "계정 B에서 Kim(또는 Kim이 속한 그룹)에게 해당 버킷에 대한 S3 작업을 허용하는 IAM 정책을 연결해야 한다.", "추가 조치 없이 계정 B의 모든 사용자가 즉시 접근할 수 있다."], "answer": [2], "explain": "이 버킷 정책은 특정 사용자가 아니라 계정 B 전체를 Principal로 지정합니다. 계정 A는 계정 B에 권한을 주고, 계정 B는 자기 사용자 중 누가 그 권한을 쓸지 IAM 정책으로 다시 허용해야 합니다(양쪽 모두 허용 필요).", "why": ["루트 자격 증명 공유는 절대 해서는 안 됩니다.", "크로스 계정 정책을 쓰면 계정 A에 사용자를 만들 필요가 없습니다.", "교재 설명처럼 계정 B는 자기 사용자가 버킷에 접근하도록 허용하는 IAM 사용자 정책을 만들어야 합니다.", "계정 B 내부에서도 사용자에게 권한을 위임해야 합니다."], "tags": ["IAM 정책", "크로스 계정", "리소스 기반 정책"]}, {"id": "m3-023", "module": 3, "level": "basic", "pick": 1, "q": "새 AWS 계정을 만든 직후 교재가 권장하는 관리자 사용자 설정 단계의 순서로 옳은 것은 무엇입니까?", "options": ["루트 사용자로 로그인 → 관리자 사용자 생성 → 루트 사용자 삭제 → 관리자 사용자로 로그인 → 추가 사용자 생성", "루트 사용자로 로그인 → 필요한 모든 사용자를 루트로 직접 생성 → 루트 액세스 키 생성 → 루트 사용자 로그아웃", "루트 사용자로 로그인해 루트 사용자에 MFA 설정 → 관리자 사용자 생성(MFA 추가) → 루트 사용자 로그아웃 → 관리자 사용자로 로그인 → 추가 사용자 생성", "관리자 사용자로 먼저 로그인 → 루트 사용자 MFA 설정 → 추가 사용자 생성 → 루트 사용자로 일상 작업 수행"], "answer": [2], "explain": "루트 사용자는 처음 관리자 사용자를 만들 때만 쓰고 로그아웃합니다. 이후 사용자 생성 등 일상 관리는 MFA가 설정된 관리자 사용자로 수행하며, 각 사용자에게는 권한이 있는 별도 정책을 부여합니다.", "why": ["루트 사용자는 삭제할 수 없고, 루트 MFA 설정이 빠졌습니다.", "일상 작업을 루트로 수행하고 루트 액세스 키까지 만드는 잘못된 방법입니다.", "교재의 5단계 순서입니다.", "관리자 사용자는 루트로 먼저 만들어야 하며, 일상 작업에 루트를 쓰면 안 됩니다."], "tags": ["루트 사용자", "MFA", "모범 사례"]}, {"id": "m3-024", "module": 3, "level": "basic", "pick": 2, "q": "액세스 보안 모범 사례와 관련된 설명으로 옳은 것을 고르시오.", "options": ["AWS Organizations는 여러 AWS 계정을 통합해 청구, 액세스 제어, 리소스를 중앙에서 관리하게 해 준다.", "AWS CloudTrail은 EC2 인스턴스의 CPU 사용률을 수집해 Auto Scaling을 트리거한다.", "MFA를 설정하면 사용자에게 허용된 작업 범위가 넓어진다.", "AWS CloudTrail은 계정에서 수행된 작업(API 호출)을 기록해 보안 위험 식별과 감사 요구 사항 준수에 도움을 준다.", "AWS Organizations는 S3 객체를 서버측 암호화하는 서비스다."], "answer": [0, 3], "explain": "교재의 액세스 보안 모범 사례에는 최소 권한, MFA, 임시 자격 증명, 액세스 키 회전, 강력한 암호, 로컬 자격 증명 보호, AWS Organizations 사용, AWS CloudTrail 사용, 루트 사용자 보호가 있습니다.", "why": ["Organizations의 역할입니다.", "지표 수집과 경보는 Amazon CloudWatch의 역할입니다.", "MFA는 인증을 강화할 뿐 권한 범위를 바꾸지 않습니다.", "CloudTrail의 역할입니다.", "Organizations는 계정 관리 서비스입니다."], "tags": ["모범 사례", "CloudTrail", "Organizations"]}, {"id": "m3-025", "module": 3, "level": "basic", "pick": 1, "q": "다음 자격 증명 기반 정책을 IAM 그룹 '개발자'에 연결했습니다. 그 효과로 옳은 것은 무엇입니까?\n\n{ \"Effect\": \"Allow\",\n  \"Action\": [\"iam:*LoginProfile\", \"iam:*AccessKey*\", \"iam:*SSHPublicKey*\"],\n  \"Resource\": \"arn:aws:iam::123456789012:user/${aws:username}\" }", "options": ["그룹의 사용자가 새로운 IAM 사용자를 만들 수 있다.", "그룹의 모든 사용자가 계정의 모든 IAM 사용자의 액세스 키를 관리할 수 있다.", "그룹의 각 사용자가 자기 자신의 암호, 액세스 키, SSH 공개 키만 생성·삭제·조회·업데이트할 수 있다.", "${aws:username}은 고정 문자열로 취급되어 어떤 사용자에게도 적용되지 않는다."], "answer": [2], "explain": "교재 '예제: 자격 증명 기반 정책'입니다. Action의 와일드카드(*)는 관련 작업을 한꺼번에 포함하고, Resource의 ${aws:username} 변수는 요청자의 사용자 이름을 동적으로 가져와 '자기 자신'의 자격 증명만 관리하게 합니다.", "why": ["iam:CreateUser 같은 작업은 포함되지 않습니다.", "Resource가 요청자 자신의 사용자 ARN으로 제한됩니다.", "${aws:username}이 요청한 사용자의 이름으로 동적으로 바뀝니다.", "정책 변수로, 요청 시점에 실제 사용자 이름으로 대체됩니다."], "tags": ["IAM 정책", "정책 변수", "와일드카드"]}, {"id": "m3-026", "module": 3, "level": "basic", "pick": 1, "q": "IAM 정책 평가에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["가장 먼저 연결된 정책이 가장 높은 우선순위를 가진다.", "평가 순서는 결과에 영향을 주지 않으며, 적용 가능한 모든 정책을 평가해 명시적 거부가 하나라도 있으면 거부된다.", "명시적 허용이 있으면 명시적 거부를 무시한다.", "적용되는 정책이 하나도 없으면 기본적으로 허용된다."], "answer": [1], "explain": "IAM은 적용 가능한 모든 정책을 평가합니다. 명시적 거부 → (없으면) 명시적 허용 → (없으면) 암시적 거부 순으로 판정하며, 정책 평가 순서는 결과를 바꾸지 않습니다. 한 정책 안의 여러 스테이트먼트는 논리 OR로 함께 평가됩니다.", "why": ["연결 순서는 결과에 영향을 주지 않습니다.", "IAM 평가 로직의 핵심입니다.", "명시적 거부가 명시적 허용보다 우선합니다.", "기본값은 거부(암시적 거부)입니다."], "tags": ["IAM 정책", "정책 평가"]}, {"id": "m3-027", "module": 3, "level": "basic", "pick": 1, "q": "IAM 살펴보기 실습에서 다룬 내용입니다. 여러 IAM 그룹에 연결된 관리형 정책의 내용을 수정(업데이트)하면 어떻게 됩니까?", "options": ["이미 연결된 그룹에는 적용되지 않고, 새로 연결하는 그룹에만 적용된다.", "관리형 정책은 수정할 수 없으므로 항상 새 정책을 만들어야 한다.", "그 정책이 연결된 모든 사용자·그룹·역할의 권한에 변경 내용이 반영된다.", "변경 내용을 적용하려면 해당 사용자들을 모두 삭제하고 다시 만들어야 한다."], "answer": [2], "explain": "관리형 정책은 독립된 정책 객체로 여러 사용자·그룹·역할에 연결할 수 있습니다. 정책을 업데이트하면 연결된 모든 자격 증명에 변경 사항이 적용되므로, 권한을 한곳에서 일관되게 관리할 수 있습니다.", "why": ["관리형 정책은 연결된 모든 자격 증명에 공통으로 적용됩니다.", "고객 관리형 정책은 수정할 수 있으며, 수정하면 새 버전이 기본 버전이 됩니다.", "관리형 정책은 하나의 정책을 여러 자격 증명이 공유하므로 수정 사항이 모두에게 반영됩니다.", "사용자를 다시 만들 필요는 없습니다."], "tags": ["IAM 정책", "관리형 정책", "실습 원리"]}, {"id": "m3-028", "module": 3, "level": "basic", "pick": 1, "q": "IAM 정책을 개발할 때, 특정 IAM 엔터티에 리소스 액세스 권한이 실제로 부여되는지 테스트하고 문제를 해결하는 데 유용한 도구는 무엇입니까?", "options": ["IAM 정책 시뮬레이터", "Amazon CloudFront", "AWS Well-Architected Tool", "Amazon EC2 Auto Scaling"], "answer": [0], "explain": "여러 정책이 겹치면 실제 허용 여부를 눈으로 판단하기 어렵습니다. IAM 정책 시뮬레이터로 특정 작업이 허용·거부되는지 미리 테스트할 수 있습니다.", "why": ["교재에서 정책 테스트·문제 해결 도구로 소개합니다.", "콘텐츠 전송(CDN) 서비스입니다.", "아키텍처 모범 사례 검토 도구입니다.", "인스턴스 수를 자동 조정하는 서비스입니다."], "tags": ["IAM 정책", "정책 시뮬레이터"]}, {"id": "m3-029", "module": 3, "level": "saa", "pick": 1, "q": "EC2 인스턴스에서 실행되는 주문 처리 애플리케이션이 S3 버킷 'orders-data'의 객체를 읽고 써야 합니다. 현재는 IAM 사용자의 액세스 키가 애플리케이션 설정 파일에 저장되어 있어 보안 감사에서 지적을 받았습니다. 가장 안전하고 운영 부담이 적은 방법은 무엇입니까?", "options": ["액세스 키를 환경 변수로 옮기고 1년에 한 번 회전한다.", "해당 버킷에 필요한 작업만 허용하는 IAM 역할을 만들고, 인스턴스 프로파일로 EC2 인스턴스에 연결한다.", "애플리케이션 전용 IAM 사용자를 만들고 AdministratorAccess 정책을 연결한다.", "버킷을 퍼블릭으로 설정해 자격 증명 없이 접근하게 한다.", "루트 사용자의 액세스 키로 교체한다."], "answer": [1], "explain": "EC2에서 실행되는 애플리케이션이 AWS 리소스에 접근해야 하면, 장기 자격 증명을 인스턴스에 저장하지 말고 IAM 역할을 만들어 인스턴스 프로파일로 연결합니다. 역할은 자동으로 교체되는 임시 자격 증명을 제공합니다.", "why": ["여전히 장기 자격 증명이 인스턴스에 저장됩니다.", "애플리케이션이 런타임에 역할의 임시 자격 증명을 자동으로 받아 사용하며, 최소 권한도 지킵니다.", "장기 키 문제가 남고 최소 권한 원칙에도 어긋납니다.", "주문 데이터가 인터넷에 노출됩니다.", "계정 전체 권한이 노출되는 최악의 선택입니다."], "tags": ["IAM", "역할", "인스턴스 프로파일", "최소 권한"]}, {"id": "m3-030", "module": 3, "level": "saa", "pick": 1, "q": "회사 A는 외부 감사 법인(자체 AWS 계정 B 보유)의 감사인들이 3주 동안 계정 A의 S3 버킷에 있는 보고서를 읽을 수 있게 해야 합니다. 회사 A는 감사인을 위해 계정 A에 IAM 사용자를 만들거나 장기 자격 증명을 발급하고 싶지 않습니다. 가장 적합한 방법은 무엇입니까?", "options": ["계정 A에 감사인 공용 IAM 사용자 1개를 만들고 암호를 공유한다.", "버킷을 퍼블릭 읽기로 설정했다가 감사가 끝나면 비공개로 되돌린다.", "계정 A에 계정 B를 신뢰하는 읽기 전용 IAM 역할을 만들고, 계정 B의 감사인이 그 역할로 전환해 임시 자격 증명으로 접근하게 한다.", "감사인마다 계정 A에 IAM 사용자를 만들어 주고 감사가 끝나면 삭제한다.", "계정 A 루트 사용자의 액세스 키를 감사 기간 동안 전달한다."], "answer": [2], "explain": "다른 계정의 사용자가 일시적으로 리소스에 접근해야 하면, 계정에 IAM 사용자를 만드는 대신 그 계정을 신뢰 엔터티로 지정한 크로스 계정 역할을 만듭니다. 계정 B 쪽에서도 감사인에게 역할 수임(전환)을 허용해야 합니다.", "why": ["IAM 사용자 생성·자격 증명 공유 모두 요구 사항과 보안 원칙에 어긋납니다.", "감사 기간 동안 누구나 보고서를 읽을 수 있게 됩니다.", "크로스 계정 역할은 IAM 사용자 없이 임시 자격 증명으로 접근하게 해 줍니다.", "동작은 하지만 '계정 A에 IAM 사용자를 만들지 않는다'는 요구 사항을 위반합니다.", "루트 자격 증명은 절대 공유하면 안 됩니다."], "tags": ["IAM", "역할", "크로스 계정"]}, {"id": "m3-033", "module": 3, "level": "saa", "pick": 1, "q": "개발자는 운영 계정에서 EC2 인스턴스를 생성할 수 있어야 하지만, 실수로 인한 장애를 막기 위해 인스턴스를 중지하거나 종료할 수는 없어야 합니다. 개발자 중 일부는 다른 그룹을 통해 ec2:*가 허용되어 있을 수도 있습니다. 개발자 그룹에 연결할 정책으로 가장 적절한 것은 무엇입니까?", "options": ["ec2:RunInstances만 Allow하는 스테이트먼트를 연결한다.", "ec2:StopInstances와 ec2:TerminateInstances만 Allow한다.", "ec2:*를 Allow하고, 개발자들에게 인스턴스를 종료하지 말라고 공지한다.", "ec2:RunInstances를 Allow하고, ec2:StopInstances와 ec2:TerminateInstances를 명시적으로 Deny하는 스테이트먼트를 포함한다."], "answer": [3], "explain": "다른 정책에서 넓은 권한이 허용될 가능성이 있을 때 특정 작업을 '반드시' 막으려면 명시적 Deny를 사용합니다. 교재 예시도 '개발자는 EC2 인스턴스를 생성할 수 있어도 중지하거나 종료할 수는 없어야 한다'는 최소 권한 사례를 듭니다.", "why": ["다른 정책의 ec2:* 허용 때문에 중지·종료가 여전히 가능할 수 있습니다.", "요구 사항과 정반대입니다.", "공지는 기술적 통제가 아닙니다.", "명시적 거부는 다른 어떤 정책의 허용보다 우선하므로 확실히 막을 수 있습니다."], "tags": ["IAM 정책", "최소 권한", "명시적 거부"]}, {"id": "m3-036", "module": 3, "level": "saa", "pick": 1, "q": "모바일 앱 사용자가 촬영한 사진을 S3 버킷에 업로드해야 합니다. 앱은 수십만 대의 기기에 설치되며, 앱 코드에서 자격 증명이 추출될 위험이 있습니다. 가장 안전한 방법은 무엇입니까?", "options": ["업로드 전용 IAM 사용자 하나를 만들고 그 액세스 키를 앱에 내장한다.", "앱 사용자마다 IAM 사용자를 만들어 준다.", "버킷에 퍼블릭 쓰기 권한을 부여한다.", "사용자가 앱에서 인증하면 업로드 권한만 가진 IAM 역할을 수임해 임시 보안 자격 증명을 받아 업로드하게 한다."], "answer": [3], "explain": "모바일 애플리케이션은 IAM 역할의 대표 사용 사례입니다. 회전하기 어렵고 추출될 수 있는 장기 자격 증명을 앱에 저장하지 말고, 인증 후 역할을 통해 임시 자격 증명을 받게 합니다(예: Amazon Cognito와 연동).", "why": ["추출된 장기 키는 회전도 어렵고 모든 기기가 같은 키를 공유하게 됩니다.", "수십만 개의 IAM 사용자를 관리하는 것은 비현실적이고 장기 자격 증명 문제도 남습니다.", "누구나 버킷에 파일을 쓸 수 있게 되어 매우 위험합니다.", "만료되는 임시 자격 증명을 쓰므로 키가 추출되어도 피해가 제한됩니다."], "tags": ["IAM", "역할", "임시 자격 증명"]}, {"id": "m3-037", "module": 3, "level": "saa", "pick": 1, "q": "직원 3,000명이 사용하는 기업이 이미 Microsoft Active Directory로 직원 계정을 관리합니다. 직원들이 별도의 AWS 암호를 기억하지 않고 기존 회사 계정으로 AWS 콘솔에 접근하게 하려고 합니다. 운영 오버헤드가 가장 적은 방법은 무엇입니까?", "options": ["기존 디렉터리와 페더레이션을 구성해(예: IAM Identity Center) 직원이 회사 계정으로 인증한 뒤 임시 자격 증명으로 AWS에 접근하게 한다.", "모든 직원이 루트 사용자로 로그인하게 한다.", "직원 3,000명 각각에 대해 IAM 사용자를 만들고 초기 암호를 이메일로 보낸다.", "부서별 공용 IAM 사용자를 만들어 공유한다."], "answer": [0], "explain": "이미 자격 증명 시스템이 있으면 페더레이션으로 연동해 직원이 기존 계정으로 로그인하게 합니다. 교재도 '개인 사용자가 임시 자격 증명을 사용해 AWS에 액세스하도록 요구'하고 IAM Identity Center로 중앙 관리하라고 권장합니다.", "why": ["IAM은 Microsoft Active Directory 같은 기업 시스템과의 페더레이션을 지원합니다.", "가장 위험한 방법입니다.", "사용자를 이중으로 관리해야 하고 장기 자격 증명이 늘어납니다.", "개인 책임 추적이 불가능합니다."], "tags": ["IAM", "페더레이션", "IAM Identity Center"]}, {"id": "m3-040", "module": 3, "level": "saa", "pick": 2, "q": "한 회사가 S3에 고객 문서를 저장합니다. 요구 사항은 (1) 전송 중 데이터 보호, (2) 저장 데이터 암호화이며, 애플리케이션 수정과 키 관리 부담은 최소화해야 합니다. 적절한 조치를 고르시오.", "options": ["클라이언트와 S3 간 통신에 TLS(HTTPS)를 사용한다.", "애플리케이션에 자체 암호화 라이브러리를 구현해 모든 파일을 업로드 전에 암호화한다.", "객체 URL을 외부에 알리지 않는 방법으로 보호한다.", "S3 서버측 암호화를 사용해 객체를 저장할 때 암호화한다.", "버킷을 퍼블릭으로 열고 파일 이름을 무작위로 만든다."], "answer": [0, 3], "explain": "전송 중 데이터는 TLS, 저장 데이터는 서버측 암호화로 보호하는 것이 가장 간단한 조합입니다. 서버측 암호화는 서비스가 암호화·해독을 처리하므로 애플리케이션 변경이 거의 필요 없습니다.", "why": ["(1) 전송 중인 데이터를 암호화 프로토콜로 보호합니다.", "가능하지만 애플리케이션 수정과 키 관리 부담이 커서 요구 사항에 어긋납니다.", "URL 은닉은 보안 통제가 아닙니다.", "(2) S3가 디스크에 쓸 때 암호화하고 권한 있는 요청 시 해독합니다.", "데이터가 노출될 위험이 큽니다."], "tags": ["암호화", "서버측 암호화", "TLS"]}, {"id": "m3-041", "module": 3, "level": "saa", "pick": 1, "q": "데이터 분석팀은 'company-data' 버킷의 'reports/' 접두사 아래 객체를 읽기만 하면 됩니다. 최소 권한의 원칙을 가장 잘 따르는 자격 증명 기반 정책 스테이트먼트는 무엇입니까?", "options": ["\"Effect\": \"Allow\", \"Action\": [\"s3:GetObject\", \"s3:PutObject\", \"s3:DeleteObject\"], \"Resource\": \"arn:aws:s3:::company-data/reports/*\"", "\"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"*\"", "\"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::company-data\"", "\"Effect\": \"Allow\", \"Action\": \"s3:*\", \"Resource\": \"arn:aws:s3:::company-data/*\"", "\"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::company-data/reports/*\""], "answer": [4], "explain": "최소 권한은 Action(작업)과 Resource(대상) 모두를 필요한 만큼만 좁히는 것입니다. 객체 작업(s3:GetObject)은 'arn:aws:s3:::버킷/키' 형태의 객체 ARN에 적용된다는 점도 기억하세요.", "why": ["읽기만 필요한데 쓰기·삭제까지 허용합니다.", "계정의 모든 버킷 객체를 읽을 수 있게 됩니다.", "버킷 ARN만 지정하면 객체에 대한 GetObject가 적용되지 않습니다(객체 ARN은 /키가 붙어야 함).", "모든 S3 작업과 버킷 전체 객체를 허용해 범위가 너무 넓습니다.", "필요한 작업(읽기)과 필요한 리소스(reports/ 아래 객체)만 허용합니다."], "tags": ["IAM 정책", "최소 권한", "ARN"]}, {"id": "m3-042", "module": 3, "level": "saa", "pick": 2, "q": "한 회사가 온프레미스 데이터베이스를 AWS로 옮기면서 두 가지 안을 비교합니다. A안은 EC2 인스턴스에 DB 소프트웨어를 직접 설치하는 것이고, B안은 Amazon RDS 같은 관리형 데이터베이스 서비스를 사용하는 것입니다. B안을 선택하더라도 여전히 고객의 책임으로 남는 것을 고르시오.", "options": ["하드웨어 장애 시 물리 서버 교체", "데이터 센터의 물리적 출입 통제", "저장 데이터 암호화 사용 여부 등 데이터 보호 설정", "데이터베이스 서버의 기반 운영 체제 패치", "데이터베이스 사용자 계정과 접근 권한 관리"], "answer": [2, 4], "explain": "관리형 서비스로 갈수록 AWS가 맡는 범위가 넓어지지만, 고객 데이터, 자격 증명·액세스 관리, 암호화 같은 데이터 보호 설정은 항상 고객 책임으로 남습니다(공동 책임 모델).", "why": ["기반 하드웨어는 AWS가 관리합니다.", "물리적 보안은 항상 AWS 책임입니다.", "고객 데이터와 암호화 옵션은 고객이 관리합니다.", "관리형 서비스에서는 AWS가 기반 OS를 관리합니다.", "누가 데이터에 접근하는지는 서비스 종류와 관계없이 고객 책임입니다."], "tags": ["공동 책임 모델", "관리형 서비스"]}, {"id": "m3-043", "module": 3, "level": "saa", "pick": 1, "q": "S3 버킷 'secure-docs'에 다음 버킷 정책이 연결되어 있습니다. 같은 계정의 사용자 Lee는 IAM 정책으로 이 버킷 객체에 대한 s3:GetObject를 허용받았습니다. 옳은 설명은 무엇입니까?\n\n{ \"Effect\": \"Deny\", \"Principal\": \"*\", \"Action\": \"s3:*\",\n  \"Resource\": [\"arn:aws:s3:::secure-docs\", \"arn:aws:s3:::secure-docs/*\"],\n  \"Condition\": { \"Bool\": { \"aws:SecureTransport\": \"false\" } } }", "options": ["Principal이 \"*\"이므로 인터넷의 누구나 HTTPS로 객체를 읽을 수 있다.", "Deny 스테이트먼트가 있으므로 Lee는 어떤 방식으로도 객체를 읽을 수 없다.", "Lee가 HTTPS로 요청하면 객체를 읽을 수 있지만, 암호화되지 않은 HTTP로 요청하면 거부된다.", "Lee의 IAM 정책 Allow가 버킷 정책의 Deny보다 우선하므로 HTTP 요청도 허용된다."], "answer": [2], "explain": "조건부 Deny는 '조건이 참인 요청'에만 적용됩니다. aws:SecureTransport가 false(HTTP)인 요청을 거부해 전송 중 암호화를 강제하는 패턴으로, 보안 설계 원칙 '전송 중 데이터 보호'를 정책으로 구현한 예입니다.", "why": ["이 스테이트먼트는 Deny이며 아무것도 허용하지 않습니다.", "Deny는 조건(암호화되지 않은 요청)을 만족할 때만 적용됩니다.", "HTTP 요청은 조건이 참이 되어 명시적 거부, HTTPS 요청은 Deny가 적용되지 않아 IAM 정책의 허용으로 처리됩니다.", "명시적 거부가 명시적 허용보다 우선합니다."], "tags": ["IAM 정책", "Condition", "암호화", "리소스 기반 정책"]}, {"id": "m3-044", "module": 3, "level": "saa", "pick": 1, "q": "운영 버킷의 객체 삭제는 MFA로 인증된 세션에서만 가능해야 합니다. 관리자들은 이미 s3:*를 허용받고 있으며, 일부는 액세스 키로 CLI를 사용합니다. 가장 적절한 방법은 무엇입니까?", "options": ["삭제는 루트 사용자로만 하도록 운영 규칙을 정한다.", "관리자 사용자에게 MFA 디바이스를 등록만 해 둔다.", "s3:DeleteObject에 대해 aws:MultiFactorAuthPresent가 false(또는 값 없음)인 요청을 Deny하는 조건부 스테이트먼트를 추가한다.", "s3:DeleteObject를 Allow하는 스테이트먼트를 하나 더 추가한다."], "answer": [2], "explain": "MFA는 인증을 강화하지만, '어떤 작업에 MFA를 요구할지'는 정책 조건으로 강제해야 합니다. 이미 넓은 허용이 있는 상황이므로 조건부 명시적 거부를 추가하는 패턴을 사용합니다.", "why": ["루트 사용자를 일상 작업에 쓰는 것은 모범 사례에 어긋납니다.", "MFA 등록만으로는 액세스 키 기반 요청에서 MFA를 강제하지 못합니다.", "MFA로 인증되지 않은 세션의 삭제 요청을 명시적으로 거부합니다.", "이미 허용되어 있어 아무것도 바뀌지 않습니다."], "tags": ["IAM 정책", "MFA", "Condition"]}, {"id": "m3-045", "module": 3, "level": "saa", "pick": 2, "q": "온프레미스 서버의 배치 스크립트가 매일 밤 S3에 백업 파일을 업로드합니다. 이 환경에서는 IAM 역할을 사용할 수 없어 장기 액세스 키를 써야 한다고 가정합니다. 모범 사례에 맞는 조치를 고르시오.", "options": ["관리자 사용자의 액세스 키를 재사용한다.", "액세스 키를 정기적으로 회전하고, 마지막 사용 정보를 확인해 사용하지 않는 키는 제거한다.", "루트 사용자의 액세스 키를 사용한다.", "이 스크립트 전용 IAM 사용자를 만들고 백업 버킷에 대한 업로드 권한만 부여한다.", "액세스 키를 스크립트 소스 코드에 넣어 Git 저장소에 커밋한다."], "answer": [1, 3], "explain": "장기 자격 증명이 꼭 필요하면 용도 전용 IAM 사용자에 최소 권한만 주고, 액세스 키를 정기적으로 회전하며 쓰지 않는 키는 제거합니다. 키는 안전한 보관소에 저장해 로컬 자격 증명을 보호합니다.", "why": ["필요 이상의 권한이 노출됩니다.", "교재의 '액세스 키 회전' 모범 사례입니다.", "루트 액세스 키는 사용하지 않아야 합니다.", "용도별 자격 증명과 최소 권한을 적용합니다.", "저장소를 통해 자격 증명이 유출될 위험이 큽니다."], "tags": ["액세스 키", "최소 권한", "모범 사례"]}, {"id": "m3-046", "module": 3, "level": "saa", "pick": 2, "q": "IAM 사용자 Park에 대해 다음 정책이 적용됩니다. Park이 속한 그룹의 정책은 버킷 bucket-a의 객체(arn:aws:s3:::bucket-a/*)에 대한 s3:*를 허용합니다. Park에게 직접 연결된 정책은 같은 객체들에 대한 s3:DeleteObject를 명시적으로 거부합니다. bucket-b에 대해서는 어떤 정책(버킷 정책 포함)도 언급하지 않습니다. 옳은 설명을 고르시오.", "options": ["Park은 bucket-a의 객체를 삭제할 수 있다.", "Deny가 하나라도 있으므로 bucket-a에 대한 모든 작업이 거부된다.", "그룹 정책이 개인 정책보다 우선하므로 모든 작업이 허용된다.", "Park은 bucket-a에 객체를 업로드할 수 있다.", "Park은 bucket-b의 객체를 읽을 수 없다."], "answer": [3, 4], "explain": "정책 평가는 작업별로 이뤄집니다. 명시적 거부는 해당 작업에만 적용되고, 아무 정책도 허용하지 않은 작업은 기본(암시적) 거부입니다. '명시적 거부 > 명시적 허용 > 기본 거부'를 작업마다 대입해 보세요.", "why": ["명시적 거부가 그룹 정책의 허용보다 우선합니다.", "Deny는 지정한 작업(DeleteObject)에만 적용됩니다.", "연결 위치에 따른 우선순위는 없습니다.", "그룹 정책의 s3:*가 PutObject를 허용하고, 거부는 DeleteObject에만 적용됩니다.", "어떤 정책도 허용하지 않으므로 암시적 거부입니다."], "tags": ["IAM 정책", "정책 평가"]}, {"id": "m3-048", "module": 3, "level": "saa", "pick": 1, "q": "한 회사의 S3 버킷이 실수로 퍼블릭 읽기로 설정되어 고객 데이터가 외부에 노출되었습니다. AWS 공동 책임 모델에 따르면 이 사고를 예방할 책임은 누구에게 있습니까?", "options": ["데이터를 조회한 외부 사용자에게만 책임이 있다.", "고객. 고객 데이터와 리소스의 액세스 구성은 '클라우드 내부 보안'에 해당한다.", "AWS. S3는 관리형 서비스이므로 버킷 권한 설정도 AWS가 책임진다.", "AWS와 고객이 정확히 절반씩 책임진다."], "answer": [1], "explain": "AWS는 S3를 실행하는 인프라('클라우드 자체')를 보호하고, 고객은 그 위에 저장한 데이터와 접근 권한 구성('클라우드 내부')을 책임집니다. 사용하는 서비스가 관리형이어도 데이터와 권한 설정은 고객의 몫입니다.", "why": ["공동 책임 모델의 관점에서는 접근 설정을 잘못한 고객의 책임입니다.", "버킷 정책·액세스 설정은 고객이 선택하고 관리합니다.", "관리형 서비스라도 리소스 구성과 액세스 관리는 고객 책임입니다.", "책임은 영역별로 나뉘며, 이 영역은 고객 책임입니다."], "tags": ["공동 책임 모델", "S3"]}, {"id": "m3-101", "module": 3, "level": "basic", "pick": 1, "q": "특정 IAM 사용자 한 명에게만 직접 포함되어 그 사용자와 일대일 관계를 가지며, 그 사용자를 삭제하면 함께 삭제되는 정책을 무엇이라고 합니까?", "options": ["인라인 정책", "고객 관리형 정책", "AWS 관리형 정책", "리소스 기반 정책(버킷 정책)"], "answer": [0], "explain": "관리형 정책은 독립된 정책 객체라 여러 사용자·그룹·역할에 연결할 수 있고, 수정하면 연결된 모든 자격 증명에 반영됩니다. 인라인 정책은 하나의 자격 증명(사용자·그룹·역할)에 직접 포함된 정책으로, 그 자격 증명과 수명을 함께합니다.", "why": ["하나의 자격 증명에 직접 포함되어 일대일 관계를 가지며, 그 자격 증명을 삭제하면 함께 삭제됩니다.", "고객이 만든 독립 정책 객체로, 여러 사용자·그룹·역할에 재사용할 수 있습니다.", "AWS가 만들고 관리하는 독립 정책 객체로, 여러 자격 증명에 연결할 수 있습니다.", "리소스 기반 정책은 IAM 사용자가 아니라 S3 버킷 같은 리소스에 연결됩니다."], "tags": ["IAM 정책", "인라인 정책", "관리형 정책"]}, {"id": "m3-102", "module": 3, "level": "basic", "pick": 1, "q": "IAM 정책 문서의 \"Version\": \"2012-10-17\" 요소에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["정책을 처음 작성한 날짜로, 정책을 수정할 때마다 그날 날짜로 바꿔야 한다.", "정책을 연결할 수 있는 리전의 버전을 나타낸다.", "정책이 만료되는 날짜로, 이 날짜 이후에는 정책이 적용되지 않는다.", "정책 언어(문법)의 버전을 나타내며, 정책을 만든 날짜와는 관계가 없다."], "answer": [3], "explain": "Version은 정책 언어 버전을 지정하는 요소입니다. 현재 버전은 \"2012-10-17\"이며, 정책을 작성·수정한 날짜나 만료일이 아닙니다. 권한을 결정하는 핵심 요소는 Effect·Action·Resource입니다.", "why": ["정책 작성 날짜가 아니므로 수정할 때 바꾸지 않습니다.", "Version은 리전과 관계가 없습니다.", "IAM 정책에는 Version으로 정하는 만료일이 없습니다.", "정책 언어 버전이며 현재 버전은 2012-10-17입니다."], "tags": ["IAM 정책", "JSON"]}, {"id": "m3-103", "module": 3, "level": "saa", "pick": 1, "q": "데이터팀 IAM 그룹 'DataTeam'(10명)이 'team-data' 버킷의 객체를 읽을 수 있게 하려 합니다. 관리자가 버킷 정책의 Principal에 그룹 ARN(arn:aws:iam::123456789012:group/DataTeam)을 지정했더니 '잘못된 보안 주체' 오류로 정책이 저장되지 않았습니다. 버킷과 그룹은 같은 계정에 있습니다. 가장 적절한 해결 방법은 무엇입니까?", "options": ["버킷 정책의 Principal을 \"*\"로 바꿔 모든 사용자에게 읽기를 허용한다.", "데이터팀 전원이 함께 쓰는 IAM 사용자 하나를 만들어 버킷 정책의 Principal로 지정한다.", "IAM 그룹은 보안 주체가 될 수 없으므로, DataTeam 그룹에 해당 버킷 객체의 s3:GetObject를 허용하는 자격 증명 기반 정책을 연결한다.", "그룹 ARN 대신 그룹 이름만 Principal에 적는다."], "answer": [2], "explain": "IAM 그룹은 권한을 묶는 단위일 뿐 요청을 보내는 보안 주체가 아니므로, 리소스 기반 정책의 Principal로 지정할 수 없습니다. 같은 계정의 그룹에 권한을 주려면 그룹에 자격 증명 기반 정책을 연결하면 됩니다. 같은 계정에서는 IAM 정책의 허용만으로도 접근할 수 있습니다.", "why": ["버킷이 인터넷 전체에 공개되어 최소 권한을 크게 위반합니다.", "계정을 공유하면 개인별 추적 가능성을 잃어 모범 사례에 어긋납니다.", "그룹에 정책을 연결하면 멤버 전원이 권한을 받고, 인원이 바뀌어도 그룹 멤버십만 바꾸면 됩니다.", "그룹은 이름이든 ARN이든 Principal로 지정할 수 없습니다."], "tags": ["IAM", "그룹", "리소스 기반 정책"]}, {"id": "m3-104", "module": 3, "level": "saa", "pick": 2, "q": "개발자가 실수로 IAM 사용자 'deploy-bot'의 액세스 키 ID와 비밀 액세스 키를 공개 Git 저장소에 커밋했습니다. 이 키는 AWS CLI로 배포 작업을 하는 데 쓰입니다. 즉시 해야 할 조치를 고르시오.", "options": ["deploy-bot 사용자의 콘솔 로그인 암호를 변경한다.", "노출된 액세스 키를 즉시 비활성화·삭제하고, 새 액세스 키를 발급해 배포 작업에 교체 적용한다.", "Git 저장소에서 해당 커밋을 삭제했다면 키를 그대로 계속 사용한다.", "AWS CloudTrail에서 노출된 액세스 키로 수행된 API 호출을 확인해 무단 활동이 있었는지 조사한다.", "deploy-bot 사용자에 MFA 디바이스를 등록한다."], "answer": [1, 3], "explain": "액세스 키는 콘솔 암호와 별개의 자격 증명이라, 노출되면 누구나 CLI·API로 그 권한을 쓸 수 있습니다. 먼저 노출된 키를 비활성화·삭제하고 새 키로 교체(회전)한 뒤, CloudTrail로 그 키가 수행한 API 호출을 조사해 피해 범위를 파악합니다.", "why": ["콘솔 암호를 바꿔도 액세스 키는 그대로 유효합니다.", "노출된 키를 무효화하고 새 키로 교체하는 것이 가장 먼저 할 일입니다.", "공개 저장소에 올라간 키는 이미 복제되었을 수 있어, 커밋을 지워도 키는 여전히 위험합니다.", "CloudTrail은 API 호출을 기록하므로 노출된 키로 무엇을 했는지 감사할 수 있습니다.", "MFA는 정책에서 요구하지 않는 한 액세스 키로 하는 API 호출을 막지 못하며, 이미 노출된 키를 무효화하지도 않습니다."], "tags": ["액세스 키", "CloudTrail", "모범 사례"]}, {"id": "m3-105", "module": 3, "level": "saa", "pick": 1, "q": "사용자 Choi에게 다음 정책을 연결했습니다. Choi는 'report-bucket'의 객체를 내려받을 수는 있지만, 버킷의 객체 목록을 조회(aws s3 ls s3://report-bucket)하면 AccessDenied 오류가 발생합니다. 원인과 해결책으로 가장 적절한 것은 무엇입니까?\n\n{ \"Effect\": \"Allow\",\n  \"Action\": [\"s3:GetObject\", \"s3:ListBucket\"],\n  \"Resource\": \"arn:aws:s3:::report-bucket/*\" }", "options": ["s3:ListBucket이라는 작업은 없으므로 Action을 s3:*로 바꿔야 한다.", "s3:ListBucket은 버킷에 대한 작업이므로 Resource에 버킷 ARN(arn:aws:s3:::report-bucket)을 추가해야 한다.", "Version 요소가 없어 정책 전체가 무시되었다.", "객체 목록 조회는 루트 사용자만 할 수 있다.", "Resource를 \"*\"로 바꿔 모든 버킷에 대한 작업을 허용해야 한다."], "answer": [1], "explain": "S3 작업은 적용되는 리소스 수준이 다릅니다. s3:GetObject 같은 객체 작업은 객체 ARN(버킷/키)에, s3:ListBucket 같은 버킷 작업은 버킷 ARN에 적용됩니다. 이 정책은 객체 ARN만 지정했기 때문에 GetObject만 일치하고 ListBucket은 허용되지 않습니다. 버킷 ARN을 Resource에 추가하면 최소 권한을 지키면서 해결됩니다.", "why": ["s3:ListBucket은 버킷의 객체 목록을 조회하는 작업이며, s3:*는 과도한 권한입니다.", "버킷 작업에 맞는 버킷 ARN을 추가하면 필요한 권한만 정확히 허용됩니다.", "GetObject가 동작하는 것으로 보아 정책은 적용되고 있습니다. 문제는 Resource 범위입니다.", "목록 조회는 IAM 정책으로 허용할 수 있는 일반 작업입니다.", "다른 버킷까지 접근하게 되어 최소 권한을 위반합니다."], "tags": ["IAM 정책", "ARN", "최소 권한"]}, {"id": "m3-106", "module": 3, "level": "saa", "pick": 1, "q": "보안팀이 신입 운영자 Jung이 실수로 인스턴스를 종료하지 못하도록, Jung의 IAM 사용자에게 다음 정책 하나만 연결했습니다. 그런데 Jung은 EC2 인스턴스 목록 조회(ec2:DescribeInstances)를 포함해 어떤 EC2 작업도 할 수 없습니다. 그 이유로 가장 적절한 것은 무엇입니까?\n\n{ \"Effect\": \"Deny\", \"Action\": \"ec2:TerminateInstances\", \"Resource\": \"*\" }", "options": ["Deny 스테이트먼트가 하나라도 있으면 그 서비스의 모든 작업이 거부된다.", "ec2:TerminateInstances를 거부하면 관련된 조회 작업도 자동으로 함께 거부된다.", "EC2 인스턴스 목록 조회는 루트 사용자만 할 수 있다.", "이 정책은 종료만 거부할 뿐 어떤 작업도 허용하지 않으므로, 나머지 EC2 작업에는 기본(암시적) 거부가 적용된다.", "Resource가 \"*\"인 정책은 잘못된 정책이라 모든 요청이 거부된다."], "answer": [3], "explain": "IAM의 기본값은 암시적 거부이고, Deny만 있는 정책은 어떤 작업도 새로 허용하지 않습니다. Jung이 일하려면 필요한 EC2 작업을 Allow하는 정책을 함께 연결해야 합니다. 그러면 Allow가 다른 작업을 허용하고, 이 명시적 Deny가 종료만 막습니다.", "why": ["명시적 Deny는 그 스테이트먼트에 지정된 작업(여기서는 종료)에만 적용됩니다.", "IAM은 작업별로 평가하며, 종료를 거부한다고 다른 작업이 함께 거부되지는 않습니다.", "목록 조회는 IAM 정책으로 허용할 수 있는 일반 작업입니다.", "Allow가 하나도 없으면 기본 거부가 적용됩니다. 필요한 작업을 Allow하는 정책을 함께 연결해야 합니다.", "Resource \"*\"는 모든 리소스를 뜻하는 올바른 표기입니다."], "tags": ["IAM 정책", "정책 평가", "명시적 거부"]}, {"id": "m3-107", "module": 3, "level": "saa", "pick": 1, "q": "보안 감사에서 콘솔을 사용하는 IAM 사용자 다수가 숫자 6자리처럼 짧고 단순한 암호를 쓰고, 같은 암호를 수년째 바꾸지 않는다는 지적을 받았습니다. 관리자가 사용자 수백 명에게 일관된 규칙을 적용하려 할 때 가장 적절한 방법은 무엇입니까?", "options": ["IAM 계정 암호 정책에서 최소 길이, 문자 종류(복잡성), 암호 만료, 이전 암호 재사용 방지 규칙을 설정한다.", "모든 사용자에게 같은 강력한 암호를 정해 이메일로 공지한다.", "콘솔 사용자를 모두 삭제하고 모든 작업을 루트 사용자로 수행한다.", "사용자마다 액세스 키를 발급하고, 콘솔 대신 액세스 키로 로그인하게 한다."], "answer": [0], "explain": "교재의 액세스 보안 모범 사례에는 강력하고 복잡한 암호 사용이 포함됩니다. IAM 계정 암호 정책을 설정하면 계정의 모든 IAM 사용자에게 최소 길이·복잡성·만료·재사용 방지 같은 규칙을 일관되게 강제할 수 있습니다. 여기에 MFA를 더하면 더 안전합니다.", "why": ["계정의 모든 IAM 사용자에게 규칙을 일관되게 강제하는 방법입니다.", "같은 암호를 공유하면 개인별 추적이 불가능하고 노출 위험도 커집니다.", "루트 사용자는 루트만 할 수 있는 작업에만 써야 합니다.", "액세스 키는 CLI·SDK용 자격 증명이며, 콘솔 로그인에는 사용자 이름과 암호가 필요합니다."], "tags": ["자격 증명", "모범 사례", "암호 정책"]}, {"id": "m3-108", "module": 3, "level": "saa", "pick": 1, "q": "한 회사는 S3 버킷의 모든 객체에 서버측 암호화(SSE-S3)를 적용해 두었으므로 데이터가 안전하다고 생각했습니다. 그런데 업무와 관계없는 인턴의 IAM 사용자에게 실수로 s3:*가 허용되어 있었고, 이 인턴이 내려받은 파일은 평문으로 그대로 읽혔습니다. 이에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["SSE-S3 암호화가 실패한 것이므로 AWS의 책임이다.", "서버측 암호화는 저장된 데이터를 보호하지만 권한 있는 요청에는 S3가 자동으로 복호화해 주므로, 누가 접근할 수 있는지는 IAM 정책·버킷 정책으로 최소 권한을 적용해 통제해야 한다.", "HTTPS(TLS)로 내려받았기 때문에 복호화된 것이므로, HTTP로만 접근하게 하면 된다.", "SSE-S3를 한 번 더 적용(이중 암호화)하면 권한 있는 사용자도 읽을 수 없게 된다."], "answer": [1], "explain": "암호화는 데이터를 읽을 수 없게 보호하는 수단이지만 접근 권한 설계를 대신하지 않습니다. 서버측 암호화에서는 요청이 권한 검사를 통과하면 S3가 데이터를 복호화해 돌려줍니다. 따라서 IAM 정책과 버킷 정책으로 최소 권한을 적용해야 하며, 데이터와 접근 구성은 공동 책임 모델에서 고객 책임입니다.", "why": ["암호화는 정상적으로 동작했습니다. IAM 권한 구성은 고객 책임('클라우드 내부의 보안')입니다.", "암호화와 권한 통제는 함께 필요합니다. 과도한 s3:* 허용을 최소 권한으로 줄여야 합니다.", "TLS는 전송 중 데이터를 보호할 뿐이며, HTTP로 바꾸면 전송 중 보호까지 잃습니다.", "권한 있는 요청에는 복호화가 이루어지므로 같은 문제가 반복됩니다. 접근 통제가 필요합니다."], "tags": ["암호화", "서버측 암호화", "S3", "최소 권한"]}, {"id": "m3-109", "module": 3, "level": "basic", "pick": 2, "q": "같은 AWS 계정에서, EC2 인스턴스에 연결된 IAM 역할 'app-role'의 자격 증명 기반 정책에는 S3 관련 권한이 전혀 없습니다. 버킷 'shared-assets'의 버킷 정책은 Principal로 이 역할(arn:aws:iam::123456789012:role/app-role)을 지정해 s3:GetObject를 허용합니다. s3:DeleteObject는 어떤 정책에서도 언급하지 않습니다. 옳은 설명을 고르시오.", "options": ["역할의 자격 증명 기반 정책이 S3를 허용하지 않으므로 GetObject도 거부된다.", "app-role을 사용하는 애플리케이션은 shared-assets의 객체를 읽을(GetObject) 수 있다.", "DeleteObject는 어떤 정책에서도 거부하지 않았으므로 허용된다.", "버킷 정책의 Principal에는 IAM 역할을 지정할 수 없으므로 이 정책은 무효다.", "app-role을 사용하는 애플리케이션은 shared-assets의 객체를 삭제(DeleteObject)할 수 없다."], "answer": [1, 4], "explain": "같은 계정에서는 자격 증명 기반 정책과 리소스 기반 정책 중 어느 한쪽에라도 명시적 허용이 있고 명시적 거부가 없으면 요청이 허용됩니다. 버킷 정책이 역할에 GetObject를 허용하므로 읽을 수 있습니다. DeleteObject는 어디서도 허용하지 않았으므로 기본(암시적) 거부입니다.", "why": ["같은 계정에서는 버킷 정책의 허용만으로도 충분합니다.", "버킷 정책이 이 역할에 GetObject를 명시적으로 허용하고, 거부는 없습니다.", "언급하지 않은 작업은 허용이 아니라 암시적 거부입니다.", "리소스 기반 정책의 Principal에는 계정, IAM 사용자, IAM 역할 등을 지정할 수 있습니다.", "어느 정책에도 DeleteObject 허용이 없으므로 암시적 거부됩니다."], "tags": ["IAM 정책", "정책 평가", "리소스 기반 정책", "역할"]}, {"id": "m3-110", "module": 3, "level": "saa", "pick": 1, "q": "운영팀 5명이 'ops-admin'이라는 IAM 사용자 하나를 함께 사용하고 있습니다. 최근 중요한 리소스가 삭제되었는데, CloudTrail 로그에는 'ops-admin'만 기록되어 실제로 누가 삭제했는지 알 수 없었습니다. 앞으로 이런 일이 생기지 않게 하는 가장 적절한 조치는 무엇입니까?", "options": ["CloudTrail을 비활성화해 로그 저장 비용을 줄인다.", "공유 계정의 암호를 매주 변경한다.", "운영팀원마다 개별 자격 증명(IAM 사용자 또는 IAM Identity Center 사용자)을 발급해, CloudTrail에 실제 작업자가 기록되게 한다.", "MFA 디바이스 하나를 팀원 모두가 돌려 가며 사용한다.", "ops-admin 사용자의 권한을 줄여 삭제 작업만 막는다."], "answer": [2], "explain": "여러 사람이 사용자 하나를 공유하면 CloudTrail에는 그 사용자 이름만 남아 개인 책임이 사라지고, 보안 원칙의 추적 가능성을 지킬 수 없습니다. 사람마다 자격 증명이 따로 있어야 누가 어떤 API를 호출했는지 기록됩니다.", "why": ["기록이 아예 사라져 추적 가능성이 완전히 없어집니다.", "암호를 바꿔도 여전히 여러 사람이 같은 사용자를 쓰므로 누가 작업했는지 구분할 수 없습니다.", "개인별 자격 증명이 있어야 CloudTrail에서 작업자를 식별할 수 있습니다.", "MFA도 개인별이어야 하며, 공유하면 책임 추적이 불가능합니다.", "권한을 줄여도 공유 계정이라 다른 작업의 작업자는 여전히 구분할 수 없습니다."], "tags": ["IAM", "CloudTrail", "추적 가능성"]}, {"id": "m4-001", "module": 4, "level": "basic", "pick": 1, "q": "Amazon S3는 블록·파일·객체 스토리지 중 어떤 유형의 스토리지인가?", "options": ["파일 스토리지", "인스턴스에 직접 연결된 임시 블록 스토리지", "블록 스토리지", "객체 스토리지"], "answer": [3], "explain": "S3는 데이터를 '데이터 + 메타데이터 + 키'로 이루어진 객체 단위로 저장하는 객체 스토리지입니다. 블록 스토리지는 EBS, 파일 스토리지는 EFS·FSx가 대표적입니다.", "why": ["파일 스토리지는 EFS·FSx처럼 디렉터리 계층으로 파일을 공유합니다.", "인스턴스 스토어에 대한 설명으로, S3와 무관합니다.", "블록 스토리지는 EBS·인스턴스 스토어처럼 디스크를 고정 크기 블록으로 다룹니다.", "정답. S3는 객체(데이터+메타데이터+키)를 버킷에 저장합니다."], "tags": ["S3", "스토리지 유형", "지식확인"]}, {"id": "m4-002", "module": 4, "level": "basic", "pick": 2, "q": "Amazon S3 객체를 구성하는 요소에 해당하는 것을 고르시오.", "options": ["인스턴스 프로파일", "블록 디바이스 매핑", "탑재 대상(mount target)", "키(key)", "메타데이터"], "answer": [3, 4], "explain": "S3 객체는 키(이름), 버전 ID, 값(데이터), 메타데이터 등으로 구성됩니다. 키는 버킷 안에서 객체를 식별하는 이름이고, 메타데이터는 객체를 설명하는 이름-값 쌍입니다.", "why": ["인스턴스 프로파일은 EC2에 IAM 역할을 전달하는 수단입니다.", "블록 디바이스 매핑은 AMI의 구성 요소입니다.", "탑재 대상은 Amazon EFS를 VPC에 연결하는 엔드포인트입니다.", "정답. 키는 버킷 안에서 객체를 고유하게 식별하는 이름입니다.", "정답. 시스템 메타데이터와 사용자 정의 메타데이터가 객체에 포함됩니다."], "tags": ["S3", "객체", "지식확인"]}, {"id": "m4-003", "module": 4, "level": "basic", "pick": 2, "q": "교재에서 설명하는 S3 Standard 스토리지 등급의 특징으로 옳은 것을 고르시오.", "options": ["데이터를 단일 가용 영역에만 저장함", "설계 내구성 99.999999999%(11개의 9)", "가용성 99.99%로 설계됨", "검색된 GB당 검색 요금이 부과됨", "최소 30일의 스토리지 기간 요금이 적용됨"], "answer": [1, 2], "explain": "S3 Standard는 11개의 9 내구성과 99.99% 가용성으로 설계되었고, 최소 3개 AZ에 데이터를 저장합니다. 최소 기간 요금이나 검색 요금이 없어 자주 접근하는 데이터에 적합합니다.", "why": ["단일 AZ 저장은 S3 One Zone-IA의 특징입니다. Standard는 3개 이상의 AZ에 저장합니다.", "정답. 내구성은 데이터를 잃지 않는 능력으로, 11개의 9로 설계되었습니다.", "정답. 가용성은 필요할 때 접근할 수 있는 정도로, 99.99%입니다.", "검색 요금은 IA 및 Glacier 계열 등급에 부과됩니다. Standard에는 없습니다.", "최소 30일 요금은 Standard-IA·One Zone-IA에 적용됩니다."], "tags": ["S3", "내구성", "가용성", "지식확인"]}, {"id": "m4-004", "module": 4, "level": "basic", "pick": 1, "q": "S3 콘솔에서 'photos/2022/'처럼 폴더가 있는 것처럼 보이는 구조에 대한 설명으로 옳은 것은?", "options": ["S3가 실제 디렉터리 계층을 만들어 파일 시스템처럼 저장한다", "폴더는 EBS 볼륨에 저장되고 객체만 S3에 저장된다", "폴더마다 별도의 버킷이 자동으로 생성된다", "객체 키의 접두사(prefix)와 구분 기호(/)를 이용해 논리적으로 묶어 보여 주는 것이다"], "answer": [3], "explain": "S3의 내부 구조는 평면(flat)이며, 키 이름에 포함된 접두사와 '/' 구분 기호를 콘솔이 폴더처럼 표시할 뿐입니다. 예를 들어 photos/2022/cat.jpg의 키 전체가 객체의 이름입니다.", "why": ["S3는 실제 디렉터리 계층을 가진 파일 시스템이 아닙니다.", "S3는 EBS와 무관한 독립적인 객체 스토리지 서비스입니다.", "버킷은 사용자가 만들며, 폴더가 버킷을 생성하지 않습니다.", "정답. 접두사로 객체를 논리적으로 그룹화합니다."], "tags": ["S3", "접두사", "지식확인"]}, {"id": "m4-005", "module": 4, "level": "basic", "pick": 1, "q": "교재 기준으로 AWS Management Console을 사용해 Amazon S3에 업로드할 수 있는 단일 파일의 최대 크기는?", "options": ["5GB", "160GB", "5TB", "제한 없음"], "answer": [1], "explain": "교재는 콘솔(마법사·끌어서 놓기)로 업로드할 수 있는 최대 크기를 160GB로 설명합니다. 그보다 큰 파일은 AWS CLI, SDK, REST API(멀티파트 업로드)를 사용합니다.", "why": ["5GB는 단일 PUT 작업으로 업로드할 수 있는 크기 한도로 자주 언급되는 값입니다. 콘솔 한도는 아닙니다.", "정답. 콘솔 업로드 한도는 160GB입니다.", "5TB는 교재에서 설명하는 단일 객체 최대 크기입니다.", "콘솔 업로드에는 크기 제한이 있습니다."], "tags": ["S3", "업로드", "지식확인"]}, {"id": "m4-006", "module": 4, "level": "basic", "pick": 3, "q": "Amazon S3 멀티파트 업로드의 이점으로 옳은 것을 고르시오.", "options": ["객체를 자동으로 더 저렴한 스토리지 등급으로 이동한다", "업로드를 일시 중지했다가 다시 재개할 수 있다", "네트워크 오류가 나면 실패한 파트만 다시 업로드하면 된다", "파트를 병렬로 업로드해 처리량을 높일 수 있다", "엣지 로케이션을 거쳐 장거리 전송 경로를 최적화한다"], "answer": [1, 2, 3], "explain": "멀티파트 업로드는 큰 객체를 여러 파트로 나눠 독립적으로 업로드하는 방식입니다. 병렬 전송으로 처리량이 높아지고, 실패한 파트만 재전송하며, 일시 중지·재개가 가능합니다.", "why": ["등급 이동은 수명 주기 규칙이나 Intelligent-Tiering의 기능입니다.", "정답. 파트 단위이므로 중간에 멈췄다가 이어서 올릴 수 있습니다.", "정답. 전체 파일을 처음부터 다시 보낼 필요가 없습니다.", "정답. 파트를 동시에 올려 전체 처리량을 높입니다.", "엣지 로케이션을 이용하는 것은 S3 Transfer Acceleration입니다."], "tags": ["S3", "멀티파트 업로드", "지식확인"]}, {"id": "m4-007", "module": 4, "level": "basic", "pick": 1, "q": "교재에서 멀티파트 업로드 사용을 고려하도록 권장하는 객체 크기 기준은?", "options": ["5MB 이상", "100MB 이상", "5GB 이상", "160GB 이상"], "answer": [1], "explain": "교재는 객체 크기가 100MB 이상이면 단일 업로드 대신 멀티파트 업로드 사용을 고려하라고 권장합니다.", "why": ["5MB는 멀티파트의 최소 파트 크기로 알려진 값이지, 권장 기준이 아닙니다.", "정답. 100MB 이상 객체에 멀티파트 업로드를 권장합니다.", "5GB는 단일 PUT 업로드의 한도로 알려진 값입니다. 권장 기준은 이보다 훨씬 작습니다.", "160GB는 콘솔 업로드 한도입니다."], "tags": ["S3", "멀티파트 업로드", "지식확인"]}, {"id": "m4-008", "module": 4, "level": "basic", "pick": 1, "q": "Amazon S3 Transfer Acceleration이 원거리 클라이언트의 업로드 속도를 높이는 방식으로 옳은 것은?", "options": ["버킷을 클라이언트와 가장 가까운 리전으로 자동 이동한다", "객체를 압축해 전송량을 줄인다", "객체를 여러 파트로 나눠 병렬로 업로드한다", "Amazon CloudFront의 전 세계 엣지 로케이션으로 데이터를 받은 뒤 AWS 백본 네트워크로 버킷까지 전송한다"], "answer": [3], "explain": "Transfer Acceleration은 클라이언트와 가까운 CloudFront 엣지 로케이션으로 데이터를 받은 뒤, 최적화된 AWS 네트워크 경로로 S3 버킷에 전달합니다. 버킷과 멀리 떨어진 사용자가 큰 파일을 전송할 때 효과적입니다.", "why": ["버킷은 생성한 리전에 머물며 자동으로 이동하지 않습니다.", "Transfer Acceleration은 데이터를 압축하는 기능이 아닙니다.", "멀티파트 업로드에 대한 설명입니다. 두 기능은 함께 쓸 수 있지만 다른 기능입니다.", "정답. 엣지 로케이션과 AWS 백본 네트워크를 활용합니다."], "tags": ["S3", "Transfer Acceleration", "지식확인"]}, {"id": "m4-009", "module": 4, "level": "basic", "pick": 3, "q": "AWS Transfer Family가 지원하는 파일 전송 프로토콜을 고르시오.", "options": ["SFTP(SSH File Transfer Protocol)", "FTPS(File Transfer Protocol Secure)", "iSCSI", "AS2(Applicability Statement 2)", "SMB(Server Message Block)"], "answer": [0, 1, 3], "explain": "AWS Transfer Family는 SFTP, FTPS, FTP, AS2 프로토콜로 Amazon S3나 Amazon EFS에 파일을 주고받게 해 주는 완전관리형 서비스입니다. 기존 파일 전송 워크플로를 바꾸지 않고 AWS 스토리지로 옮길 때 사용합니다.", "why": ["정답. SFTP를 지원합니다.", "정답. FTPS를 지원합니다.", "iSCSI는 블록 스토리지 프로토콜로 Transfer Family가 지원하지 않습니다.", "정답. 기업 간 데이터 교환용 AS2를 지원합니다.", "SMB는 Windows 파일 공유 프로토콜로, FSx for Windows File Server가 사용합니다."], "tags": ["S3", "Transfer Family", "지식확인"]}, {"id": "m4-010", "module": 4, "level": "basic", "pick": 2, "q": "최소 스토리지 기간 요금이 90일인 S3 스토리지 등급을 고르시오.", "options": ["S3 Standard-IA", "S3 Glacier Instant Retrieval", "S3 One Zone-IA", "S3 Glacier Flexible Retrieval", "S3 Glacier Deep Archive", "S3 Intelligent-Tiering"], "answer": [1, 3], "explain": "최소 스토리지 기간은 Standard-IA·One Zone-IA 30일, Glacier Instant Retrieval·Glacier Flexible Retrieval 90일, Glacier Deep Archive 180일입니다. 기간 전에 삭제·전환하면 남은 기간만큼 요금이 부과됩니다.", "why": ["Standard-IA는 30일입니다.", "정답. Glacier Instant Retrieval은 90일입니다.", "One Zone-IA는 30일입니다.", "정답. Glacier Flexible Retrieval은 90일입니다.", "Glacier Deep Archive는 180일입니다.", "Intelligent-Tiering은 교재 표 기준 최소 기간 요금이 없습니다."], "tags": ["S3", "스토리지 등급", "최소 기간", "지식확인"]}, {"id": "m4-012", "module": 4, "level": "basic", "pick": 1, "q": "접근 패턴을 알 수 없거나 자주 바뀌는 데이터에 대해, 성능 영향이나 운영 오버헤드 없이 접근 빈도에 따라 객체를 자동으로 가장 비용 효율적인 계층으로 옮겨 주는 S3 스토리지 등급은?", "options": ["S3 Intelligent-Tiering", "S3 Glacier Flexible Retrieval", "S3 One Zone-IA", "S3 Standard-IA"], "answer": [0], "explain": "S3 Intelligent-Tiering은 객체 접근을 모니터링해 자주·드물게 접근하는 계층 사이로 자동 이동합니다. 소액의 모니터링·자동화 요금이 있지만 검색 요금은 없습니다.", "why": ["정답. 접근 패턴이 바뀌거나 예측하기 어려울 때 사용합니다.", "Glacier Flexible Retrieval은 아카이브 등급으로 즉시 접근이 안 됩니다.", "One Zone-IA는 단일 AZ에 저장하는 저빈도 등급이며 자동 계층화 기능이 없습니다.", "Standard-IA는 접근 빈도가 낮다는 것을 미리 알 때 쓰며 자동 이동하지 않습니다."], "tags": ["S3", "Intelligent-Tiering", "지식확인"]}, {"id": "m4-013", "module": 4, "level": "basic", "pick": 2, "q": "S3 수명 주기 구성 규칙에서 정의할 수 있는 두 가지 작업 유형을 고르시오.", "options": ["암호화(Encryption) 작업", "전환(Transition) 작업", "복제(Replication) 작업", "만료(Expiration) 작업", "가속(Acceleration) 작업"], "answer": [1, 3], "explain": "수명 주기 규칙은 객체를 다른 스토리지 등급으로 옮기는 전환 작업과, 정한 기간이 지나면 객체를 삭제하는 만료 작업으로 구성됩니다. 이를 통해 저장 비용을 자동으로 줄일 수 있습니다.", "why": ["암호화는 기본 암호화 설정 등으로 구성합니다.", "정답. 예: 30일 후 Standard-IA로 이동.", "복제는 별도의 복제 규칙으로 구성하며 수명 주기 작업 유형이 아닙니다.", "정답. 예: 365일 후 객체 삭제.", "가속은 Transfer Acceleration 설정입니다."], "tags": ["S3", "수명 주기", "지식확인"]}, {"id": "m4-014", "module": 4, "level": "basic", "pick": 1, "q": "한 번 버전 관리를 활성화한 S3 버킷에 대한 설명으로 옳은 것은?", "options": ["버전 관리를 일시 중지할 수는 있지만 '미사용' 상태로 되돌릴 수는 없다", "언제든 '버전 관리 미사용' 상태로 되돌릴 수 있다", "버전 관리를 일시 중지하면 기존의 이전 버전이 모두 삭제된다", "버전 관리는 버킷이 아니라 리전 단위로 설정된다"], "answer": [0], "explain": "S3 버킷의 버전 관리 상태는 미사용(기본값), 활성화, 일시 중지 세 가지입니다. 활성화한 후에는 일시 중지만 가능하며, 일시 중지해도 이미 저장된 버전은 그대로 남습니다.", "why": ["정답. 활성화 → 일시 중지만 가능합니다.", "활성화한 버킷은 미사용 상태로 돌아갈 수 없습니다.", "일시 중지는 새 버전 생성만 멈출 뿐 기존 버전을 삭제하지 않습니다.", "버전 관리는 버킷 단위 설정입니다."], "tags": ["S3", "버전 관리", "지식확인"]}, {"id": "m4-015", "module": 4, "level": "basic", "pick": 2, "q": "버전 관리가 활성화된 버킷에서 버전 ID를 지정하지 않고 객체를 삭제(DELETE)했을 때의 결과로 옳은 것을 고르시오.", "options": ["버킷의 버전 관리가 자동으로 일시 중지된다", "삭제 마커(delete marker)가 생성되어 현재 버전이 된다", "이전 버전은 버전 ID를 지정하면 여전히 조회할 수 있다", "객체의 모든 버전이 즉시 영구 삭제된다", "객체가 자동으로 S3 Glacier로 이동한다"], "answer": [1, 2], "explain": "버전 ID 없이 삭제하면 S3는 삭제 마커를 추가하고, 일반 GET 요청에는 404 Not Found를 돌려줍니다. 하지만 이전 버전은 남아 있어 버전 ID로 조회하거나 삭제 마커를 지워 복구할 수 있습니다.", "why": ["삭제 작업이 버킷 설정을 바꾸지 않습니다.", "정답. 삭제 마커가 현재 버전이 됩니다.", "정답. 이전 버전 데이터는 그대로 보존됩니다.", "영구 삭제는 특정 버전 ID를 지정해 삭제할 때만 일어납니다.", "삭제 작업은 스토리지 등급을 바꾸지 않습니다."], "tags": ["S3", "버전 관리", "삭제 마커", "지식확인"]}, {"id": "m4-016", "module": 4, "level": "basic", "pick": 1, "q": "Amazon S3의 데이터 일관성 모델에 대한 설명으로 옳은 것은?", "options": ["여러 객체를 하나로 묶는 트랜잭션을 지원한다", "PUT·DELETE가 성공한 직후의 읽기와 목록 조회에 변경 결과가 반영되는 강력한 쓰기 후 읽기 일관성을 제공한다", "모든 작업이 최종 일관성만 제공하므로 쓰기 직후에는 이전 데이터가 보일 수 있다", "새 객체 PUT은 강력한 일관성이지만 덮어쓰기와 삭제는 최종 일관성이다"], "answer": [1], "explain": "S3는 모든 객체의 쓰기·덮어쓰기·삭제에 대해 강력한 쓰기 후 읽기 일관성을 자동으로 제공합니다. 다만 여러 객체를 묶는 데이터베이스식 트랜잭션을 뜻하지는 않습니다.", "why": ["S3는 여러 객체를 묶는 트랜잭션을 제공하지 않습니다.", "정답. 강력한 쓰기 후 읽기 일관성입니다.", "과거(2020년 이전)의 모델에 대한 설명으로 현재는 맞지 않습니다.", "현재 S3는 덮어쓰기와 삭제에도 강력한 일관성을 제공합니다."], "tags": ["S3", "데이터 일관성", "지식확인"]}, {"id": "m4-017", "module": 4, "level": "basic", "pick": 1, "q": "새로 업로드되는 S3 객체에 기본으로 적용되는 암호화 방식은?", "options": ["AWS KMS 키를 사용한 서버 측 암호화(SSE-KMS)", "암호화가 적용되지 않는다", "고객 제공 키를 사용한 서버 측 암호화(SSE-C)", "Amazon S3 관리형 키를 사용한 서버 측 암호화(SSE-S3)"], "answer": [3], "explain": "S3는 모든 버킷에 기본 암호화가 설정되어 있어, 별도 지정이 없으면 새 객체를 SSE-S3로 자동 암호화합니다. 키 사용 감사나 세밀한 키 제어가 필요하면 SSE-KMS를 선택할 수 있습니다.", "why": ["SSE-KMS는 사용자가 선택해서 설정하는 옵션입니다.", "현재 S3는 새 객체를 기본으로 암호화합니다.", "SSE-C는 요청마다 고객이 키를 제공해야 하는 옵션입니다.", "정답. 교재의 기본 구성은 SSE-S3입니다."], "tags": ["S3", "암호화", "지식확인"]}, {"id": "m4-018", "module": 4, "level": "basic", "pick": 1, "q": "S3 서버 측 암호화 옵션 중, 고객이 요청마다 자신의 암호화 키를 함께 보내고 AWS는 그 키를 저장하지 않는 방식은?", "options": ["SSE-C", "SSE-KMS", "DSSE-KMS", "SSE-S3"], "answer": [0], "explain": "SSE-C(고객 제공 키)는 고객이 업로드·다운로드 요청마다 키를 제공하고, S3는 그 키로 암호화·복호화만 수행한 뒤 키를 저장하지 않습니다. 키를 직접 관리해야 하므로 운영 부담이 큽니다.", "why": ["정답. 고객 제공 키 방식입니다.", "SSE-KMS는 AWS KMS에 저장된 키를 사용합니다.", "DSSE-KMS는 KMS 키로 두 겹(이중 계층) 암호화를 적용합니다.", "SSE-S3는 S3가 키를 생성·관리합니다."], "tags": ["S3", "암호화", "SSE-C", "지식확인"]}, {"id": "m4-020", "module": 4, "level": "basic", "pick": 1, "q": "S3의 CORS(Cross-Origin Resource Sharing) 구성이 하는 일로 옳은 것은?", "options": ["비공개 객체에 대한 읽기 권한을 익명 사용자에게 부여한다", "한 도메인에서 로드된 웹 페이지(브라우저)가 다른 도메인의 S3 리소스를 요청할 수 있도록 허용할 출처와 HTTP 메서드를 정의한다", "엣지 로케이션을 통해 업로드 속도를 높인다", "다른 리전의 버킷으로 객체를 자동 복제한다"], "answer": [1], "explain": "CORS는 브라우저가 다른 출처(origin)의 리소스를 사용할 수 있는지를 정하는 규칙입니다. CORS를 허용해도 버킷·객체의 접근 권한이 자동으로 생기지는 않으므로 권한은 정책으로 따로 관리합니다.", "why": ["CORS는 권한을 부여하지 않습니다. 권한은 버킷 정책·IAM 정책으로 관리합니다.", "정답. AllowedOrigin, AllowedMethod 등을 정의합니다.", "Transfer Acceleration에 대한 설명입니다.", "리전 간 복제는 복제(Replication) 규칙의 기능입니다."], "tags": ["S3", "CORS", "지식확인"]}, {"id": "m4-021", "module": 4, "level": "basic", "pick": 3, "q": "교재에서 S3 버킷의 리전을 선택할 때 고려하도록 제시한 사항을 고르시오.", "options": ["버킷 이름의 글자 수", "데이터 프라이버시 법률 및 규정(데이터 주권)", "리전별 서비스 및 기능 가용성", "사용자와 데이터 간 근접성(지연 시간)", "해당 리전 가용 영역 이름의 알파벳 순서"], "answer": [1, 2, 3], "explain": "교재는 리전 선택 시 데이터 프라이버시 법규, 사용자 근접성, 서비스·기능 가용성, 비용 효율성의 네 가지를 고려하라고 설명합니다.", "why": ["버킷 이름 길이는 리전 선택과 관계없습니다.", "정답. 데이터를 해외에 저장할 수 있는지 등 규정을 확인합니다.", "정답. 모든 서비스가 모든 리전에 있는 것은 아닙니다.", "정답. 사용자와 가까운 리전이 지연 시간을 줄입니다.", "AZ 이름 순서는 고려 사항이 아닙니다."], "tags": ["S3", "리전 선택", "지식확인"]}, {"id": "m4-022", "module": 4, "level": "basic", "pick": 1, "q": "Amazon S3 Inventory에 대한 설명으로 옳은 것은?", "options": ["접근 빈도에 따라 객체를 자동으로 다른 스토리지 등급으로 옮긴다", "객체를 원거리 사용자에게 엣지 로케이션에서 캐시해 제공한다", "버킷의 객체 목록과 암호화·복제 상태 등 메타데이터를 일별 또는 주별로 CSV·ORC·Parquet 파일로 생성한다", "실수로 삭제된 객체를 이전 버전으로 복구한다"], "answer": [2], "explain": "S3 Inventory는 LIST API를 반복 호출하는 대신 객체 목록과 메타데이터(암호화 상태, 복제 상태 등)를 정기 보고서로 만들어 줍니다. 보고서는 Athena 등으로 조회해 감사·관리에 활용합니다.", "why": ["자동 계층화는 S3 Intelligent-Tiering의 기능입니다.", "캐싱은 Amazon CloudFront의 기능입니다.", "정답. 정기적인 객체 목록 보고서입니다.", "복구는 버전 관리의 기능입니다. Inventory는 목록·감사 도구입니다."], "tags": ["S3", "S3 Inventory", "지식확인"]}, {"id": "m4-023", "module": 4, "level": "basic", "pick": 3, "q": "Amazon S3 요금에 직접 영향을 주는 항목을 고르시오.", "options": ["PUT, COPY, GET, LIST 등 요청 수", "S3에서 인터넷으로 나가는(송신) 데이터 전송량", "S3 콘솔에 로그인해 있던 시간", "저장한 데이터 양과 보관 기간, 스토리지 등급", "인터넷에서 S3로 업로드(수신)되는 데이터 전송량"], "answer": [0, 1, 3], "explain": "S3 비용은 스토리지 용량·등급, 요청 수, 데이터 송신(외부로 나가는 전송), 일부 등급의 검색 요금 등으로 결정됩니다. 인터넷에서 S3로 들어오는 데이터 전송은 무료입니다.", "why": ["정답. 요청 유형별로 요금이 부과됩니다.", "정답. 외부로 나가는 데이터 전송에는 요금이 부과됩니다.", "콘솔 로그인 시간은 과금 항목이 아닙니다.", "정답. GB-월 단위 스토리지 요금입니다.", "인터넷에서 S3로 들어오는 데이터 전송(수신)에는 요금이 없습니다."], "tags": ["S3", "비용", "지식확인"]}, {"id": "m4-024", "module": 4, "level": "basic", "pick": 1, "q": "S3 정적 웹 사이트 호스팅으로 제공할 수 없는 것은?", "options": ["PHP·JSP처럼 서버 측에서 실행되는 동적 스크립트", "HTML 페이지", "이미지·동영상 파일", "CSS·JavaScript 파일"], "answer": [0], "explain": "S3 정적 웹 사이트 호스팅은 HTML, CSS, 클라이언트 측 JavaScript, 이미지 같은 정적 콘텐츠만 제공합니다. PHP, JSP, ASP.NET처럼 서버에서 실행해야 하는 코드는 EC2 등 컴퓨팅 서비스가 필요합니다.", "why": ["정답. 서버 측 스크립트는 S3에서 실행되지 않습니다.", "HTML은 정적 콘텐츠로 제공할 수 있습니다.", "이미지·동영상 같은 정적 파일은 제공할 수 있습니다.", "CSS와 브라우저에서 실행되는 JavaScript는 제공할 수 있습니다."], "tags": ["S3", "정적 웹 사이트", "지식확인"]}, {"id": "m4-025", "module": 4, "level": "basic", "pick": 1, "q": "교재에서 제시한 Amazon S3의 일반적인 사용 사례에 해당하지 않는 것은?", "options": ["미디어 파일 호스팅", "정적 웹 사이트 호스팅", "중요한 데이터의 백업 및 아카이브", "EC2 인스턴스의 운영 체제 부팅(루트) 볼륨"], "answer": [3], "explain": "교재의 S3 사용 사례는 미디어 호스팅, 정적 웹 사이트, 연산·분석용 데이터 스토어, 백업·아카이브입니다. EC2의 부팅 볼륨은 EBS나 인스턴스 스토어 같은 블록 스토리지가 담당합니다.", "why": ["S3에 원본을 두고 CloudFront로 배포하는 사례가 나옵니다.", "정적 콘텐츠를 S3에서 바로 제공할 수 있습니다.", "S3 Standard와 Glacier 계열로 백업·아카이브를 구성합니다.", "정답. 객체 스토리지인 S3는 부팅 디스크로 사용할 수 없습니다."], "tags": ["S3", "사용 사례", "지식확인"]}, {"id": "m4-026", "module": 4, "level": "basic", "pick": 3, "q": "카페의 정적 웹 사이트를 S3 버킷에서 인터넷 사용자에게 공개하려고 한다. 반드시 필요한 설정을 고르시오.", "options": ["버킷 정책으로 모든 사용자에게 객체 읽기(s3:GetObject)를 허용한다", "버킷의 퍼블릭 액세스 차단 설정을 해제한다", "VPC에 NAT 게이트웨이를 생성한다", "EC2 인스턴스를 시작하고 Apache 웹 서버를 설치한다", "버킷에서 정적 웹 사이트 호스팅을 활성화하고 인덱스 문서를 지정한다"], "answer": [0, 1, 4], "explain": "S3 정적 웹 사이트를 공개하려면 웹 사이트 호스팅을 켜고(인덱스 문서 지정), 기본으로 켜져 있는 퍼블릭 액세스 차단을 해제한 뒤, 버킷 정책으로 공개 읽기를 허용해야 합니다. 서버나 VPC 구성은 필요 없습니다.", "why": ["정답. 익명 사용자가 객체를 읽을 수 있어야 합니다.", "정답. 퍼블릭 액세스 차단이 켜져 있으면 공개 정책이 적용되지 않습니다.", "NAT 게이트웨이는 프라이빗 서브넷의 아웃바운드 인터넷용이며 S3 웹 호스팅과 무관합니다.", "S3가 정적 콘텐츠를 직접 제공하므로 웹 서버가 필요 없습니다.", "정답. 웹 사이트 엔드포인트와 index.html 같은 인덱스 문서가 필요합니다."], "tags": ["S3", "정적 웹 사이트", "랩원리"]}, {"id": "m4-027", "module": 4, "level": "saa", "pick": 1, "q": "한 회사가 매일 판매 문서를 Amazon S3 버킷에 업로드한다. Solutions Architect는 사용자가 실수로 문서를 덮어쓰거나 삭제하더라도 데이터를 보호할 수 있어야 한다. 이 요구 사항을 충족하는 방법은?", "options": ["수명 주기 정책으로 문서를 매주 S3 Standard-IA로 전환한다", "S3 버킷에서 버전 관리를 활성화한다", "문서를 S3 One Zone-IA 등급에 저장한다", "Amazon S3 Inventory로 매일 객체 목록 보고서를 생성한다"], "answer": [1], "explain": "버전 관리를 켜면 덮어쓰기 시 이전 버전이 남고, 삭제 시에는 삭제 마커만 추가되어 이전 버전을 복구할 수 있습니다. 스토리지 등급 변경이나 목록 보고서는 실수로부터 데이터를 보호하지 못합니다.", "why": ["스토리지 등급 전환은 비용 최적화 기능일 뿐 덮어쓰기·삭제를 막지 못합니다.", "정답. 사용자 실수에 대한 직접적인 보호 수단입니다.", "One Zone-IA는 오히려 복원력이 낮은 저비용 등급이며 실수 방지 기능이 없습니다.", "Inventory는 목록·상태 보고 도구로 데이터를 복구하지 못합니다."], "tags": ["S3", "버전 관리", "샘플문항"]}, {"id": "m4-028", "module": 4, "level": "saa", "pick": 1, "q": "한 회사의 애플리케이션 로그는 생성 후 30일 동안 자주 조회되고, 이후 1년까지는 드물게 조회되지만 조회할 때는 즉시 읽을 수 있어야 한다. 1년이 지나면 로그를 삭제해도 된다. 데이터는 가용 영역 하나가 장애가 나도 유지되어야 한다. 가장 비용 효율적인 방법은?", "options": ["S3 Standard에 저장하고 30일 후 S3 Glacier Deep Archive로 전환, 365일 후 만료하는 수명 주기 규칙을 만든다", "모든 로그를 S3 Standard에 두고 EC2의 스크립트로 매일 오래된 로그를 찾아 삭제한다", "S3 Standard에 저장하고 30일 후 S3 Glacier Flexible Retrieval로 전환, 365일 후 만료하는 수명 주기 규칙을 만든다", "S3 Standard에 저장하고 30일 후 S3 One Zone-IA로 전환, 365일 후 만료하는 수명 주기 규칙을 만든다", "S3 Standard에 저장하고 30일 후 S3 Standard-IA로 전환, 365일 후 만료하는 수명 주기 규칙을 만든다"], "answer": [4], "explain": "30일 이후에도 즉시 읽어야 하고 여러 AZ 복원력이 필요하므로 Standard-IA가 맞습니다. 수명 주기 규칙의 전환·만료 작업으로 자동화하면 운영 부담도 없습니다.", "why": ["Deep Archive는 복원에 수 시간 이상 걸려 즉시 조회 요구를 충족하지 못합니다.", "저빈도 기간에도 Standard 요금을 내고 스크립트 운영 부담까지 생깁니다.", "Flexible Retrieval은 복원 요청이 필요해 즉시 읽을 수 없습니다.", "One Zone-IA는 단일 AZ에 저장되어 AZ 장애 시 데이터 유지 요구를 충족하지 못합니다.", "정답. 즉시 접근 + 다중 AZ + 저빈도 접근 비용 절감을 모두 충족합니다."], "tags": ["S3", "수명 주기", "스토리지 등급"]}, {"id": "m4-029", "module": 4, "level": "saa", "pick": 1, "q": "한 사진 서비스는 원본 이미지에서 생성한 썸네일을 S3에 저장한다. 썸네일은 원본에서 언제든 다시 생성할 수 있고, 한 달에 몇 번 정도만 조회되지만 조회 시 밀리초 단위로 응답해야 한다. 가장 비용 효율적인 스토리지 등급은?", "options": ["S3 Glacier Deep Archive", "S3 Standard", "S3 Standard-IA", "S3 Glacier Flexible Retrieval", "S3 One Zone-IA"], "answer": [4], "explain": "다시 만들 수 있는 데이터이므로 AZ 하나의 장애 위험을 감수할 수 있고, 저빈도·즉시 접근 조건에 맞는 가장 저렴한 등급은 One Zone-IA입니다.", "why": ["복원에 수 시간이 걸려 밀리초 응답이 불가능합니다.", "자주 접근하지 않는 데이터에 Standard는 비쌉니다.", "조건은 맞지만 다중 AZ에 저장하는 만큼 One Zone-IA보다 비쌉니다.", "복원 절차가 필요해 밀리초 응답이 불가능합니다.", "정답. 재생성 가능 + 저빈도 + 즉시 접근 = One Zone-IA."], "tags": ["S3", "스토리지 등급", "One Zone-IA"]}, {"id": "m4-030", "module": 4, "level": "saa", "pick": 1, "q": "한 금융 회사는 규정 때문에 거래 기록을 7년 이상 보관해야 한다. 이 데이터는 감사 때 외에는 거의 조회되지 않으며, 조회 요청이 오면 48시간 안에만 제공하면 된다. 스토리지 비용을 최소화하려면 어떤 등급을 사용해야 하는가?", "options": ["S3 Standard-IA", "S3 Glacier Deep Archive", "S3 Glacier Instant Retrieval", "S3 Intelligent-Tiering"], "answer": [1], "explain": "Glacier Deep Archive는 S3에서 가장 저렴한 등급으로, 7~10년 이상 장기 보관하며 거의 접근하지 않는 데이터용입니다. 표준 검색은 12시간 이내, 대량 검색은 48시간 이내에 복원되므로 요구 사항을 충족합니다.", "why": ["즉시 접근이 필요 없는 데이터에 Standard-IA는 비쌉니다.", "정답. 가장 저렴하며 48시간 내 복원 요구를 충족합니다.", "밀리초 접근이 필요할 때 쓰는 등급으로 Deep Archive보다 비쌉니다.", "Intelligent-Tiering은 접근 패턴을 모를 때 적합하며, 패턴이 명확한 장기 아카이브에는 Deep Archive가 더 저렴합니다."], "tags": ["S3", "Glacier Deep Archive", "아카이브"]}, {"id": "m4-031", "module": 4, "level": "saa", "pick": 1, "q": "한 병원은 의료 영상을 장기 보관한다. 영상은 분기에 한 번 정도 조회되지만, 의사가 요청하면 즉시(밀리초 단위) 열려야 한다. 이 요구 사항을 충족하면서 스토리지 비용이 가장 낮은 등급은?", "options": ["S3 Glacier Instant Retrieval", "S3 Standard", "S3 Standard-IA", "S3 Glacier Flexible Retrieval", "S3 Glacier Deep Archive"], "answer": [0], "explain": "Glacier Instant Retrieval은 거의 접근하지 않는 장기 데이터에 밀리초 접근을 제공하는 아카이브 등급으로, 분기 1회 정도 접근하는 데이터에서 Standard-IA보다 저장 비용이 낮습니다. Flexible Retrieval과 Deep Archive는 복원 절차가 필요합니다.", "why": ["정답. 아카이브 비용 + 밀리초 검색을 동시에 충족합니다.", "자주 접근하지 않는 데이터에 가장 비싼 선택입니다.", "밀리초 접근은 되지만 저장 단가가 Glacier Instant Retrieval보다 높습니다.", "신속 검색도 분 단위가 걸려 밀리초 요구를 충족하지 못합니다.", "복원에 수 시간이 걸립니다."], "tags": ["S3", "Glacier Instant Retrieval", "스토리지 등급"]}, {"id": "m4-032", "module": 4, "level": "saa", "pick": 2, "q": "미국 동부(버지니아 북부) 리전의 S3 버킷에 아시아와 유럽 사용자가 수 GB 크기의 동영상 파일을 업로드하는데 속도가 느리고 가끔 업로드가 중간에 실패한다. 애플리케이션 변경을 최소화하면서 업로드 성능과 안정성을 개선하는 방법을 고르시오.", "options": ["버킷에서 버전 관리를 활성화한다", "멀티파트 업로드를 사용해 파일을 파트로 나눠 병렬 업로드한다", "대륙별로 EC2 인스턴스를 만들어 파일을 받은 뒤 매일 밤 수동으로 버킷에 복사한다", "버킷에서 S3 Transfer Acceleration을 활성화하고 가속 엔드포인트를 사용한다", "버킷의 스토리지 등급을 S3 One Zone-IA로 변경한다"], "answer": [1, 3], "explain": "Transfer Acceleration은 가까운 엣지 로케이션과 AWS 백본으로 원거리 전송 경로를 개선하고, 멀티파트 업로드는 병렬 전송과 실패 파트만 재전송하는 방식으로 큰 파일 업로드를 빠르고 안정적으로 만듭니다.", "why": ["버전 관리는 데이터 보호 기능으로 전송 속도와 무관합니다.", "정답. 대용량 파일의 처리량과 복원력을 높입니다.", "운영 부담이 크고 실시간성이 떨어집니다.", "정답. 원거리 클라이언트의 전송 경로를 개선합니다.", "스토리지 등급은 전송 속도와 무관합니다."], "tags": ["S3", "Transfer Acceleration", "멀티파트 업로드"]}, {"id": "m4-033", "module": 4, "level": "saa", "pick": 1, "q": "한 회사는 외부 협력사가 비공개 S3 버킷의 보고서 파일 하나를 24시간 동안만 내려받을 수 있게 하려고 한다. 버킷을 공개하거나 협력사용 IAM 사용자를 만들고 싶지 않다. 가장 적절한 방법은?", "options": ["버킷에 CORS 구성을 추가해 협력사 도메인을 허용한다", "협력사용 IAM 사용자를 만들고 액세스 키를 이메일로 전달한다", "퍼블릭 액세스 차단을 gs": ["S3", "Glacier Deep Archive", "최소 기간", "비용"]}, {"id": "m4-048", "module": 4, "level": "saa", "pick": 1, "q": "Solutions Architect가 S3에 저장된 고객 데이터를 설계하면서 AWS Well-Architected Framework의 '저장된 데이터 보호' 모범 사례를 적용하려 한다. 이 모범 사례와 가장 직접적으로 관련된 조치는?", "options": ["S3 Transfer Acceleration을 활성화한다", "S3 Intelligent-Tiering으로 비용을 최적화한다", "저장 데이터에 서버 측 암호화를 적용하고 키 접근을 통제한다", "멀티파트 업로드로 처리량을 높인다"], "answer": [2], "explain": "보안 원칙의 데이터 보호(저장된 데이터 보호) 모범 사례는 저장 시 암호화와 접근 제어를 적용하는 것입니다. S3에서는 SSE-S3·SSE-KMS 같은 서버 측 암호화와 정책 기반 접근 제어가 이에 해당합니다.", "why": ["성능(전송) 관련 조치입니다.", "비용 최적화 원칙에 해당합니다.", "정답. 저장 시 암호화 = 저장된 데이터 보호.", "성능 관련 조치입니다."], "tags": ["S3", "Well-Architected", "암호화"]}, {"id": "m4-101", "module": 4, "level": "basic", "pick": 2, "q": "Amazon S3 버킷과 객체에 대한 설명으로 옳은 것을 고르시오.", "options": ["버킷 이름은 모든 AWS 계정을 통틀어 전 세계에서 고유해야 한다", "버킷은 리전을 지정하지 않는 글로벌 리소스로, 모든 리전에 동시에 존재한다", "객체 하나의 최대 크기는 5TB이다", "객체의 일부 바이트만 직접 수정할 수 있어 파일 시스템처럼 쓸 수 있다", "버킷 하나에는 최대 1,000개의 객체만 저장할 수 있다"], "answer": [0, 2], "explain": "버킷은 특정 리전에 만들며 이름은 전 세계에서 고유해야 합니다. 객체 하나는 최대 5TB이고, 버킷의 총 용량과 객체 수에는 제한이 없습니다. 객체는 일부만 수정할 수 없으므로 내용을 바꾸려면 다시 업로드합니다.", "why": ["정답. 버킷 이름은 전 세계 네임스페이스에서 고유해야 합니다.", "버킷은 생성할 때 지정한 특정 리전에 존재합니다.", "정답. 객체 하나의 최대 크기는 5TB입니다.", "객체 스토리지는 부분 수정이 안 되므로 변경 시 객체 전체를 다시 업로드합니다.", "버킷에 저장할 수 있는 객체 수에는 제한이 없습니다."], "tags": ["S3", "객체", "지식확인"]}, {"id": "m4-102", "module": 4, "level": "saa", "pick": 1, "q": "버전 관리가 활성화된 버킷에서 한 사용자가 버전 ID를 지정하지 않고 'contract.pdf'를 삭제했다. 이후 이 키로 GET 요청을 하면 404 Not Found가 반환된다. 삭제 직전의 파일을 다시 현재 버전으로 되돌리는 가장 간단한 방법은?", "options": ["버킷의 버전 관리를 일시 중지한다", "AWS Support에 삭제된 데이터 복구를 요청한다", "S3 Inventory 보고서에서 객체를 복원한다", "해당 객체의 삭제 마커를 삭제한다", "수명 주기 규칙에 만료 작업을 추가한다"], "answer": [3], "explain": "버전 관리 버킷에서 버전 ID 없이 삭제하면 객체가 지워지는 대신 삭제 마커가 현재 버전이 되어 GET이 404를 반환합니다. 이전 버전은 그대로 남아 있으므로, 삭제 마커를 삭제하면 바로 이전 버전이 다시 현재 버전이 됩니다.", "why": ["일시 중지해도 기존 삭제 마커와 버전은 그대로이며 복구되지 않습니다.", "이전 버전이 버킷에 남아 있으므로 사용자가 직접 복구할 수 있습니다.", "S3 Inventory는 객체 목록 보고서를 만드는 도구일 뿐 복원 기능이 없습니다.", "정답. 삭제 마커를 지우면 직전 버전이 현재 버전으로 돌아옵니다.", "만료 작업은 객체를 삭제하는 규칙이라 복구와 반대입니다."], "tags": ["S3", "버전 관리", "삭제 마커"]}, {"id": "m4-103", "module": 4, "level": "saa", "pick": 1, "q": "서울 리전 버킷에는 이미 객체 100만 개가 저장되어 있다. 관리자가 원본과 대상 버킷의 버전 관리를 켜고, 도쿄 리전 버킷으로 교차 리전 복제(CRR) 규칙을 구성했다. 며칠 뒤 확인해 보니 규칙을 만든 이후 업로드된 객체만 도쿄 버킷에 있고, 기존 객체는 없었다. 이에 대한 설명으로 옳은 것은?", "options": ["복제 규칙은 구성 이후 새로 업로드되는 객체부터 비동기로 복제하므로, 기존 객체는 별도로 복사(예: S3 배치 복제)해야 한다", "복제 규칙이 잘못 구성된 것이므로 버전 관리를 껐다가 다시 켜야 한다", "교차 리전 복제는 같은 계정의 버킷끼리는 동작하지 않는다", "기존 객체는 30일이 지나면 자동으로 복제된다"], "answer": [0], "explain": "S3 복제 규칙은 규칙을 만든 뒤 업로드되는 새 객체를 대상 버킷에 비동기로 복제합니다. 규칙 이전부터 있던 객체까지 대상에 두려면 S3 배치 복제 같은 별도 작업으로 복사해야 합니다.", "why": ["정답. 복제는 규칙 이후의 새 객체부터 적용됩니다.", "버전 관리는 복제의 필수 조건이며, 정상 동작 중인 규칙을 다시 구성할 필요가 없습니다.", "CRR은 같은 계정의 다른 리전 버킷으로도 구성할 수 있습니다.", "기존 객체가 시간이 지나면 자동으로 복제되는 규칙은 없습니다."], "tags": ["S3", "복제", "버전 관리"]}, {"id": "m4-104", "module": 4, "level": "saa", "pick": 1, "q": "S3 Glacier Flexible Retrieval에 보관한 백업 중 일부 파일이 장애 대응을 위해 급히 필요해졌다. 파일 크기는 수십 MB이고, 몇 분 안에 접근할 수 있어야 한다. 가장 적절한 방법은?", "options": ["대량(Bulk) 검색으로 복원을 요청한다", "표준(Standard) 검색으로 복원을 요청한다", "신속(Expedited) 검색으로 복원을 요청한다", "복원 요청 없이 일반 GET 요청으로 바로 내려받는다"], "answer": [2], "explain": "Glacier Flexible Retrieval의 객체는 복원 요청을 해야 접근할 수 있고, 검색 옵션에 따라 걸리는 시간이 다릅니다. 신속 검색은 보통 1~5분, 표준은 3~5시간, 대량은 5~12시간이 걸립니다. 몇 분 안에 필요하면 비용이 가장 높더라도 신속 검색을 사용합니다.", "why": ["대량 검색은 5~12시간이 걸리는 가장 저렴한 옵션입니다.", "표준 검색은 3~5시간이 걸립니다.", "정답. 신속 검색은 1~5분 안에 데이터에 접근할 수 있습니다.", "아카이브된 객체는 먼저 복원해야 하므로 일반 GET으로 바로 읽을 수 없습니다."], "tags": ["S3", "Glacier Flexible Retrieval", "아카이브"]}, {"id": "m4-105", "module": 4, "level": "saa", "pick": 1, "q": "한 버킷에는 'logs/' 접두사 아래의 애플리케이션 로그와 'reports/' 접두사 아래의 월간 보고서가 함께 저장된다. 로그는 90일 후 S3 Glacier Flexible Retrieval로 옮기고 1년 후 삭제하려 하지만, 보고서는 S3 Standard에 계속 그대로 두어야 한다. 운영 오버헤드가 가장 적은 방법은?", "options": ["버킷 전체에 90일 후 Glacier Flexible Retrieval로 전환하고 365일 후 만료하는 수명 주기 규칙을 만든다", "필터를 'logs/' 접두사로 지정한 수명 주기 규칙을 만들어 90일 후 전환, 365일 후 만료 작업을 정의한다", "EC2 인스턴스에서 매일 스크립트를 실행해 오래된 로그를 다른 등급으로 복사하고 삭제한다", "모든 객체를 S3 Intelligent-Tiering으로 옮긴다"], "answer": [1], "explain": "수명 주기 규칙은 버킷 전체 또는 접두사·태그 필터 단위로 적용할 수 있습니다. 'logs/' 접두사로 범위를 지정하면 보고서에는 영향을 주지 않고 로그만 자동으로 전환·만료되며, 애플리케이션을 바꿀 필요도 없습니다.", "why": ["버킷 전체에 적용하면 보고서까지 전환·삭제됩니다.", "정답. 접두사 필터로 대상을 로그로 좁힌 규칙입니다.", "수명 주기 규칙으로 자동화할 수 있는 작업을 직접 운영하면 오버헤드가 큽니다.", "보고서를 Standard에 그대로 두라는 요구와 맞지 않고, 1년 후 삭제도 처리하지 못합니다."], "tags": ["S3", "수명 주기", "비용"]}, {"id": "m4-106", "module": 4, "level": "saa", "pick": 1, "q": "규정상 고객 데이터는 서울 리전 밖으로 나가면 안 된다. 회사는 운영 계정의 서울 리전 버킷에 들어오는 새 로그 객체의 사본을, 보안팀이 관리하는 별도 계정의 서울 리전 버킷에도 자동으로 남기려 한다. 가장 적절한 방법은?", "options": ["원본 버킷에 같은 리전 복제(SRR) 규칙을 구성하고, 보안 계정의 서울 리전 버킷을 대상으로 지정한다", "도쿄 리전 버킷으로 교차 리전 복제(CRR)를 구성한다", "S3 Transfer Acceleration으로 보안 계정에 전송한다", "보안팀이 매일 S3 Inventory 보고서를 보고 객체를 수동으로 복사한다"], "answer": [0], "explain": "같은 리전 복제(SRR)는 같은 리전의 다른 버킷(다른 계정의 버킷 포함)으로 새 객체를 자동·비동기 복제합니다. 로그 통합이나 계정 분리에 쓰이며, 데이터가 리전 밖으로 나가지 않아 데이터 주권 요구도 지킵니다. 복제를 쓰려면 원본과 대상 버킷 모두 버전 관리가 켜져 있어야 합니다.", "why": ["정답. 같은 리전 안에서 다른 계정 버킷으로 자동 복제합니다.", "도쿄 리전으로 복제하면 데이터가 서울 리전 밖으로 나가 규정을 위반합니다.", "Transfer Acceleration은 원거리 업로드 속도를 높이는 기능으로 복제 기능이 아닙니다.", "수동 복사는 운영 부담이 크고 자동 복제 요구를 충족하지 못합니다."], "tags": ["S3", "복제", "데이터 주권"]}, {"id": "m4-107", "module": 4, "level": "basic", "pick": 2, "q": "S3의 버킷·객체 보호 도구와 그 설명이 올바르게 짝지어진 것을 고르시오.", "options": ["액세스 제어 목록(ACL) – 버킷 접근을 제어할 때 AWS가 가장 권장하는 방법이다", "사전 서명된 URL – 만료 시간이 없는 영구 공개 링크를 만든다", "퍼블릭 액세스 차단 – 버킷과 객체가 의도치 않게 공개되는 것을 막는다", "AWS Trusted Advisor – 업로드된 객체를 자동으로 암호화한다", "버킷 정책 – 버킷 단위 접근 규칙을 정의하며, 다른 계정이나 익명 사용자에게 접근을 허용하거나 거부 규칙으로 차단할 수 있다"], "answer": [2, 4], "explain": "퍼블릭 액세스 차단은 의도치 않은 공개 노출을 막고, 버킷 정책은 버킷 단위로 허용·거부 규칙을 정의하는 권장 방법입니다. ACL은 요즘 잘 쓰지 않으며, 사전 서명된 URL은 기간이 제한된 임시 URL이고, Trusted Advisor는 버킷 권한을 점검합니다.", "why": ["교재는 버킷 접근 제어에 ACL보다 버킷 정책을 권장합니다.", "사전 서명된 URL은 기간이 제한된 임시 URL입니다.", "정답. 퍼블릭 액세스 차단의 역할입니다.", "Trusted Advisor는 버킷 권한 검사를 제공할 뿐 암호화를 수행하지 않습니다.", "정답. 버킷 정책은 다른 계정·익명 접근 허용과 거부 규칙을 모두 지원합
